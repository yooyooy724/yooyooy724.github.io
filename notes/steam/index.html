 {id:'ds-camera', h:'Cave のカメラ ── 新方針で問題が小さくなりました', s:'k', b:`
  <p><code>Cave/SquareFitCamera.cs</code> の <code>Fit()</code> は <code>Screen.width</code> / <code>height</code> / <code>safeArea</code> から正方形が収まる <code>orthographicSize</code> を算出しています。横長画面では縦方向の制約が支配的になり、<b>Cave の描画が想定より大きく広がります。</b></p>
  <p class="note"><span class="okw">3カラム案を破棄したことで、この問題は軽くなりました。</span>前版では「カメラの <code>rect</code> を中央カラムの矩形に絞る」必要があり、その副作用として<b>左右カラムの背景が塗られない</b>(カメラは自分の矩形しかクリアしない)ため、背景専用カメラの追加が必要でした。<b>新方針では Cave が全幅を使うので、この追加作業は不要です。</b></p>
  <h4>それでも必要な修正</h4>
  <ol>
   <li><b><code>Fit()</code> の基準を <code>Screen.*</code> から <code>cam.pixelWidth</code> / <code>cam.pixelHeight</code> に変える。</b>縦長・横長を問わず「与えられた描画領域に正方形を収める」という同じロジックで動くようになり、<code>Screen.safeArea</code> 依存も同時に外せます</li>
   <li><b>UI が覆う領域を <code>Fit()</code> に伝える。</b>横長では下部に Soil / Tear Upgrade の2列が乗ります。画面全体に対して正方形を収めると、<span class="ng">Cave の下部が Upgrade パネルの裏に隠れます</span>。UI が実際に空けている中央領域の矩形を渡す必要があります</li>
   <li><b>レールの視認性。</b>レールに区切り線も背景も付けない方針(N4)なので、レールの背後に Cave が見えること自体は意図どおりです。ただし<b>ボタンが Cave の明るい部分に重なると視認性が落ちます</b>。レール直下だけ薄いグラデーションを敷く等の処理を検討してください</li>
  </ol>`},
 {id:'ds-mouse', h:'Equipment のマウス操作 ── 前提の訂正あり', s:'k', b:`
  <p class="note">⚠️ 調査の結果、<b>このゲームに Minecraft 的な「1マスにN個」のスタックは無い</b>ことが分かりました。1アイテム = 1インスタンス = 1スロット占有(guid で個体識別)、<code>StackBasedLevel</code> は「同種を何個マージしたか」であって個数ではありません。マージ条件は<b>同 Kind かつ同 Level の2個 → 1個</b>。<br>
  したがって Minecraft の「ダブルクリックで集約」は<b>そのままでは写像できず</b>、本作での対応物は「<b>同種同レベルのアイテムを可能な限り連続マージする</b>」になります。</p>
  <h4>提案する PC 操作</h4>
  <table><tr><th>操作</th><th>挙動</th><th>備考</th></tr>
  <tr><td><b>Shift + クリック</b></td><td>スロット ⇄ ストレージへ即時移動</td><td><b>最も効果が大きい</b>(現在は「選択→対象をタップ」の2手)</td></tr>
  <tr><td><b>ダブルクリック</b></td><td>可能な限り連続マージ</td><td>現在は詳細パネルに割り当て済み。<b>付け替えが必要</b></td></tr>
  <tr><td><b>右クリック</b></td><td>詳細パネルを開く</td><td>ダブルクリックから移設</td></tr>
  <tr><td><b>Ctrl + クリック</b></td><td>削除/リロールモードでの複数選択</td><td>既存の <code>DeletionModeManager</code> に載せる</td></tr>
  <tr><td><b>ホイール</b></td><td>ストレージのページ送り</td><td>30件/ページのページング式</td></tr></table>
  <p class="note">修飾キーの判定は<b>プロジェクト全体で未実装</b>(<code>shiftKey</code> / <code>ctrlKey</code> / <code>evt.button</code> は未使用)。<code>ItemDragHandler.OnPointerDown</code> に足すのが最小変更です。また <code>LongPressDuration = 0.1f</code> はマウスだと体感で引っかかるため<b>入力デバイスで値を分ける</b>べき。アイコンの表示制御が <code>display</code> でなく <code>opacity</code> 依存で、D&D のゴースト生成がこれを見ているので<b>触ると D&D が壊れます</b>。</p>
  <p><span class="okw">効果の見積もり:</span> 既に一括操作は充実しています(オートマージ / オート装備 / オート生成 / 一括削除 / 一括リロール / 一括変換 / 整列)。<b>PC 化で本当に効くのは Shift+クリックによる手数削減</b>で、それ以外は既存機能で足りている可能性が高いです。</p>`},
 {id:'ds-mergeapi', h:'「まとめてマージ」の処理をどこに書くか', s:'d', b:`
  <p class="note">2026-07-30 コメント:「何のことかわからない。」<b>前提の説明が抜けていたので、書き直します。</b></p>
  <h4>なぜこの話が出てきたか</h4>
  <p>PC 操作の提案の中に <b>「ダブルクリックで、可能な限り連続マージする」</b>という項目があります(→ 上の <a href="#display" onclick="go('display')">Equipment のマウス操作</a>)。<span class="kw">この1操作が、内部では「マージを何十回も繰り返す」処理になります。</span></p>
  <p>ところが、ドメイン(<code>GamesDomain</code>)側にあるマージの API は <code>CanMerge</code> / <code>Merge</code> だけで、<b>すべて「2個を1個にする」1回ぶんの処理</b>です。「できるだけ全部マージする」という API はありません。</p>
  <blockquote>例: 同じ種類・同じレベルのツルハシが 8 個ある<br>
  → 2個ずつマージして 4 個 → さらにマージして 2 個 → さらに 1 個<br>
  <b>この「繰り返す部分」を誰が書くのか、という話です。</b></blockquote>
  <h4>選択肢の違い</h4>
  <p>既存の<b>オートマージ機能</b>(<code>CrusherAutoMergeManager</code>)は、この繰り返しを <b>Unity 側(ViewModel 層)</b>に書いています。つまり既に前例があります。</p>
  <table><tr><th></th><th>A: Unity 側に書く</th><th>B: ドメインに書く</th></tr>
  <tr><td>書く場所</td><td><code>CrusherAutoMergeManager</code> と同じ層</td><td><code>GamesDomain</code> に <code>MergeAll()</code> のような API を足す</td></tr>
  <tr><td>テスト</td><td>書きにくい(Unity 依存)</td><td><span class="okw">書ける</span></td></tr>
  <tr><td>ビルド手順</td><td>不要</td><td><span class="ng">DLL のビルドと Unity への反映が必要</span>(→ AGENTS.md)</td></tr>
  <tr><td>モバイル版</td><td>既存オートマージとロジックが二重になる</td><td><span class="okw">オートマージも同じ API に寄せられる</span></td></tr></table>
  <p class="note">判断のポイントは<b>「既存のオートマージと同じロジックを2箇所に持つことを許すか」</b>です。<span class="ng">A を選ぶと、「連続マージ」と「オートマージ」というほぼ同じ処理が別々の場所に2つ存在することになります。</span>片方だけ修正して挙動がズレる、という形の不具合が起きやすくなります。</p>
  <p>なお、この判断は<b>横長対応とは無関係</b>です(PC のマウス操作の話です)。急ぎではありません。</p>`,
  opt:{items:[
   {k:'B',t:'ドメインに一括 API を足し、オートマージもそこへ寄せる',d:'「連続マージ」と既存のオートマージが同じ実装を共有するので、ロジックの二重化を作らずに済む。テストも書ける。代償は DLL ビルドと反映の手間。既存のオートマージを触ることになるので、そこだけ慎重に。',rec:true},
   {k:'A',t:'Unity 側(ViewModel 層)に書く',d:'既存 CrusherAutoMergeManager と同じ方式で、ドメインを触らないので DLL ビルドが不要。着手は速いが、似た処理が2箇所に増える。'},
  ]}},
 {id:'ds-key', h:'キーボードショートカット ── 数字キーとディスパッチャ', s:'k', b:`
  <p><b>実装点は1箇所。</b><code>Main/SceneSwitcherMono.cs:73-82</code> の <code>RegisterButtonFunc()</code> 呼び出しがタブ登録の唯一の場所で、<code>buttonReferences</code>(SceneKind → Button)を持っています。ここで<b>登録順に</b>キーを振るだけ。</p>
  <table><tr><th>キー</th><th>コンテンツ</th></tr>
  <tr><td>1〜6</td><td>Cave / Equipment / Battle_New / Shop / Prestige / Relic(登録順)</td></tr>
  <tr><td>—</td><td>ScreenSave(機能なので振らない) / Nether(タブに無い)</td></tr>
  <tr><td><code>Esc</code></td><td>ポップアップを閉じる / 何も開いていなければ設定を開く</td></tr>
  <tr><td><code>Space</code></td><td>主要アクション(コンテンツごとに定義)</td></tr></table>
  <p class="note">⚠️ Ads は Steam 版で廃止され番号が繰り上がるため、<b>固定値でハードコードせず登録順から動的に振ること</b>。そうすればモバイル版と Steam 版で別々の番号表を持たずに済みます。タブ UI に番号を表示すれば覚えなくても使えます。</p>
  <h4>設計 ── 各 View に Input.GetKeyDown を書かせない</h4>
  <p>コンテンツは「自分がアクティブなときの意味」を<b>宣言するだけ</b>にします(<code>IShortcutProvider</code>: Owner + Shortcuts)。ディスパッチャは1つだけで、アクティブな <code>SceneKind</code> の Provider にだけキーを流し、<b>起動時に全 Provider を集めて重複を検出</b>。割り当て済みのキーは<b>ボタンのラベルに自動表示</b>(<code>[Q] 採掘</code>)し、ヘルプ画面も同じデータから生成します。</p>`},
 {id:'ds-qwert', h:'QWERT に何を割り当てるか', s:'d', b:`
  <p>同じ物理キーが、開いているコンテンツによって別の意味を持ちます。Cave / Equipment / Battle それぞれで Q W E R T が何をするか、<b>コンテンツごとの個別設計</b>が要ります。現状は全て未定です。</p>
  <p class="note">→ <b>Q3「全部入り」</b>との整合なら C。ただしこれは<b>このサイトでの追加のブレストが必要</b>になる唯一の項目で、他の決定と違って「選んだら終わり」になりません。</p>`,
  opt:{items:[
   {k:'C',t:'全コンテンツ分いま決める',d:'Q3=全部入り と整合。コンテンツごとに専用ページを作ってブレストします(この決定の後に作業が続きます)。',rec:true},
   {k:'B',t:'Cave のみ先に決める',d:'最も長く滞在する画面から。他は 1.1 以降。'},
   {k:'A',t:'1.0 では実装しない',d:'ディスパッチャの器だけ作り、割り当ては空。数字キーと Esc/Space のみ。'},
  ]}},
 {id:'ds-misc', h:'その他の PC 対応', s:'k', b:`
  <table><tr><th>#</th><th>項目</th><th>対応</th></tr>
  <tr><td>P1</td><td><code>FrameRateController.cs</code> が <b>Windows を 30fps 固定</b>にしている</td><td>プラットフォーム分岐をやめ、設定値(既定 60)にする</td></tr>
  <tr><td>P2</td><td><code>forceSingleInstance: 0</code></td><td><b>1 に変更</b>(→ 04)</td></tr>
  <tr><td>P3</td><td>Standalone bundle ID が <code>com.idlesystem.IdleSphere</code>(旧作)</td><td>変更する</td></tr>
  <tr><td>P4</td><td>既定解像度 1024×768(4:3)</td><td>1280×720 以上に変更</td></tr>
  <tr><td>P5</td><td>解像度 / ウィンドウモード / vsync の設定 UI が無い</td><td><code>Settings/SettingsView.cs</code> に追加</td></tr>
  <tr><td>P6</td><td><code>Cave/Block/InputHandler.cs</code> にピンチズーム相当が無い</td><td>ホイールでズーム、中ドラッグでパン</td></tr>
  <tr><td>P7</td><td><code>ScreenSaveController.cs</code> がマウス移動を入力とみなさない</td><td><code>Input.mousePosition</code> の変化検出を追加。優先度低</td></tr></table>`},
 {id:'ds-first', h:'最初にやること', s:'k', b:`
  <blockquote><b>空の Windows ビルドを起動してスクリーンショットを撮る。</b></blockquote>
  <p>この章の横長時の挙動は<b>設定値とマークアップからの推論であり、実測ではありません</b>。実際の崩れ方を見てから段階1を設計すること。02 の作業順序 2(SteamAPI.Init 検証)と同じビルドで済みます。</p>`},
]},

/* ============================ 06 Steam 機能 ============================ */
{id:'features', nav:'06 Steam 機能', group:'仕様', title:'Steam 機能', desc:'Steam が提供する機能のうち、本作で使う候補と採否。', src:'docs/steam-release/06_Steam_Features.md', secs:[
 {id:'ft-list', h:'一覧と採否', s:'k', b:`
  <table><tr><th>機能</th><th>何か</th><th>採否</th></tr>
  <tr><td><b>実績</b></td><td>条件を満たすとアイコンとテキストが解除。プロフィールに並ぶ</td><td><b>必須</b></td></tr>
  <tr><td><b>統計</b></td><td>プレイヤーごとの数値を Steam 側に保存。実績の進捗表示に使う</td><td><b>必須</b>(実績の土台)</td></tr>
  <tr><td><b>Steam Cloud</b></td><td>セーブを Steam アカウントに同期。別 PC で自動復元</td><td><b>必須</b></td></tr>
  <tr><td><b>オーバーレイ</b></td><td>Shift+Tab で出る重ね表示。フレンド、ブラウザ、スクショ</td><td><b>必須</b>(実質デフォルトで動く)</td></tr>
  <tr><td><b>スクリーンショット</b></td><td>F12 で撮って Steam にアップロード</td><td><b>必須</b>(オーバーレイに付属)</td></tr>
  <tr><td><b>リッチプレゼンス</b></td><td>フレンドリストに「Cave 深度 1200 を探索中」を出す</td><td>採用</td></tr>
  <tr><td><b>リーダーボード</b></td><td>Steam がホストするランキング</td><td>検討</td></tr>
  <tr><td><b>トレーディングカード</b></td><td>プレイでドロップするカード。売買可能</td><td><b>見送り</b>(申請が要る。リリース後でよい)</td></tr>
  <tr><td><b>ワークショップ</b></td><td>ユーザー製 MOD の配布</td><td><b>見送り</b></td></tr>
  <tr><td><b>Steam 入力</b></td><td>コントローラ設計の統一レイヤ</td><td><b>見送り</b>(ゲームパッド非対応)</td></tr></table>`},
 {id:'ft-ach', h:'実績 ── 後から削除できない', s:'k', b:`
  <ul><li><b><code>IAchievementService</code> 経由で呼ぶ。</b>モバイル版は No-Op 実装なので、ゲームロジックに<b>プラットフォーム分岐を書かずに</b>解除呼び出しを置けます</li>
  <li>Steam は解除後に <code>Store()</code> の明示呼び出しが要る。毎フレーム呼ばず、まとめてコミットする</li>
  <li><b>オフラインでも解除できる</b>。Steam クライアントがローカルにキューし、オンライン復帰時に送る</li></ul>
  <table><tr><th>種類</th><th>例</th></tr>
  <tr><td>進行</td><td>Cave 深度 100 / 1000 / 10000 到達</td></tr>
  <tr><td>プレステージ</td><td>初回、10回、100回</td></tr>
  <tr><td>収集</td><td>Equipment を n 種類入手、Relic を全種入手</td></tr>
  <tr><td>戦闘</td><td>ステージクリア、ボス撃破</td></tr>
  <tr><td>累計</td><td>累計採掘量、累計プレイ時間</td></tr>
  <tr><td>隠し</td><td>スクリーンセーバーを n 分見る 等</td></tr></table>
  <blockquote><b>実績は後から削除できません。</b>追加はできますが、削除・意味の変更は取得済みプレイヤーに影響します。<b>最初に全体像を決めてから登録すること。</b></blockquote>`},
 {id:'ft-achnum', h:'実績の数', s:'d', b:`
  <p>多すぎると1つの価値が下がり、少なすぎるとコンプリート欲が働きません。アイドルゲームは 30〜60 が相場。<b>アイコン制作コスト(解除前/解除後の2種 × 実績数)が直結します</b>。</p>
  <p class="note">→ <b>Q6「自作のみ」が確定済み</b>なので、選んだ数だけ自分でアイコンを描くことになります(B なら 60〜120 枚)。<b>統一テンプレートを先に決めて量産できる形にする</b>のが前提条件です。Q3「全部入り」との整合なら B 以上。</p>
  <h4>2026-07-30 決定: B(30〜60)。コメント「30以上を目指す。」</h4>
  <p><b>下限を 30 として進めます。</b>アイコンは<span class="ng">解除前/解除後の2種 × 30 = 最低 60 枚</span>からの出発になります。</p>
  <p class="note"><span class="okw">実績には、マネタイズ側で1つ役割が付きました。</span><a href="#money" onclick="go('money')">ダイヤの蛇口</a>の検討で、Steam では <code>DailyDiamond</code>(広告視聴でダイヤ)の枠が消えるため、<b>実績にダイヤを紐づけて蛇口の1本にする</b>案を出しています。案2(デイリー付与型)が選ばれたので必須ではなくなりましたが、<b>実績の設計時に「報酬を持たせるか」を一度決めておく</b>と後から足しやすくなります。</p>`,
  opt:{items:[
   {k:'A',t:'20〜30(絞る)',d:'アイコン制作が現実的。既存コンテンツの節目だけを拾う。'},
   {k:'B',t:'30〜60(相場)',d:'コンプリート欲が働く。アイコンは統一テンプレで量産する前提。',rec:true},
   {k:'C',t:'60以上',d:'実績目当てのプレイヤーに刺さるが、制作と判定実装の工数が大きい。'},
  ]}},
 {id:'ft-achwhere', h:'実績条件をどこで判定するか', s:'d', b:`
  <p>資料の推奨は「<b>ドメイン(GamesDomain)に判定を置き、Unity 側の <code>IAchievementService</code> は解除呼び出しだけを担う</b>」。既存のセーブデータから実績条件を判定できるかは <code>IdleSystem.Core.dll</code> 内のドメインに依存します。</p>`,
  opt:{items:[
   {k:'A',t:'ドメインに判定を置く',d:'テストが書ける。モバイル版でも同じ判定が使える(No-Op なので実害なし)。DLL ビルドと反映が必要。',rec:true},
   {k:'B',t:'Unity 側に判定を置く',d:'ドメインを触らない。ただし判定ロジックがテスト外に出る。'},
  ]}},
 {id:'ft-lb', h:'リーダーボード ── フレンド内のみ。初回リリースからは外す', s:'k', b:`
  <p>2026-07-28 <b>B(フレンド内ランキングのみ)で確定。</b>全世界順位は出しません。実装コストは低く(スコア送信と取得の API のみ)、比較対象としては機能しつつ、<span class="okw">改ざんの影響が身内に閉じます</span>。</p>
  <p class="note">2026-07-30 追記コメント:「<b>0.1 には含めない。</b>」<br>
  → <b>作るが、初回リリースには載せない</b>と解釈しました。つまり「採用するが後回し」です。</p>
  <blockquote><span class="ng">⚠️ これは Q3「1.0 のスコープ = 全部入り」に対する、初めての明示的な削減です。</span><b>リリース計画上、意図的な例外として扱ってよいか確認させてください。</b><br>
  また「<b>0.1</b>」が <b>1.0(初回リリース)</b>を指すのか、それとも<b>1.0 より前の内部ビルド</b>を指すのかで意味が変わります。前者なら「1.0 では出さず 1.1 以降」、後者なら「1.0 には入る」になります。</blockquote>
  <p><span class="okw">後回しにする判断自体は筋が通っています。</span>リーダーボードは<b>他の機能に依存されていない末端の機能</b>で、後から足しても既存の設計に影響しません。さらに、<a href="#save" onclick="go('save')">改ざん対策</a>が B(AES のみ)で、メモリ改変が防げないまま残ることを踏まえると、<b>スコアを公開する機能を急がないのは妥当です</b>。</p>
  <h4>この決定と噛み合った他の決定</h4>
  <ul>
   <li><span class="okw">同日に <a href="#save" onclick="go('save')">改ざん対策の強化</a>が決まったため、リーダーボードの最大の弱点が同時に手当てされます。</span>前版では「セーブがローカルにある以上改ざんは容易」という理由でリーダーボードに慎重でしたが、暗号化と ACTk が入る前提なら成立します。</li>
   <li>フレンド内に閉じることで、<b>サーバー側での妥当性検証を必須にしないで済みます</b>。全世界ランキングなら不正対策が本格的に必要になりますが、フレンド内なら「身内の見栄」の範囲で収まります。</li>
   <li><span class="ng">残る論点:</span> 何をスコアにするか。<b>放置時間に比例する指標(深度・累計通貨)は、長くプレイした人が自動的に上位になる</b>ため順位が固定化します。プレステージ回数のような「密度」を表す指標を併置するかは、実装時に決めます。</li>
  </ul>`},
 {id:'ft-rp', h:'リッチプレゼンス ── Cave 名 + 到達深度で確定', s:'k', b:`
  <p>2026-07-28 <b>「もっとも新しい Cave 名と到達した深度」で確定。</b>フレンドリストに次の形で表示されます:</p>
  <blockquote>Idle Minertia をプレイ中 ── <b>{Cave 名} 深度 {N}</b></blockquote>
  <p>表示文字列は<b>ローカライズ用のキー</b>で送るので、既存の13言語対応がそのまま活きます。更新頻度は低くてよい(深度が変わったときだけで十分)。</p>
  <h4>実装時に決めること</h4>
  <table><tr><th>#</th><th>論点</th><th>方針案</th></tr>
  <tr><td>1</td><td><b>Cave 名のローカライズ</b></td><td>Cave 名は既存のローカライズテーブルにあるはず。<span class="ng">Steam のリッチプレゼンスは自前の翻訳トークンを Steamworks 側に登録する必要がある</span>ため、<b>ゲーム内の13言語と Steamworks 側の登録を二重管理することになります</b>。ここは要確認</td></tr>
  <tr><td>2</td><td>「もっとも新しい Cave」の定義</td><td><b>到達済みの最深 Cave</b>か、<b>今いる Cave</b>か。放置中に前の Cave を周回している場合に表示が食い違う</td></tr>
  <tr><td>3</td><td>Cave 未到達時・起動直後</td><td>フォールバック文字列を用意する(「探索の準備中」等)</td></tr>
  <tr><td>4</td><td>Cave 名のネタバレ</td><td>後半の Cave 名がフレンドリストに出ることで、<b>未プレイのフレンドにネタバレになる可能性</b>。ストーリー性を持たせる方針(→ <a href="#hypothesis" onclick="go('hypothesis')">前提</a>)なら、名前の出し方に注意が要ります</td></tr></table>
  <p class="note">論点 1 は工数として無視できません。<b>Steamworks 側のリッチプレゼンス翻訳は管理画面での登録作業</b>になるため、Cave が追加されるたびに登録漏れが起きます。<span class="kw">Cave 名を出さず深度だけにすればこの問題は消えます</span>が、今回の決定は Cave 名を出す方針なので、<b>登録手順を Steamworks 覚書に残しておくべきです</b>(→ <a href="#steamworks" onclick="go('steamworks')">Steamworks 管理画面</a>)。</p>`},
 {id:'ft-ov', h:'オーバーレイの確認事項', s:'k', b:`
  <p><b>基本的に何もしなくても動きます。</b>ただし:</p>
  <table><tr><th>#</th><th>確認</th></tr>
  <tr><td>O1</td><td><code>Application.OpenURL</code>(Discord 3箇所、プライバシーポリシー1箇所)が Steam Overlay 経由で開く。<b>Overlay を無効にしているユーザーで外部ブラウザにフォールバックするか</b>要確認</td></tr>
  <tr><td>O2</td><td>フルスクリーン時にオーバーレイが正しく重なるか(排他フルスクリーンだと問題が出ることがある。<b>ボーダーレス推奨</b>)</td></tr>
  <tr><td>O3</td><td>オーバーレイを開いた際にゲームが一時停止すべきか(アイドルゲームなので<b>停止しない</b>のが正解)</td></tr></table>`},
]},

/* ============================ 覚書 ============================ */
{id:'steamworks', nav:'Steamworks 管理画面', group:'覚書', title:'Steamworks 管理画面の作業', desc:'仕様ではなく、リリース前にやることの覚書。', src:'docs/steam-release/Memo/Steamworks_Setup.md', secs:[
 {id:'sw-appid', h:'AppID ── 新規取得が必要（確定）', s:'k', b:`
  <p>2026-07-28 <b>既存の <code>3217600</code> は旧作(Idle Sphere)用</b>と確定。本作用に<span class="kw">新規取得が必要</span>です。</p>
  <ul>
   <li><b>Steam Direct $100</b>(アプリごと)の支払いが発生します。Q6「自作のみ・追加費用は最小」の唯一の例外として確定した支出です。</li>
   <li>取得後、<b>審査待ち期間</b>が入ります。Q4 で期限は設けない方針ですが、<span class="kw">これは自分では縮められない待ち時間</span>なので、<b>他の作業と並行して最初に着手する価値があります</b>。</li>
   <li>旧 AppID に紐づく残骸は整理対象: <code>steam_appid.txt</code> の値、<code>Assets/Editor/DeploySteam.cs</code>(実質作り直し)、Standalone bundle ID <code>com.idlesystem.IdleSphere</code>。</li>
   <li>macOS も同時対応(Q2=B)なので、<b>Depot は Windows / macOS の2系統</b>を最初から設計します。</li>
  </ul>`},
 {id:'sw-todo', h:'やることリスト', s:'k', b:`
  <h4>アプリ設定</h4>
  <ul><li>AppID の確認 / 新規取得</li><li>アプリ名、対応 OS、対応言語の登録(本作は13言語)</li><li>Depot 構成(Windows / macOS を分けるか共通にするか)</li><li>Branch 構成(<code>default</code> / <code>beta</code>)</li></ul>
  <h4>ストアページ</h4>
  <ul><li>説明文(13言語分? 最低でも英語 + 日本語)</li><li>カプセル画像各サイズ、スクリーンショット、トレーラー</li><li>タグ、ジャンル、カテゴリ</li><li>価格設定(F2P なら本体無料)</li></ul>
  <h4>審査・法務</h4>
  <ul><li>年齢レーティング</li><li>プライバシーポリシー(既存 URL を流用できるか)</li><li>ストアページ審査 → 公開 → リリースまでの必須待機期間</li><li>ビルド審査の所要日数</li></ul>
  <h4>機能</h4>
  <ul><li>実績の登録(<b>後から削除できないので一覧確定後に</b>)</li><li>統計の登録</li><li>Steam Cloud の設定(同期対象パス、容量割当)</li><li>リッチプレゼンスの文言登録(多言語)</li></ul>`},

 {id:'rk-5', h:'R5. モバイル版を壊すリスク', s:'t', b:`

/* ---------- store ---------- */
const LS_KEY='minertia_steam_feedback_v1';
const PEND_KEY='minertia_steam_pending_v1';
const SITE='steam';
const GH_ISSUE='https://github.com/yooyooy724/yooyooy724.github.io/issues/new';
const API=(location.protocol==='http:'||location.protocol==='https:')?'':'http://localhost:8138';
let SERVER=false;           // サーバー接続中なら feedback.json へ自動永続化
let PROPOSE=false;          // 静的配信(GitHub Pages)。変更は手元に溜め、Issue で送る
let STORE={comments:{},reactions:{},choices:{}};   // 表示用(公開分 + 未送信分)
let BASE={comments:{},reactions:{},choices:{}};    // 公開されている分
let PENDING={comments:{},reactions:{},choices:{}}; // まだ送っていない分
try{const s=localStorage.getItem(LS_KEY); if(s) STORE=Object.assign({comments:{},reactions:{},choices:{}},JSON.parse(s));}catch(e){}
function emptyFb(){return {comments:{},reactions:{},choices:{}};}
function pendCount(){
  return Object.keys(PENDING.choices).length
    +Object.keys(PENDING.reactions).length
    +Object.values(PENDING.comments).reduce((n,a)=>n+a.length,0);
}
function savePending(){
  try{localStorage.setItem(PEND_KEY,JSON.stringify(PENDING));}catch(e){}
}
let postTimer=null;
function save(){
  if(PROPOSE){savePending();return;}
  try{localStorage.setItem(LS_KEY,JSON.stringify(STORE));}catch(e){}
  if(SERVER){
    clearTimeout(postTimer);
    postTimer=setTimeout(()=>{
      fetch(API+'/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(STORE)})
        .catch(()=>{SERVER=false;renderTop();});
    },250);
  }
}
function mergeStores(local,remote){
  const out={comments:{},reactions:{},choices:{}};
  const ids=new Set(Object.keys(local.comments||{}).concat(Object.keys(remote.comments||{})));
  for(const id of ids){
    const seen=new Set();const arr=[];
    const all=(remote.comments&&remote.comments[id]||[]).concat(local.comments&&local.comments[id]||[]);
    for(const c of all){const k=c.ts+'|'+c.text;if(!seen.has(k)){seen.add(k);arr.push(c);}}
    arr.sort((a,b)=>a.ts<b.ts?-1:1);
    if(arr.length)out.comments[id]=arr;
  }
  out.reactions=Object.assign({},remote.reactions||{},local.reactions||{});
  out.choices=Object.assign({},remote.choices||{},local.choices||{});
  return out;
}
async function connectServer(){
  try{
    const r=await fetch(API+'/api/feedback',{cache:'no-store'});
    if(!r.ok)throw 0;
    const remote=await r.json();
    STORE=mergeStores(STORE,remote);   // 過去分(ファイル)とこのブラウザ分を統合
    SERVER=true;
    save();                             // 統合結果をファイルへ書き戻し
    return;
  }catch(e){SERVER=false;}
  // サーバーが無い場合、同じ場所に置かれた feedback.json を静的に読む。
  // GitHub Pages 配信はこの経路。変更は手元に溜めて Issue でまとめて送る。
  try{
    const r=await fetch('feedback.json',{cache:'no-store'});
    if(!r.ok)throw 0;
    const remote=await r.json();
    if(!remote||typeof remote!=='object')throw 0;
    BASE={comments:remote.comments||{},reactions:remote.reactions||{},choices:remote.choices||{}};
    PROPOSE=true;
    try{const p=localStorage.getItem(PEND_KEY); if(p)PENDING=Object.assign(emptyFb(),JSON.parse(p));}catch(e){}
    reconcile();                        // 公開側に載った分を未送信リストから外す
    STORE=mergeFb(BASE,PENDING);
  }catch(e){}
}
// 公開データに既に反映されている変更を PENDING から取り除く。
// 「送信しましたか?」と聞く代わりに実データで判定するので、申告のズレが起きない。
function reconcile(){
  // 解除(空文字)と未設定(undefined)は同じ状態なので揃えて比べる
  for(const id of Object.keys(PENDING.choices))
    if((BASE.choices[id]||'')===(PENDING.choices[id]||''))delete PENDING.choices[id];
  for(const id of Object.keys(PENDING.reactions))
    if((BASE.reactions[id]||'')===(PENDING.reactions[id]||''))delete PENDING.reactions[id];
  for(const id of Object.keys(PENDING.comments)){
    const seen=new Set((BASE.comments[id]||[]).map(c=>c.ts+'|'+c.text));
    const rest=PENDING.comments[id].filter(c=>!seen.has(c.ts+'|'+c.text));
    if(rest.length)PENDING.comments[id]=rest; else delete PENDING.comments[id];
  }
  savePending();
}
// 表示用の合成。scripts/notes-merge.mjs と同じ規則(和集合・後勝ち)。
function mergeFb(base,patch){
  const out=emptyFb();
  const ids=new Set(Object.keys(base.comments||{}).concat(Object.keys(patch.comments||{})));
  for(const id of ids){
    const seen=new Set();const arr=[];
    for(const c of (base.comments[id]||[]).concat(patch.comments[id]||[])){
      const k=c.ts+'|'+c.text;
      if(seen.has(k))continue;seen.add(k);arr.push(c);
    }
    arr.sort((a,b)=>String(a.ts).localeCompare(String(b.ts)));
    if(arr.length)out.comments[id]=arr;
  }
  out.reactions=Object.assign({},base.reactions,patch.reactions);
  out.choices=Object.assign({},base.choices,patch.choices);
  for(const key of ['reactions','choices'])
    for(const k of Object.keys(out[key]))if(!out[key][k])delete out[key][k];
  return out;
}
// 未送信分を Issue の本文に載せて GitHub を開く。ページ側に認証情報は持たない。
function submitToGitHub(){
  const n=pendCount();
  if(!n){alert('未送信の変更はありません。');return;}
  const payload=Object.assign({site:SITE,at:new Date().toISOString()},PENDING);
  const body='### notes-inbox\n\nこの Issue は自動処理されます。内容を編集しないでください。\n\n```json\n'
    +JSON.stringify(payload)+'\n```\n';
  const title='[notes-inbox] '+SITE+' '+n+'件';
  const url=GH_ISSUE+'?title='+encodeURIComponent(title)+'&body='+encodeURIComponent(body);
  if(url.length>7500){
    // URL が長すぎるとブラウザ/GitHub 側で切られる。手貼りに切り替える。
    navigator.clipboard.writeText(body).then(
      ()=>{alert('変更が多いため本文をクリップボードにコピーしました。\n開いた画面のタイトルを「'+title+'」にして、本文に貼り付けてください。');
           window.open(GH_ISSUE,'_blank');},
      ()=>prompt('この本文をコピーして、新規 Issue に貼り付けてください（タイトル: '+title+'）',body));
    return;
  }
  window.open(url,'_blank');
  alert('GitHub の画面が開きます。内容を確認して「Submit new issue」を押してください。\n\n反映されるとこのページに載ります（1分ほど）。未送信の表示は、反映を検知したときに自動で消えます。');
}

/* ---------- state ---------- */
let curPage=location.hash?location.hash.slice(1):'home';
let filter='all';
function allSecs(){const out=[];for(const p of DB){for(const s of p.secs)out.push({p,s});}return out;}
function decisions(){return allSecs().filter(x=>x.s.opt);}
function decDone(){return decisions().filter(x=>STORE.choices[x.s.id]).length;}
function pageCommentCount(p){let n=0;for(const s of p.secs){n+=(STORE.comments[s.id]||[]).length;}return n;}
function pageOpenDec(p){let n=0;for(const s of p.secs){if(s.opt&&!STORE.choices[s.id])n++;}return n;}
function totalFeedback(){let n=0;for(const k in STORE.comments)n+=STORE.comments[k].length;for(const k in STORE.reactions)if(STORE.reactions[k])n++;for(const k in STORE.choices)if(STORE.choices[k])n++;return n;}
function optOf(sec,k){return sec.opt.items.find(i=>i.k===k);}

/* ---------- nav ---------- */
function renderNav(){
  const nav=document.getElementById('nav');
  const tot=decisions().length, done=decDone();
  const pct=tot?Math.round(done/tot*100):0;
  let html='<div class="brand"><h1>MINERTIA / STEAM</h1><small>リリース企画すり合わせサイト</small></div>';
  html+='<div class="prog">決定 <b>'+done+'</b> / '+tot+'（'+pct+'%）<div class="bar"><i style="width:'+pct+'%"></i></div></div>';
  let grp='';
  for(const p of DB){
    if(p.group!==grp){grp=p.group;html+='<div class="grp">'+grp+'</div>';}
    const c=pageCommentCount(p), d=pageOpenDec(p);
    html+='<button class="nv'+(p.id===curPage?' on':'')+'" onclick="go(\''+p.id+'\')"><span>'+p.nav+'</span><span>'
      +(d?'<span class="cnt dec">要'+d+'</span> ':'')
      +(c?'<span class="cnt">💬'+c+'</span>':'')+'</span></button>';
  }
  html+='<div class="grp">フィードバック</div>';
  html+='<button class="nv'+(curPage==='feedback'?' on':'')+'" onclick="go(\'feedback\')"><span>決定・コメント書き出し</span>'+(totalFeedback()?'<span class="cnt">'+totalFeedback()+'</span>':'')+'</button>';
  nav.innerHTML=html;
}
function go(id){curPage=id;location.hash=id;render();window.scrollTo(0,0);}

/* ---------- top ---------- */
function renderTop(){
  const t=document.getElementById('top');
  const f=[['all','すべて'],['d','要決定のみ'],['q','未調査のみ'],['t','提案のみ'],['k','確定のみ'],['c','コメント付き']];
  const n=PROPOSE?pendCount():0;
  const mode=PROPOSE
    ?'<span class="mode ro" title="変更はこの端末に溜まります。「GitHubへ送信」で反映されます">📤 提案モード'+(n?'（未送信 '+n+'）':'')+'</span>'
    :SERVER
    ?'<span class="mode on" title="決定・コメントは feedback.json へ自動保存されています">💾 自動保存ON</span>'
    :'<span class="mode off" title="start_site.bat を起動すると、決定・コメントがファイルへ自動保存されます(現在はこのブラウザ内のみ)">⚠ 自動保存OFF</span>';
  const send=PROPOSE
    ?'<button class="exp'+(n?'':' dim')+'" onclick="submitToGitHub()">📤 GitHubへ送信'+(n?'（'+n+'）':'')+'</button>'
    :'';
  t.innerHTML=f.map(x=>'<button class="flt'+(filter===x[0]?' on':'')+'" onclick="setFilter(\''+x[0]+'\')">'+x[1]+'</button>').join('')
   +mode
   +'<button class="exp" onclick="exportMD()">📋 書き出し</button>'
   +send;
}
function setFilter(f){filter=f;render();}

/* ---------- page ---------- */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function badgeOf(s){
  return s==='k'?'<span class="badge b-k">確定(仮)</span>'
    :s==='t'?'<span class="badge b-t">提案</span>'
    :s==='d'?'<span class="badge b-d">要決定</span>'
    :s==='q'?'<span class="badge b-q">未調査</span>':'';
}
function optsHtml(sec){
  if(!sec.opt)return '';
  const cur=STORE.choices[sec.id]||'';
  const unsent=PROPOSE&&Object.prototype.hasOwnProperty.call(PENDING.choices,sec.id);
  let h='<div class="opts"><div class="ttl">▼ 選んでください（もう一度押すと解除 / どれでもない場合はコメントへ）</div>';
  for(const it of sec.opt.items){
    const on=cur===it.k;
    const inner='<span class="k">'+(on?'✓':it.k)+'</span>'
      +'<span><b>'+it.t+'</b>'+(it.rec?'<span class="rec">推奨</span>':'')+'<span class="d">'+it.d+'</span></span>';
    h+='<button class="opt'+(on?' on':'')+'" onclick="pick(\''+sec.id+'\',\''+it.k+'\')">'+inner+'</button>';
  }
  if(cur)h+='<div class="picked">✓ 決定: '+cur+'（'+(optOf(sec,cur)?optOf(sec,cur).t:'')+'）'
    +(unsent?'<span class="unsent">未送信</span>':'')+'</div>';
  else if(unsent)h+='<div class="picked"><span class="unsent">未送信</span> 解除しました</div>';
  h+='</div>';
  return h;
}
function secHtml(p,s){
  const cms=STORE.comments[s.id]||[];
  const rea=STORE.reactions[s.id]||'';
  let vis=true;
  if(filter==='t')vis=(s.s==='t');
  if(filter==='k')vis=(s.s==='k');
  if(filter==='d')vis=(s.s==='d'||!!s.opt);
  if(filter==='q')vis=(s.s==='q');
  if(filter==='c')vis=cms.length>0;
  const isDec=!!s.opt&&!STORE.choices[s.id];
  const pend=PROPOSE?(PENDING.comments[s.id]||[]):[];
  const isPend=(c)=>pend.some(p=>p.ts===c.ts&&p.text===c.text);
  const reaUnsent=PROPOSE&&Object.prototype.hasOwnProperty.call(PENDING.reactions,s.id);
  const fz='<div class="fzone">'
    +'<div class="rrow">'
    +'<button class="rbtn'+(rea==='ok'?' on-ok':'')+'" onclick="react(\''+s.id+'\',\'ok\')">👍 OK</button>'
    +'<button class="rbtn'+(rea==='ng'?' on-ng':'')+'" onclick="react(\''+s.id+'\',\'ng\')">✋ 要変更</button>'
    +(reaUnsent?'<span class="unsent">未送信</span>':'')
    +'<button class="cbtn" onclick="toggleC(\''+s.id+'\')">💬 コメント ('+cms.length+')</button>'
    +'</div>'
    +'<div class="clist">'+cms.map((c,i)=>{
        const p=isPend(c);
        // 公開済みのコメントには削除ボタンを出さない(提案モードでは消せないため)
        const del=(!PROPOSE||p)?'<button class="del" onclick="delC(\''+s.id+'\','+i+')">削除</button>':'';
        return '<div class="citem"><div class="meta"><span>'+c.ts+(p?'<span class="unsent">未送信</span>':'')+'</span>'+del+'</div>'
          +esc(c.text).replace(/\n/g,'<br>')+'</div>';
      }).join('')+'</div>'
    +'<div class="cform" id="cf-'+s.id+'"><textarea id="ta-'+s.id+'" placeholder="このブロックへのコメント・変更指示を入力…"></textarea><br><button class="save" onclick="addC(\''+s.id+'\')">保存</button></div>'
    +'</div>';
  return '<div class="sec'+(vis?'':' hide')+(isDec?' dec':'')+'" id="sec-'+s.id+'">'
    +'<div class="shead"><h3>'+s.h+'</h3>'+badgeOf(s.s)+'</div>'
    +'<div class="sbody">'+s.b+optsHtml(s)+'</div>'
    +fz+'</div>';
}
function renderPage(){
  const el=document.getElementById('page');
  if(curPage==='feedback'){renderFeedback(el);return;}
  const p=DB.find(x=>x.id===curPage)||DB[0];
  let html='<div class="phead"><h2>'+p.title+'</h2><p>'+p.desc+'</p>'+(p.src?'<div class="src">原典: '+p.src+'</div>':'')+'</div>';
  if(p.id==='board'){el.innerHTML=html+boardHtml();return;}
  for(const s of p.secs)html+=secHtml(p,s);
  el.innerHTML=html;
}

/* ---------- board ---------- */
function boardHtml(){
  const ds=decisions();
  const open=ds.filter(x=>!STORE.choices[x.s.id]);
  const done=ds.filter(x=>STORE.choices[x.s.id]);
  const qs=allSecs().filter(x=>x.s.s==='q');
  let h='';
  h+='<div class="bd-grp">未決定（'+open.length+'）</div>';
  if(!open.length)h+='<div class="empty">すべて決定済みです。フェーズ2へ進めます。</div>';
  for(const x of open){
    h+='<div class="bd"><div class="to">'+x.p.title+'</div><h4>'+x.s.h+'</h4>'
      +'<div class="st note">候補: '+x.s.opt.items.map(i=>i.k+'. '+i.t).join(' ／ ')+'</div>'
      +'<div><a href="#'+x.p.id+'" onclick="go(\''+x.p.id+'\')">→ このブロックを開いて決める</a></div></div>';
  }
  h+='<div class="bd-grp">外部確認が必要（未調査 '+qs.length+'）</div>';
  for(const x of qs){
    h+='<div class="bd"><div class="to">'+x.p.title+'</div><h4>'+x.s.h+'</h4>'
      +'<div><a href="#'+x.p.id+'" onclick="go(\''+x.p.id+'\')">→ 開く</a></div></div>';
  }
  h+='<div class="bd-grp">決定済み（'+done.length+'）</div>';
  if(!done.length)h+='<div class="empty">まだありません。</div>';
  for(const x of done){
    const k=STORE.choices[x.s.id];const it=optOf(x.s,k);
    h+='<div class="bd done"><div class="to">'+x.p.title+'</div><h4>'+x.s.h+'</h4>'
      +'<div class="st"><span class="okw">✓ '+k+'</span> '+(it?it.t:'')+'</div>'
      +'<div><a href="#'+x.p.id+'" onclick="go(\''+x.p.id+'\')">→ 開く</a></div></div>';
  }
  return h;
}

/* ---------- feedback page ---------- */
function renderFeedback(el){
  let items=[];
  for(const p of DB){for(const s of p.secs){
    const cms=STORE.comments[s.id]||[];const rea=STORE.reactions[s.id];const ch=STORE.choices[s.id];
    if(cms.length||rea||ch)items.push({p,s,cms,rea,ch});
  }}
  const n=PROPOSE?pendCount():0;
  let html='<div class="phead"><h2>決定・コメント書き出し</h2><p>'
    +(PROPOSE?'決定・リアクション・コメントの一覧。この端末での変更は<b>未送信 '+n+'件</b>です。':'あなたの決定・リアクション・コメントの一覧。「書き出し」で Markdown をコピーし、Claude に貼り付けてください。')
    +'</p></div>';
  html+='<div style="margin-bottom:16px">'
    +(PROPOSE?'<button class="exp'+(n?'':' dim')+'" style="margin-left:0" onclick="submitToGitHub()">📤 GitHubへ送信'+(n?'（'+n+'）':'')+'</button> ':'')
    +'<button class="exp" style="margin-left:0" onclick="exportMD()">📋 Markdownをクリップボードへ</button> <button class="flt" onclick="exportJSON()">JSONダウンロード</button>'
    +' <button class="flt" style="color:var(--warn)" onclick="clearAll()">'+(PROPOSE?'未送信分を破棄':'全消去')+'</button></div>';
  if(!items.length){html+='<div class="empty">まだ何もありません。各ページで選択肢を選ぶか、OK/要変更・コメントを付けてください。</div>';}
  for(const it of items){
    html+='<div class="fb-sec"><div class="to">'+it.p.title+' › '+it.s.h+' <a href="#'+it.p.id+'" onclick="go(\''+it.p.id+'\')">→開く</a></div>';
    if(it.ch){const o=optOf(it.s,it.ch);html+='<div><span class="okw">✓ 決定: '+it.ch+'</span> '+(o?o.t:'')+'</div>';}
    if(it.rea)html+='<div>反応: '+(it.rea==='ok'?'👍 OK':'✋ 要変更')+'</div>';
    for(const c of it.cms)html+='<div class="citem"><div class="meta"><span>'+c.ts+'</span></div>'+esc(c.text).replace(/\n/g,'<br>')+'</div>';
    html+='</div>';
  }
  el.innerHTML=html;
}

/* ---------- actions ---------- */
function pick(id,k){
  const next=(STORE.choices[id]===k?'':k);
  STORE.choices[id]=next;
  if(!next)delete STORE.choices[id];
  if(PROPOSE)PENDING.choices[id]=next;
  save();render();
  if(SERVER&&STORE.choices[id]){
    const d=new Date();
    fetch(API+'/api/log',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sec:id,choice:k,ts:stamp(d)})}).catch(()=>{});
  }
}
function react(id,v){
  const next=(STORE.reactions[id]===v?'':v);
  STORE.reactions[id]=next;
  if(PROPOSE)PENDING.reactions[id]=next;
  save();render();
}
function toggleC(id){document.getElementById('cf-'+id).classList.toggle('open');}
function stamp(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function addC(id){
  const ta=document.getElementById('ta-'+id);const txt=ta.value.trim();if(!txt)return;
  if(!STORE.comments[id])STORE.comments[id]=[];
  const ts=stamp(new Date());
  STORE.comments[id].push({text:txt,ts});
  if(PROPOSE){
    if(!PENDING.comments[id])PENDING.comments[id]=[];
    PENDING.comments[id].push({text:txt,ts});
  }
  ta.value='';
  save();render();
  if(SERVER){fetch(API+'/api/log',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sec:id,text:txt,ts})}).catch(()=>{});}
}
function delC(id,i){
  const c=STORE.comments[id][i];
  if(PROPOSE){
    // 公開済みのコメントはここからは消せない(消すならローカル版で)
    const p=PENDING.comments[id]||[];
    const at=p.findIndex(x=>x.ts===c.ts&&x.text===c.text);
    if(at<0){alert('公開済みのコメントは、ここからは削除できません。');return;}
    p.splice(at,1);
    if(!p.length)delete PENDING.comments[id];
  }
  STORE.comments[id].splice(i,1);
  save();render();
}
function clearAll(){
  if(PROPOSE){
    if(!confirm('未送信の変更をすべて破棄します。公開済みの内容は消えません。よろしいですか?'))return;
    PENDING=emptyFb();savePending();STORE=mergeFb(BASE,PENDING);render();return;
  }
  if(confirm('すべての決定・コメント・リアクションを消去します。よろしいですか?')){STORE={comments:{},reactions:{},choices:{}};save();render();}
}
function buildMD(){
  const d=new Date();
  const tot=decisions().length, done=decDone();
  let md='# MINERTIA Steam企画サイト フィードバック ('+stamp(d)+')\n\n';
  md+='決定進捗: '+done+' / '+tot+'\n\n';
  let any=false;
  for(const p of DB){for(const s of p.secs){
    const cms=STORE.comments[s.id]||[];const rea=STORE.reactions[s.id];const ch=STORE.choices[s.id];
    if(!cms.length&&!rea&&!ch)continue;any=true;
    md+='## ['+s.id+'] '+p.title+' › '+s.h+'\n';
    if(ch){const o=optOf(s,ch);md+='- **決定: '+ch+'** '+(o?o.t:'')+'\n';}
    if(rea)md+='- 反応: '+(rea==='ok'?'OK(承認)':'要変更')+'\n';
    for(const c of cms)md+='- コメント('+c.ts+'): '+c.text.replace(/\n/g,' / ')+'\n';
    md+='\n';
  }}
  const open=decisions().filter(x=>!STORE.choices[x.s.id]);
  if(open.length){
    any=true;
    md+='## 未決定のまま残っているもの ('+open.length+')\n';
    for(const x of open)md+='- ['+x.s.id+'] '+x.p.title+' › '+x.s.h+'\n';
    md+='\n';
  }
  return any?md:null;
}
function exportMD(){
  const md=buildMD();
  if(!md){alert('まだ何もありません。');return;}
  navigator.clipboard.writeText(md).then(()=>alert('Markdownをコピーしました。Claudeに貼り付けてください。'),
    ()=>{prompt('コピーできない場合は手動で選択してください:',md);});
}
function exportJSON(){
  const blob=new Blob([JSON.stringify(STORE,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='minertia_steam_feedback.json';a.click();
}

/* ---------- boot ---------- */
function render(){renderNav();renderTop();renderPage();}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==curPage){curPage=h;render();}});
(async function boot(){render();await connectServer();render();})();
</script>
