<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MINERTIA Steam リリース企画サイト</title>
<style>
  :root{
    --bg:#1a1c20; --panel:#23262b; --ink:#e2e6ea; --sub:#949cA6;
    --line:#353a41; --accent:#66c0f4; --accent2:#8fb3d4;
    --k-bg:#1f2f22; --k-ink:#8fd49a; --k-line:#3a5c40;
    --t-bg:#33301a; --t-ink:#e2c97e; --t-line:#5a5228;
    --d-bg:#3a2226; --d-ink:#f2a0a0; --d-line:#6b3a40;
    --q-bg:#2a2436; --q-ink:#c0a8e8; --q-line:#4a3d63;
    --c-bg:#1e2936; --c-ink:#9cc0e8; --c-line:#34485f;
    --warn:#e07d74; --ok:#5aa469;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;line-height:1.85;font-size:15px}
  a{color:var(--accent)}
  /* layout */
  #app{display:flex;min-height:100vh}
  nav{width:262px;flex:none;background:#1f2226;color:#d3d8de;padding:18px 0 40px;position:sticky;top:0;height:100vh;overflow-y:auto}
  nav .brand{padding:0 18px 14px;border-bottom:1px solid #3a3f46;margin-bottom:10px}
  nav .brand h1{font-size:17px;color:#eaf1f7;letter-spacing:.12em}
  nav .brand small{color:#8b939c;font-size:11px}
  nav .prog{margin:8px 18px 4px;background:#2b2f35;border-radius:8px;padding:7px 10px;font-size:11.5px;color:#a9b2bb}
  nav .prog b{color:var(--accent);font-size:13px}
  nav .bar{height:5px;background:#171a1e;border-radius:3px;margin-top:5px;overflow:hidden}
  nav .bar i{display:block;height:100%;background:linear-gradient(90deg,#3d7fa8,#66c0f4)}
  nav .grp{padding:12px 18px 4px;font-size:11px;color:#7f878f;letter-spacing:.15em}
  nav button.nv{display:flex;justify-content:space-between;align-items:center;gap:6px;width:100%;text-align:left;padding:7px 18px;background:none;border:none;color:#d3d8de;font-size:13.5px;cursor:pointer;font-family:inherit}
  nav button.nv:hover{background:#2c3036}
  nav button.nv.on{background:#38414b;color:#bfe3fb}
  nav .cnt{font-size:10.5px;background:var(--c-ink);color:#12161a;border-radius:9px;padding:0 6px;font-weight:700}
  nav .cnt.dec{background:var(--d-ink)}
  main{flex:1;min-width:0;padding:30px 44px 90px;max-width:1000px}
  /* topbar */
  #top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
  #top .flt{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:3px 13px;font-size:12.5px;cursor:pointer;color:var(--sub);font-family:inherit}
  #top .flt.on{background:var(--ink);color:#1a1c20;border-color:var(--ink)}
  #top .exp{margin-left:auto;border:none;background:var(--accent);color:#0f1418;border-radius:16px;padding:5px 15px;font-size:12.5px;cursor:pointer;font-family:inherit;font-weight:700}
  .mode{font-size:11.5px;padding:3px 12px;border-radius:14px;white-space:nowrap}
  .mode.on{background:var(--k-bg);color:var(--k-ink);border:1px solid var(--k-line)}
  .mode.off{background:var(--t-bg);color:var(--t-ink);border:1px solid var(--t-line)}
  .mode.ro{background:var(--q-bg);color:var(--q-ink);border:1px solid var(--q-line)}
  /* page header */
  .phead{margin-bottom:20px;border-bottom:2px solid var(--line);padding-bottom:12px}
  .phead h2{font-size:24px;letter-spacing:.05em}
  .phead p{color:var(--sub);font-size:13px;margin-top:4px}
  .phead .src{font-size:11.5px;color:#6f777f;margin-top:6px}
  /* section card */
  .sec{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:18px;overflow:hidden}
  .sec.hide{display:none}
  .sec.dec{border-color:#5a3339}
  .shead{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);background:#282c32}
  .shead h3{font-size:15.5px;flex:1}
  .badge{font-size:11px;padding:2px 10px;border-radius:10px;white-space:nowrap;border:1px solid}
  .b-k{background:var(--k-bg);color:var(--k-ink);border-color:var(--k-line)}
  .b-t{background:var(--t-bg);color:var(--t-ink);border-color:var(--t-line)}
  .b-d{background:var(--d-bg);color:var(--d-ink);border-color:var(--d-line)}
  .b-q{background:var(--q-bg);color:var(--q-ink);border-color:var(--q-line)}
  .sbody{padding:16px 20px}
  .sbody p{margin:0 0 10px}
  .sbody p:last-child{margin-bottom:0}
  .sbody ul,.sbody ol{margin:0 0 10px 22px}
  .sbody li{margin-bottom:3px}
  .sbody h4{font-size:13.5px;color:var(--accent);margin:14px 0 6px;letter-spacing:.05em}
  .sbody table{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0}
  .sbody th,.sbody td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
  .sbody th{background:#2e333a;font-weight:600}
  .sbody blockquote{border-left:3px solid var(--accent);background:#262a30;padding:8px 14px;margin:8px 0;border-radius:0 6px 6px 0;color:#cfd6dd}
  .sbody code{background:#171a1e;border:1px solid #2f343a;border-radius:4px;padding:0 5px;font-size:12.5px;color:#c8d6e2}
  .note{font-size:12.5px;color:var(--sub)}
  .kw{color:var(--accent);font-weight:600}
  .ng{color:var(--warn);font-weight:600}
  .okw{color:var(--ok);font-weight:600}
  /* option picker */
  .opts{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
  .opts .ttl{font-size:12px;color:var(--d-ink);letter-spacing:.08em;margin-bottom:8px}
  .opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:#282c32;border-radius:8px;padding:8px 12px;margin-bottom:6px;cursor:pointer;font-family:inherit;color:var(--ink);text-align:left;width:100%;font-size:13px;line-height:1.7}
  .opt:hover{border-color:var(--accent)}
  .opt.ro{cursor:default}
  .opt.ro:hover{border-color:var(--line)}
  .opt.ro.on:hover{border-color:#4d7f58}
  .opt.on{background:#20372a;border-color:#4d7f58}
  .opt .k{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--sub);background:#1d2126;margin-top:2px}
  .opt.on .k{background:var(--ok);color:#0f1418;border-color:var(--ok)}
  .opt b{color:#eef3f8}
  .opt .rec{font-size:10.5px;background:#2b3f52;color:#8fc7ec;border-radius:8px;padding:0 7px;margin-left:6px;white-space:nowrap}
  .opt .d{color:var(--sub);font-size:12.5px;display:block}
  .picked{font-size:11.5px;color:var(--ok);margin-top:4px}
  /* feedback zone */
  .fzone{border-top:1px dashed var(--line);background:#1e232a;padding:10px 18px}
  .fzone .rrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .rbtn{border:1px solid var(--c-line);background:#232830;border-radius:14px;padding:2px 12px;font-size:12px;cursor:pointer;color:var(--c-ink);font-family:inherit}
  .rbtn.on-ok{background:#2f6b33;color:#fff;border-color:#2f6b33}
  .rbtn.on-ng{background:#a94442;color:#fff;border-color:#a94442}
  .cbtn{border:none;background:none;color:var(--c-ink);font-size:12px;cursor:pointer;margin-left:auto;font-family:inherit}
  .clist{margin-top:8px}
  .citem{background:var(--c-bg);border:1px solid var(--c-line);border-radius:8px;padding:8px 12px;margin-bottom:6px;font-size:13px}
  .citem .meta{font-size:10.5px;color:var(--c-ink);display:flex;justify-content:space-between;margin-bottom:2px}
  .citem .del{cursor:pointer;color:var(--warn);background:none;border:none;font-size:10.5px;font-family:inherit}
  .cform{display:none;margin-top:8px}
  .cform.open{display:block}
  .cform textarea{width:100%;min-height:64px;border:1px solid var(--c-line);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:13px;resize:vertical;background:#1c2027;color:var(--ink)}
  .cform .save{margin-top:6px;border:none;background:var(--c-ink);color:#12161a;border-radius:14px;padding:4px 16px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:700}
  /* legend */
  .legend{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
  .legend .lg{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sub)}
  .dot{width:12px;height:12px;border-radius:3px;display:inline-block}
  /* phase strip */
  .phase{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
  .ph{flex:1;min-width:190px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:#242830}
  .ph.now{border-color:var(--accent);background:#22313c}
  .ph .n{font-size:11px;color:var(--sub);letter-spacing:.1em}
  .ph .t{font-size:14px;font-weight:700;margin:2px 0 4px}
  .ph .d{font-size:12px;color:var(--sub)}
  .ph.now .n{color:var(--accent)}
  /* board */
  .bd-grp{font-size:12px;color:var(--sub);letter-spacing:.1em;margin:18px 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px}
  .bd{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--d-line);border-radius:8px;padding:10px 16px;margin-bottom:10px}
  .bd.done{border-left-color:var(--ok)}
  .bd .to{font-size:11px;color:var(--sub)}
  .bd h4{font-size:14px;margin:2px 0 4px}
  .bd .st{font-size:12px}
  .fb-sec{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-bottom:12px}
  .fb-sec .to{font-size:11px;color:var(--sub)}
  .empty{color:var(--sub);text-align:center;padding:40px 0}
</style>
</head>
<body>
<div id="app">
  <nav id="nav"></nav>
  <main>
    <div id="top"></div>
    <div id="page"></div>
  </main>
</div>

<script>
/* =========================================================
   MINERTIA Steam リリース企画サイト
   フェーズ1(すり合わせ)専用フロント。
   - 情報4タイプ: 確定(仮)=k / 提案=t / 要決定=d / 未調査=q
   - 「要決定」には選択肢が付き、選ぶと決定として記録される
   - 決定・コメント・リアクションは feedback.json(サーバー起動時)/localStorage に保存
   - 「書き出し」でMarkdown化 → Claudeに貼り付けて仕様書へ反映
   原典: GamesDomain/docs/steam-release/
   ========================================================= */

const DB = [
/* ============================ 案内 ============================ */
{id:'home', nav:'ホーム / 使い方', group:'案内', title:'Steam リリース企画', desc:'モバイル版 Idle Minertia を Steam(Windows / macOS)へ移植する計画。いまはフェーズ1。', src:'docs/steam-release/README.md', secs:[
 {id:'ho-phase', h:'いまどこにいるか ── 3フェーズ', s:'k', b:`
  <div class="phase">
    <div class="ph now"><div class="n">PHASE 1 — いまここ</div><div class="t">仕様のすり合わせ</div><div class="d">ブレストして決める。<b>このサイトが作業場</b>。決定と保留を可視化するのが目的。</div></div>
    <div class="ph"><div class="n">PHASE 2</div><div class="t">AI向けプロンプト化</div><div class="d">確定した仕様を、実装AIが読む形式へ整形する。曖昧語を消し、参照パスと受け入れ条件を付ける。</div></div>
    <div class="ph"><div class="n">PHASE 3</div><div class="t">実装</div><div class="d">ドメイン(GamesDomain)と Unity(IdleMinertia)の両側で作業。</div></div>
  </div>
  <p class="note">フェーズ1の完了条件は「<b>要決定が全部埋まる</b>」こと。未調査(紫)は外部確認が必要なので、フェーズ1を止めない代わりに<b>フェーズ2に持ち越せない</b>。</p>`},
 {id:'ho-howto', h:'このサイトの使い方', s:null, b:`
  <p>各ブロックは4タイプに分かれます。<b>赤(要決定)を潰していくのがフェーズ1の作業</b>です。</p>
  <div class="legend">
    <span class="lg"><span class="dot" style="background:var(--k-bg);border:1px solid var(--k-line)"></span>確定(仮) … 合意済み。この前提で書いてよい</span>
    <span class="lg"><span class="dot" style="background:var(--t-bg);border:1px solid var(--t-line)"></span>提案 … Claude の案。あなたの判断待ち</span>
    <span class="lg"><span class="dot" style="background:var(--d-bg);border:1px solid var(--d-line)"></span>要決定 … 選択肢から選ぶと決定が記録される</span>
    <span class="lg"><span class="dot" style="background:var(--q-bg);border:1px solid var(--q-line)"></span>未調査 … Steamworks 等の外部確認が要る</span>
  </div>
  <ul>
    <li><b>要決定ブロックの選択肢をクリック</b>すると決定として記録され、左のバーが進みます。もう一度押すと解除。</li>
    <li>どのブロックにも <b>OK / 要変更</b> と <b>コメント</b> を付けられます。「選択肢のどれでもない」ときはコメントに書いてください。</li>
    <li>右上の<b>「決定・コメント書き出し」</b>で Markdown をコピー → Claude に貼ると、仕様書とこのサイトへ反映されます。</li>
    <li><b>永続化(推奨)</b>: <code>start_site.bat</code> をダブルクリックで起動すると、<code>SteamSite/feedback.json</code> へ<b>自動保存</b>されます(履歴は <code>feedback_history.jsonl</code> に追記)。右上が「💾 自動保存ON」なら有効。ポートは <code>8138</code>(StorySite の 8137 と別なので同時起動できます)。</li>
    <li>直接 index.html を開いた場合はブラウザ内保存(localStorage)。サーバー起動中なら検出して自動同期します。</li>
  </ul>`},
 {id:'ho-fixed', h:'すでに固まっている前提', s:'k', b:`
  <ul>
   <li><b>モバイルと同一コードベースで並行運用</b>。Steam 版のためにモバイル版を壊さない。</li>
   <li><b>F2P + Steam 内課金</b>を第一候補として設計する(ただし §マネタイズ の承認次第でプランBへ)。</li>
   <li><b>ゲームロジックに <code>#if</code> を書き足さない。</b>プラットフォーム差はインターフェースの裏に隠し、DI 登録の1箇所だけで分岐する。</li>
   <li>横長対応で <b>UXML を複製しない</b>。「横長 = 縦長の画面を並べたもの」と定義を固定する。</li>
   <li>モバイル版からのセーブ引き継ぎは<b>スコープ外</b>。</li>
  </ul>
  <p class="note">ここが崩れると全ページの前提が変わります。違和感があれば早い段階で 要変更 を付けてください。</p>`},
 {id:'ho-files', h:'原典ファイル対応', s:null, b:`
  <table><tr><th>ページ</th><th>原典(GamesDomain/docs/steam-release/)</th></tr>
  <tr><td>プラットフォーム抽象化</td><td>02_Platform_Abstraction.md</td></tr>
  <tr><td>マネタイズ</td><td>03_Monetization_Steam.md</td></tr>
  <tr><td>セーブとクラウド</td><td>04_SaveData_and_Cloud.md</td></tr>
  <tr><td>横長レイアウトと PC 操作</td><td>05_Input_and_Display.md</td></tr>
  <tr><td>Steam 機能</td><td>06_Steam_Features.md</td></tr>
  <tr><td>Steamworks / ビルド / QA・法務</td><td>Memo/*.md</td></tr>
  <tr><td>あなたに聞きたいこと・決定ボード</td><td>未保存(このサイトが初出)</td></tr></table>
  <p class="note">当面の正本は MD ファイル。サイトは決定を集める場として使い、確定した内容を MD へ反映していく。</p>`},
]},

/* ============================ 聞きたいこと ============================ */
{id:'ask', nav:'⭐ あなたに聞きたいこと', group:'案内', title:'あなたに聞きたいこと', desc:'資料を読んでも分からない、あなたしか答えられない前提。ここが決まると下流の判断が一気に進みます。', src:'このサイトが初出', secs:[
 {id:'ask-appid', h:'Q1. AppID 3217600 は旧作(Idle Sphere)のものか', s:'d', b:`
  <p><code>steam_appid.txt</code> に <code>3217600</code> があります。ただし <code>Assets/Editor/DeploySteam.cs</code> は同じ AppID に対して <b>Idle Sphere.exe</b> をアップロードする内容で、参照シーン <code>IdleSphere.unity</code> は現存しません。Standalone の bundle ID も <code>com.idlesystem.IdleSphere</code> のままです。</p>
  <p><span class="ng">これが旧作用なら Steam Direct($100)で新規取得が必要</span>で、<b>全スケジュールの起点</b>になります。Steamworks 管理画面を見れば即答できます。</p>`,
  opt:{items:[
   {k:'A',t:'旧作用。新規取得が必要',d:'Steam Direct $100 の支払いと、審査待ち期間をスケジュールに入れる。'},
   {k:'B',t:'本作用として取得済み',d:'DeploySteam.cs の作り直しだけで済む。最短。'},
   {k:'C',t:'まだ確認していない',d:'まずここを見に行く。他の判断はブロックされない。'},
  ]}},
 {id:'ask-os', h:'Q2. 対応 OS はどこまで', s:'d', b:`
  <p>資料は Windows / macOS の両対応を前提に書かれていますが、macOS は<b>公証(Notarization)・Apple Silicon 対応・別 Depot・別テスト機</b>が乗り、工数が単純に増えます。</p>`,
  opt:{items:[
   {k:'A',t:'Windows のみで 1.0 を出す',d:'最短。macOS は売れてから追加でよい。Depot もテストも1系統。',rec:true},
   {k:'B',t:'Windows + macOS 同時',d:'資料の想定。公証パイプラインの構築が別途必要。'},
   {k:'C',t:'Windows 先行、macOS は後日',d:'ストアページには最初から「macOS 対応予定」と書く運用。'},
  ]}},
 {id:'ask-scope', h:'Q3. 1.0 のスコープ上限', s:'d', b:`
  <p>「動く」だけなら段階1(中央900固定のレターボックス)+ Steam 実績で出せます。「PC ゲームとして評価される」ところまで行くなら横長3カラムとマウス操作特化が要ります。<b>どこで線を引くか</b>で総工数が数倍変わります。</p>`,
  opt:{items:[
   {k:'A',t:'最小(移植として成立)',d:'レターボックス表示 + Steam Cloud + 実績。広告は即時付与。横長・ショートカットは 1.1 以降。'},
   {k:'B',t:'標準',d:'A + 横長3カラム(段階2) + 数字キー + Shift+クリック。レビューで「移植が雑」と言われない水準。',rec:true},
   {k:'C',t:'全部入り',d:'B + QWERT ショートカット + リーダーボード + リッチプレゼンス + 解像度設定UI。'},
  ]}},
 {id:'ask-when', h:'Q4. 時期の目標', s:'d', b:`
  <p>締切があるなら、そこから逆算してスコープを削ります。ストアページ公開からリリースまでの必須待機期間(Valve 規定)とビルド審査日数も別途乗ります。</p>`,
  opt:{items:[
   {k:'A',t:'期限なし。品質優先',d:'決定を急がず、未調査を1つずつ潰していける。'},
   {k:'B',t:'ざっくり半年以内',d:'横長対応(最大工数)を段階1で止める判断が現実的になる。'},
   {k:'C',t:'3ヶ月以内',d:'スコープ Q3=A ほぼ確定。マネタイズも B2(DLCのみ)で申請リスクを避ける。'},
  ]}},
 {id:'ask-mobile', h:'Q5. モバイル版の運用は続けるか', s:'d', b:`
  <p>「同一コードベースで並行運用」は<b>モバイル版を出し続ける</b>前提の制約です。もしモバイルを実質終了させるなら、暗号化フラグの移行処理も <code>#if</code> 回避の縛りも大幅に緩みます。<b>この答えは 04(暗号化)と 02(抽象化の厳しさ)に直結します。</b></p>`,
  opt:{items:[

/* ============================ 02 抽象化 ============================ */
{id:'platform', nav:'02 プラットフォーム抽象化', group:'仕様', title:'プラットフォーム抽象化', desc:'最初に着手すべき設計。ここが固まらないまま個別対応を始めると、全作業が #if の泥沼になる。', src:'docs/steam-release/02_Platform_Abstraction.md', secs:[
 {id:'pf-rule', h:'原則 ── #if を書いてよいのは3箇所だけ', s:'k', b:`
  <blockquote><b><code>#if</code> をゲームロジックに書き足さない。</b>プラットフォーム差はインターフェースの裏に隠し、<b>DI の登録時に1箇所だけ分岐させる。</b></blockquote>
  <ol><li>Installer(どの実装を bind するかの分岐)</li>
  <li>プラットフォーム固有 SDK を直接触る実装クラスの内部</li>
  <li>Editor スクリプト</li></ol>
  <p><b>View / ViewModel / Domain には一切書かない。</b></p>
  <h4>幸運な前提</h4>
  <p>既存の依存はよく隔離されています。広告は <code>AdRoot.cs</code> の1ファイルのみ、課金は <code>Shop/IAP/</code> に集約、セーブは <code>RepositoryRegister.BindRepository&lt;T&gt;()</code> の1箇所を通る。<br>
  <span class="okw">つまり「散らばった #if を集約する」作業ではなく、「既にある境界にインターフェースを被せる」作業で済みます。</span></p>`},
 {id:'pf-what', h:'抽象化するもの / しないもの', s:'k', b:`
  <table><tr><th>対象</th><th>抽象化</th><th>理由</th></tr>
  <tr><td>広告</td><td><code>IRewardService</code></td><td>Steam 版は「即時付与」に差し替え</td></tr>
  <tr><td>課金</td><td><code>IStoreService</code></td><td>Unity IAP ↔ Steam で API が全く違う</td></tr>
  <tr><td>クラウドセーブ</td><td><code>ICloudSaveBackend</code></td><td>Firebase ↔ Steam Cloud</td></tr>
  <tr><td>ログイン</td><td><code>IAuthService</code></td><td>Google/Apple ↔ Steam ID</td></tr>
  <tr><td>実績</td><td><code>IAchievementService</code></td><td>モバイルは No-Op 実装を置く</td></tr>
  <tr><td>レビュー誘導</td><td><code>IReviewPrompt</code></td><td>Steam では不要(No-Op)</td></tr>
  <tr><td>ローカルセーブ</td><td><b>しない</b></td><td><code>persistentDataPath</code> は全プラットフォームで動く</td></tr>
  <tr><td>入力</td><td><b>しない</b></td><td><code>InputHandler.cs</code> に既にランタイム分岐がある</td></tr>
  <tr><td>ローカライズ</td><td><b>しない</b></td><td>Unity Localization は共通</td></tr>
  <tr><td>画面レイアウト</td><td><b>しない</b></td><td><code>#if</code> ではなくアスペクト比で判定</td></tr></table>`},
 {id:'pf-if', h:'インターフェースの置き場と形', s:'t', b:`
  <p>配置先: <code>Assets/1.Games/IdleGem/Platform/</code> に <code>I*.cs</code> / <code>Mobile/</code> / <code>Steam/</code> / <code>Null/</code>。</p>
  <h4>IRewardService</h4>
  <p>既存の <code>AdRoot.ShowRewardedAd(AdId, Action)</code> と同じシグネチャに合わせるのが最小変更。<code>RequiresAdView</code> が false ならボタン文言を「受け取る」にします。<br>
  <span class="okw"><code>SyncOnClickAsRewardButton()</code> 系3メソッドを差し替えれば、呼び出し側 8ファイル11箇所は無改修。</span></p>
  <h4>IStoreService</h4>
  <p><code>Products</code> / <code>PurchaseAsync</code> / <code>IsOwned</code> / <code>SupportsRestore</code> / <code>RestoreAsync</code>。<code>SupportsRestore</code> が <code>ShopView</code> の <code>#if UNITY_IOS</code> を置き換えます。</p>
  <h4>IAuthService / IAchievementService</h4>
  <p><code>AvailableProviders</code> により <code>SettingsLoginHandler</code> の Google/Apple ボタン出し分けを <code>#if</code> なしで書けます。<code>IAchievementService</code> のモバイル実装を No-Op にすることで、<b>実績の解除呼び出しをゲームロジックに分岐なしで置けます。</b></p>`},
 {id:'pf-define', h:'🔴 Scripting Define ── 時限爆弾', s:'k', b:`
  <p><b><code>STEAMWORKS_NET</code> が Android / iPhone / WebGL にも付いています。</b>現状は Steamworks を呼ぶコードが無いので害が出ていませんが、<span class="ng">Steam 実装を書き始めた瞬間にモバイルビルドが壊れます。</span></p>
  <table><tr><th>Define</th><th>Android</th><th>iOS</th><th>Standalone</th></tr>
  <tr><td><code>USE_ADMOB</code></td><td>✅</td><td>✅</td><td>❌</td></tr>
  <tr><td><code>STEAMWORKS_NET</code></td><td><b>❌ 削除</b></td><td><b>❌ 削除</b></td><td>✅</td></tr>
  <tr><td><code>USE_UNITY_IAP</code></td><td>✅ 追加</td><td>✅ 追加</td><td>❌</td></tr></table>
  <p class="note">⚠️ Unity Editor が開いていると <code>ProjectSettings.asset</code> の変更が巻き戻ります。</p>
  <h4>先に Steamworks.NET の二重導入を解消する</h4>
  <p><code>Assets/Steamworks.NET_15.0.1/</code>(残骸)、<code>Assets/com.rlabrecque.steamworks.net/</code>、<code>Packages/manifest.json:15</code> の Git URL 参照(<b>こちらが正</b>)の3つが併存。<b>manifest.json に一本化し、Assets 側の2つを削除。</b>これを先にやらないと、どちらの DLL がロードされているか分からない状態でデバッグすることになります。</p>`},
 {id:'pf-init', h:'Steamworks 初期化(SteamManager は未実装)', s:'k', b:`
  <p><code>SteamManager</code>(MonoBehaviour)を新規作成します。本リポジトリには<b>存在しません</b>。</p>
  <table><tr><th>#</th><th>要件</th></tr>
  <tr><td>1</td><td>他のどの Steam API 呼び出しより先に <code>SteamAPI.Init()</code> を完了させる</td></tr>
  <tr><td>2</td><td><b><code>Init()</code> が false でも落ちない。</b>クライアント未起動・オフライン等で普通に失敗する。No-Op にフォールバックしてゲームは起動させる</td></tr>
  <tr><td>3</td><td><code>SteamAPI.RunCallbacks()</code> を毎フレーム呼ぶ</td></tr>
  <tr><td>4</td><td><code>SteamAPI.Shutdown()</code> を終了時に呼ぶ</td></tr>
  <tr><td>5</td><td><code>SteamAPI.RestartAppIfNecessary(appId)</code> をリリースビルドで有効化</td></tr></table>
  <p class="note"><code>steam_appid.txt</code> をリリースビルドに同梱しないこと。開発時のみ実行ファイルの隣に置く。</p>`},
 {id:'pf-order', h:'作業順序 ── 2 が最優先', s:'k', b:`
  <table><tr><th>順</th><th>作業</th><th>理由</th></tr>
  <tr><td>1</td><td>Steamworks.NET の二重導入を解消</td><td>どの DLL が効いているか不明な状態を先に潰す</td></tr>
  <tr><td>2</td><td><b>SteamManager を作り、空の Windows ビルドで <code>SteamAPI.Init()</code> 成功を確認</b></td><td>ここで <code>IdleSystem.*.dll</code> 群が Standalone で動くかも同時に判明する。<b>最大の未知数を最速で潰す</b></td></tr>
  <tr><td>3</td><td>インターフェース定義 + No-Op + <code>EditorPlatformInstaller</code></td><td>Editor で開発を続けられる状態を保つ</td></tr>
  <tr><td>4</td><td><code>IRewardService</code> を導入し <code>AdRoot</code> をラップ</td><td>影響範囲が最も狭く、効果(広告除去)が最も大きい</td></tr>
  <tr><td>5</td><td>Scripting Define の整理</td><td>Steam 実装を書き始める前に必須</td></tr>
  <tr><td>6</td><td>残りのインターフェースを順次導入</td><td></td></tr></table>
  <p><span class="ng">2 でドメイン DLL が Standalone で動かないと、移植計画そのものを見直す必要があります。</span></p>`},
 {id:'pf-when', h:'検証ビルドをいつ走らせるか', s:'d', b:`
  <p>作業順序の 2(空の Windows ビルドで <code>SteamAPI.Init()</code> とドメイン DLL の動作確認)は、<b>フェーズ1の仕様確定より先に走らせることもできます</b>。同じビルドで 05 の「横長で実際にどう崩れるか」も分かります。</p>`,
  opt:{items:[
   {k:'A',t:'フェーズ1のうちに検証だけ先に走らせる',d:'空の Windows ビルドで DLL 動作と SteamAPI.Init() を確認。仕様を固める前に最大リスクを消す。',rec:true},
   {k:'B',t:'フェーズ3の頭でやる',d:'資料どおりの順序。仕様確定を優先する。'},
  ]}},
]},

/* ============================ 03 マネタイズ ============================ */
{id:'money', nav:'03 マネタイズ', group:'仕様', title:'マネタイズ(F2P + Steam 内課金)', desc:'最大の外部リスクがここ。ゲーム内通貨販売が Steam で通るかで、下流の設計が連鎖的に変わります。', src:'docs/steam-release/03_Monetization_Steam.md', secs:[
 {id:'mn-risk', h:'🔴 ゲーム内通貨販売が Steam で通るか(未調査)', s:'q', b:`
  <p>現在の課金の主軸は<b>ダイヤ(ゲーム内通貨)の販売</b>(5ティア × 通常 / 初回 / 割引)。Steam でリアルマネーによるゲーム内通貨販売を行うには <b>Valve への申請と承認が別途必要</b>で、モバイルストアのように自動では通りません。<span class="ng">承認されない可能性があります。</span></p>
  <p class="note">Steamworks 管理画面と最新のパートナー向けドキュメントで、現時点の申請要件・審査基準を確認すること。<b>ここが全体の設計を左右します</b>(暗号化の要否まで連鎖)。</p>`},
 {id:'mn-plan', h:'プランB ── 通貨販売が通らなかった場合', s:'d', b:`
  <p>結果を待たずに切り替え先を先に決めておきます。この決定は <b>04 の暗号化の要否</b>と直結します。</p>`,
  opt:{items:[
   {k:'B2',t:'F2P + 権利販売のみ(DLC)',d:'通貨は売らず、非消費型(Booster Plus / Nether 拡張)だけを Steam DLC として売る。既存の非消費型4種がそのまま写像でき、DLC は標準機能なので追加の審査リスクが無い。→ 暗号化も不要になる。',rec:true},
   {k:'B1',t:'買い切り化',d:'本体を有料にし、課金要素を全廃。バランスは「全アンロック済み」相当に。ストアページの見せ方も変わる。'},
   {k:'A',t:'通貨販売に賭ける(プランBを用意しない)',d:'申請が通る前提で進める。通らなかったときの手戻りが大きい。'},
  ]}},
 {id:'mn-map', h:'既存アイテムの写像', s:'k', b:`
  <table><tr><th>既存 ID</th><th>内容</th><th>Steam での扱い</th></tr>
  <tr><td><code>idle_gem_remove_ad_v2</code> / <code>remove_ads</code></td><td>広告削除</td><td><b>廃止</b>(Steam に広告が無い)</td></tr>
  <tr><td><code>idle_gem_booster_plus</code></td><td>恒久ブースター強化</td><td>DLC</td></tr>
  <tr><td><code>idle_gem_nether_plus</code></td><td>Nether 挑戦 3 → 5</td><td>DLC</td></tr></table>
  <p>DLC は <code>IStoreService.IsOwned()</code> で所有判定でき、<b>Steam 側が所有権を持つため復元処理が不要</b>。現在 PlayerPrefs にキャッシュしている課金フラグ(<code>AdsClient</code>)を Steam の所有権判定に置き換えます。<br>
  <span class="okw">→ これで 04 の「課金アンロックが別 PC で復元されない」問題も同時に解決します。</span></p>`},
 {id:'mn-ad', h:'🔴 広告廃止の穴埋め ── 本質はゲームデザイン', s:'d', b:`
  <p>実装は軽いです。<code>AdRoot.cs</code> には既に「購入済みなら広告を出さず即時付与」の分岐があり、Steam 実装はこの経路だけを使うので<b>呼び出し側 8ファイル11箇所は無改修</b>。</p>
  <p>問題はバランスです。広告が無条件で即時付与になると、<span class="ng">Steam 版はモバイル版より大幅に緩くなります</span> — オフライン報酬が常に ×2 / プレステージ報酬が常に倍 / バトル戦利品が常に ×2 / ブースター取り放題。「広告の視聴時間」が制約として機能していた部分が丸ごと消えます。</p>
  <p class="note">土台は既にあります: <code>AdCountRoot</code> が <code>IncrementAttemptCount(AdId)</code> で導線ごとの回数を持っています(<code>Games/_OTHERS/AdCount/</code>)。</p>`,
  opt:{items:[
   {k:'B',t:'クールダウンに置換',d:'「広告1回」を「n 時間に1回」に置き換える。制約の性質が保たれる。',rec:true},
   {k:'C',t:'回数上限に置換',d:'1日 n 回まで。AdCountRoot が既に視聴回数を記録しているので流用できる。'},
   {k:'BD',t:'B または C + D(通貨で購入)を併用',d:'クールダウン中でもダイヤを払えば即発動。通貨の使い道が増える。通貨販売が通るなら相性が良い。'},
   {k:'A',t:'そのまま緩くする',d:'全て即時付与。実装ゼロ。買い切り(B1)前提なら許容できる。'},
  ]}},
 {id:'mn-where', h:'クールダウンをどこに持たせるか', s:'d', b:`
  <p>制約の実体をドメイン(このリポジトリ)に置くか、Unity 側の <code>IRewardService</code> 実装に置くか。</p>`,
  opt:{items:[
   {k:'A',t:'ドメイン(AdCountRoot)に持たせる',d:'セーブに乗り、モバイル版でも同じ仕組みが使える。テストも書ける。DLL のビルドと Unity への反映が必要。',rec:true},
   {k:'B',t:'Unity 側の IRewardService 実装に持たせる',d:'Steam 版だけの都合をドメインに持ち込まない。ただし PlayerPrefs 相当の別保存が要る。'},
  ]}},
 {id:'mn-drop', h:'廃止するもの(削除ではなく「Steam ビルドに含めない」)', s:'k', b:`
  <table><tr><th>対象</th><th>理由</th></tr>
  <tr><td><code>Ads/AdsScene.unity</code>, <code>Ads/AdsView.cs</code></td><td>広告タブ UI</td></tr>
  <tr><td>ローカライズテーブル <code>UI_Ads</code></td><td>丸ごと不要</td></tr>
  <tr><td><code>Ads/AttPermissionRequest.cs</code></td><td>iOS ATT</td></tr>
  <tr><td><code>remove_ads</code> / <code>idle_gem_remove_ad_v2</code></td><td>広告が無いので意味が無い</td></tr>
  <tr><td><code>Shop/IAP/MobileIAPManager.cs</code></td><td>ほぼ全行コメントアウトの旧実装</td></tr>
  <tr><td><code>FirstPurchaseDiamondDef.cs</code> のハードコードされたセール期間</td><td>2026/6/28〜7/5 で失効済み</td></tr></table>
  <blockquote><b>モバイル版と同一コードベースなので、削除ではなく「Steam ビルドに含めない」形にすること。</b>シーンはビルド対象から外し、UI は <code>IStoreService</code> / <code>IRewardService</code> の能力フラグで出し分ける。</blockquote>`},
 {id:'mn-price', h:'価格設定', s:'d', b:`
  <p>モバイル版と揃えるか、PC 向けに変えるか。PC は一般に単価が高めでも通りますが、同一コードベースで表示を出し分ける必要が出ます。</p>`,
  opt:{items:[
   {k:'A',t:'モバイル版と同じ価格',d:'表示ロジックを共通化できる。ユーザーからの不公平感も出ない。',rec:true},
   {k:'B',t:'PC 向けに設定し直す',d:'PC の相場に合わせる。Steam の地域別価格表を別途作る。'},
   {k:'C',t:'あとで決める',d:'ストアページ作成のタイミングまで保留。'},
  ]}},
]},

/* ============================ 04 セーブ ============================ */
{id:'save', nav:'04 セーブとクラウド', group:'仕様', title:'セーブデータとクラウド', desc:'アイドルゲームでセーブ喪失は致命傷。ここは他のどこよりも保守的に進める。', src:'docs/steam-release/04_SaveData_and_Cloud.md', secs:[
 {id:'sv-local', h:'ローカルセーブは無改修で動く', s:'k', b:`
  <p><code>Application.persistentDataPath</code> は Standalone でもそのまま動きます。書き込みもアトミック(tmp → <code>File.Replace</code>)で実装品質は十分。</p>
  <table><tr><th>OS</th><th>パス</th></tr>
  <tr><td>Windows</td><td><code>%USERPROFILE%\\AppData\\LocalLow\\IdleSystem\\Idle Minertia\\</code></td></tr>
  <tr><td>macOS</td><td><code>~/Library/Application Support/IdleSystem/Idle Minertia/</code></td></tr></table>
  <blockquote><b><code>productName</code> / <code>companyName</code> を変えるとパスが変わり既存セーブが読めなくなります。変更しないこと。</b>Standalone の bundle ID(<code>com.idlesystem.IdleSphere</code>)は変更してよい。</blockquote>`},
 {id:'sv-single', h:'🔴 二重起動によるセーブ破損(最優先)', s:'k', b:`
  <p><code>forceSingleInstance: 0</code> のため二重起動できます。PC では Steam ライブラリ / ショートカット / 再起動で容易に起きます。同じ <code>local_save/</code> に2プロセスが書くと、アトミック書き込みをしていても<b>進行が巻き戻る / 混ざる</b>。</p>
  <ol><li><b><code>forceSingleInstance: 1</code> に変更</b> — これでほぼ解決</li>
  <li>保険としてロックファイル(<code>local_save/.lock</code>)の取得を検討</li></ol>
  <p><b>移植の最初期に入れること。</b></p>`},
 {id:'sv-enc', h:'セーブデータの暗号化', s:'d', b:`
  <h4>現状: 全て平文</h4>
  <ul><li><code>BindRepository&lt;T&gt;(key, isEncrypted)</code> の呼び出しは <b>60件すべて <code>isEncrypted: false</code></b></li>
  <li>暗号化パス(<code>EncryptedUpdateJsonPlayerData.cs</code> + <code>AES.cs</code>)は<b>実装済みだが一度も使われていない</b></li>
  <li>Anti-Cheat Toolkit も<b>導入済みだが使用ゼロ</b></li></ul>
  <h4>脅威モデルが移植で変わる</h4>
  <table><tr><th></th><th>モバイル</th><th>PC (Steam)</th></tr>
  <tr><td>セーブの場所</td><td>アプリサンドボックス内</td><td><code>%APPDATA%\\LocalLow\\...\\*.json</code></td></tr>
  <tr><td>改ざんの難易度</td><td>root / 脱獄が必要</td><td><b>メモ帳で開いて数字を書き換えるだけ</b></td></tr></table>
  <p><b>OS が守ってくれていた前提が消えます。</b></p>
  <blockquote>この判断は独立していません。<b>03 で通貨を売るなら必須、DLC のみ(B2)なら不要</b>。DLC の所有権は Steam 側が持つので偽造できず、セーブを改ざんされても売上は減りません。</blockquote>
  <p class="note">⚠️ 移行の罠: <code>isEncrypted</code> を false → true に変えると<b>保存先ファイル名が変わります</b>(<code>_saveData.json</code> → <code>_saveData.encrypted</code>)。モバイル版の既存プレイヤーのセーブが読めなくなるため、切り替えるなら「旧 .json があれば読んで .encrypted に書き直す」移行処理が必須。</p>`,
  opt:{items:[
   {k:'A',t:'平文のまま(03 が B2 の場合)',d:'何もしない。シングルプレイのアイドルゲームで、他人に迷惑がかからない改造は放置でよいという判断も成立する。',rec:true},
   {k:'B',t:'既存の AES を有効化',d:'isEncrypted: true に変えるだけ。実装コストほぼゼロ、カジュアルな改ざんは防げる。業界標準の水準。ただし移行処理が必要。'},
   {k:'C',t:'B + ACTk',d:'導入済みの Anti-Cheat Toolkit でメモリ改ざんも検出。CheatEngine 系に対応。追加費用なし。'},
   {k:'D',t:'サーバー権威',d:'進行をサーバーで検証。本作の規模では過剰。'},
  ]}},
 {id:'sv-cloud', h:'クラウドセーブ ── Firebase は Standalone 非対応', s:'d', b:`
  <p>現状は Firebase Firestore。<code>Settings/CloudSaveController.cs</code>(860行超)が競合解決まで担当しています。</p>
  <p><span class="ng">Firebase Unity SDK は Standalone を正式サポートしていません。</span>デスクトップ版は「開発用の限定サポート」で、Auth と Firestore は本番利用の対象外。逃げ道は2つ: (1) <code>FirebaseAuthHelper.cs</code> が既に REST API を直接叩いている (2) Firestore にも REST API がある。</p>
  <h4>A を採ると連鎖して解決すること</h4>
  <ul><li><b>ログイン UI が不要になる</b>(Steam アカウント = プレイヤー識別)</li>
  <li><code>AppleLogin.cs</code> が Windows でコンパイルから消える問題が消滅</li>
  <li>SimpleSignIn の Google OAuth を PC で検証する必要がなくなる</li>
  <li><code>CloudSaveController</code> の競合解決(575-691行)は Steam クライアントに任せられる</li></ul>`,
  opt:{items:[
   {k:'A',t:'Steam Cloud のみ',d:'Steam 版は Steam Cloud に一本化し、Firebase を使わない。実装が最も軽く、Firebase の Standalone 検証を丸ごと回避できる。クロスプログレッションはスコープ外なのでこれで足りる。',rec:true},
   {k:'B',t:'Firebase を REST 化',d:'モバイルと同じバックエンド。将来のクロスプログレッションに繋がるが実装コスト大。'},
   {k:'C',t:'両方',d:'Steam Cloud を主、Firebase を副。競合解決が3者間になり複雑。'},
  ]}},
 {id:'sv-sync', h:'同期対象の設計', s:'k', b:`
  <table><tr><th>#</th><th>論点</th><th>方針</th></tr>
  <tr><td>C1</td><td>何を同期するか</td><td><code>local_save/</code> 配下のセーブファイルのみ。ログ・キャッシュは含めない</td></tr>
  <tr><td>C2</td><td>PlayerPrefs</td><td><b>同期しない。</b>音量やロケールは端末ごとの設定であるべき</td></tr>
  <tr><td>C3</td><td>競合解決</td><td>Steam クライアントに任せる</td></tr>
  <tr><td>C4</td><td>容量</td><td>セーブ1式のサイズを計測して Steamworks の割当を設定</td></tr></table>
  <p class="note">⚠️ C2 は要監査 — PlayerPrefs に<b>進行状態が混ざっています</b>: <code>AdsClient.cs</code> の <code>RemoveAdsPurchased</code> / <code>NetherExtraAttemptsPurchased</code>(課金による恒久アンロック)、<code>PopUpView.cs</code> の「二度と表示しない」、<code>ReviewCall.cs</code> のレビュー済みフラグ。課金アンロックが PlayerPrefs にしか無いと<b>別 PC で復元されません</b>。→ 03 の DLC 所有権判定に置き換えれば同時に解決。</p>`},
 {id:'sv-test', h:'テスト項目 ── T3 と T7 は必ず手動で', s:'k', b:`
  <table><tr><th>#</th><th>項目</th></tr>
  <tr><td>T1</td><td>プレイ → 終了 → 再起動で進行が保持される</td></tr>
  <tr><td>T2</td><td>二重起動が防がれる</td></tr>
  <tr><td>T3</td><td><b>プレイ中に強制終了 → 再起動でセーブが壊れていない</b></td></tr>
  <tr><td>T4</td><td>別 PC で同じ Steam アカウント → 進行が復元される</td></tr>
  <tr><td>T5</td><td>オフラインでプレイ → オンライン復帰で同期される</td></tr>
  <tr><td>T6</td><td>Steam Cloud を無効にしてもローカルセーブだけで正常に動く</td></tr>
  <tr><td>T7</td><td><b>2台で同時プレイ → 競合ダイアログが出て、選んだ方が正しく適用される</b></td></tr>
  <tr><td>T8</td><td>DLC 購入分が別 PC で復元される</td></tr></table>
  <p><span class="ng">T3 と T7 が壊れているとリリース後に取り返しがつきません。</span></p>`},
]},

/* ============================ 05 表示・入力 ============================ */
{id:'display', nav:'05 横長レイアウトと PC 操作', group:'仕様', title:'横長レイアウトと PC 操作', desc:'最大工数。縦画面 UI の横長対応、Equipment のマウス操作、キーボードショートカット。', src:'docs/steam-release/05_Input_and_Display.md', secs:[
 {id:'ds-cost', h:'管理コストを2倍にしない ── 原因の特定', s:'k', b:`
  <p>管理コストが2倍になるのは <b>「UXML を縦用と横用の2セット持つ」場合だけ</b>です。レイアウト差分をどう吸収するかではなく、<b>資産を複製するかどうか</b>が分岐点。</p>
  <blockquote><b>UXML は単一ソースのまま。プラットフォーム差は「どこに置くか」だけに閉じる。</b></blockquote>
  <h4>使える資産が既にある</h4>
  <p><code>Main/SceneInitializer.cs</code> は起動時に<b>全シーンを Additive でロード済み</b>で、<code>SceneInfo.ActiveScenes</code> で<b>同時表示するシーンを宣言</b>しています。Cave は既に5シーンを同時表示中。<br>
  <span class="okw">「複数コンテンツを同時に画面に出す」機構は既に本番で動いています。</span>横長対応は新機能ではなく、この宣言を増やして配置先を指定するだけ。</p>`},
 {id:'ds-design', h:'3カラム設計と差し込み点', s:'k', b:`
  <blockquote>論理キャンバス(16:9 で 2844 × 1600)<br>
  ┌────────────┬────────────┬────────────┐<br>
  │ Left 972 │ Center 900 │ Right 972 │<br>
  │ Equipment │ Cave(既存) │ Relic │<br>
  └────────────┴────────────┴────────────┘</blockquote>
  <p>中央 900 は設計値そのまま。左右の 972 も設計幅 900 とほぼ同じなので、<b>既存 UXML をそのまま挿せます</b>。各 UIDocument のルートを列コンテナに<b>実行時に付け替える</b>(<code>RemoveFromHierarchy()</code> → <code>column.Add()</code>)。UXML の中身は触りません。</p>
  <table><tr><th>要素名(<code>Main/MainUI2.uxml</code>)</th><th>役割</th></tr>
  <tr><td><code>MainArea</code></td><td><b>コンテンツの描画先。ここを3カラム化する</b></td></tr>
  <tr><td><code>BottomArea</code> / <code>ButtomButtonUXML</code></td><td>タブバー。横長でも<b>下部に横断させたまま</b>でよい</td></tr>
  <tr><td><code>PopUpContainer</code> / <code>GlobalModalBlocker</code></td><td>ポップアップ。<b>中央カラムではなく画面全体に対して出す</b></td></tr></table>
  <p><span class="okw">改修は MainArea の中に <code>flex-direction: row</code> の3カラムコンテナを入れるだけ。タブバーとポップアップの仕組みは無改修。</span></p>`},
 {id:'ds-rules', h:'2倍にしないための運用ルール', s:'k', b:`
  <table><tr><th>#</th><th>ルール</th></tr>
  <tr><td>R1</td><td><b>UXML を複製しない。</b>横長専用 UXML を作った時点で敗北</td></tr>
  <tr><td>R2</td><td><b>横長専用の画面を作らない。</b>「横長 = 縦長の画面を並べたもの」と定義を固定する</td></tr>
  <tr><td>R3</td><td><b>新機能は常に縦長 900 幅で作る。</b>横長対応は <code>WideExtraScenes</code> に1行足すだけ</td></tr>
  <tr><td>R4</td><td><b>アスペクト比判定は1箇所。</b><code>LayoutMode</code>(Narrow/Wide)を <code>ReactiveProperty</code> で公開し、各 View は購読するだけ</td></tr>
  <tr><td>R5</td><td><b>USS は新規ファイルを作らず、既存 USS に <code>.wide</code> セレクタを足す。</b></td></tr>
  <tr><td>R6</td><td><b>判定はプラットフォームではなくアスペクト比。</b>折りたたみ端末やタブレット横持ちが自動で恩恵を受ける</td></tr></table>`},
 {id:'ds-stage', h:'どの段階まで 1.0 に入れるか', s:'d', b:`
  <table><tr><th>段階</th><th>内容</th><th>到達点</th></tr>
  <tr><td>1</td><td>3カラムのフレックス枠を用意し、左右を <code>display: none</code> に(= 中央900固定のレターボックス)</td><td><b>崩れない状態</b>。ここまでで遊べる</td></tr>
  <tr><td>2</td><td><code>WideExtraScenes</code> を実装し、コンテンツを左右に挿す</td><td>横長らしい画面</td></tr>
  <tr><td>3</td><td>幅が足りないときに自動で段階1に戻す</td><td>ウィンドウリサイズ対応</td></tr></table>
  <p class="note">段階1は段階2の前提であり、捨て仕事になりません。</p>`,
  opt:{items:[
   {k:'A',t:'段階1まで(レターボックス)',d:'1.0 は「崩れない」で出す。横長らしさは 1.1 以降。工数最小。'},
   {k:'B',t:'段階2まで',d:'左右に常設コンテンツを出す。PC ゲームとして見られる水準。',rec:true},
   {k:'C',t:'段階3まで',d:'ウィンドウリサイズに追従。PC では実質必須という見方もある。'},
  ]}},
 {id:'ds-place', h:'何を左右に置くか', s:'d', b:`
  <p>現在のタブは Cave / Equipment / Battle_New / Shop / Prestige / Relic の6つ(+ 廃止予定の Ads)。<b>コンテンツを「常設サイド」と「中央切替」に二分する</b>案:</p>
  <table><tr><th>配置</th><th>コンテンツ</th><th>理由</th></tr>
  <tr><td><b>左に常設</b></td><td>Equipment</td><td>装備は Cave / Battle の両方に影響する。切り替えずに効果を確認しながら遊べるのが横長の最大の価値</td></tr>
  <tr><td><b>中央(タブ切替)</b></td><td>Cave / Battle_New / Prestige / Shop / Nether</td><td>主活動。1つずつ見れば足りる</td></tr>
  <tr><td><b>右に常設</b></td><td>Relic</td><td>常時見えていて嬉しい情報</td></tr></table>
  <p><b>左右に常設したコンテンツはタブバーから外します。</b>「常に見えているのにタブもある」状態は混乱を招くため。これが「タブボタンをどう扱うか」への答えになります。</p>
  <p class="note">懸念: <b>Equipment は 3タブ構成(スロット/ストレージ・アップグレード・変換)+ 30件/ページのストレージ + 詳細パネルを持つフル画面</b>で、972 幅の常設サイドには詰め込みすぎな可能性があります。</p>`,
  opt:{items:[
   {k:'A',t:'左 Equipment(全体) / 右 Relic',d:'資料の案そのまま。実装は最も単純(シーンをそのまま挿すだけ)。'},
   {k:'B',t:'左 Equipment の Tab0 のみ / 右 Relic',d:'スロットとストレージだけをサイドに出し、アップグレード・変換は中央タブに残す。詰め込みすぎを回避。',rec:true},
   {k:'C',t:'別の配置にする',d:'コメントに希望の配置を書く。'},
  ]}},
 {id:'ds-camera', h:'Cave のカメラ ── 横長で中央からはみ出す', s:'k', b:`
  <p><code>Cave/SquareFitCamera.cs</code> の <code>Fit()</code> は <code>Screen.width</code> / <code>height</code> / <code>safeArea</code> から正方形が収まる <code>orthographicSize</code> を算出しています。横長画面では縦方向の制約が支配的になり、<b>Cave が画面いっぱいに広がって中央カラムからはみ出します。</b></p>
  <ol><li><b>カメラの <code>rect</code> を中央カラムの正規化矩形に設定する</b>(<code>cam.rect = new Rect(x, 0, w, 1)</code>)</li>
  <li><b><code>Fit()</code> の基準を <code>Screen.*</code> から <code>cam.pixelWidth</code> / <code>cam.pixelHeight</code> に変える</b></li></ol>
  <p>これで縦長・横長を問わず「与えられた描画領域に正方形を収める」という同じロジックで動きます。<code>Screen.safeArea</code> 依存も同時に外せます。</p>
  <p class="note">⚠️ <code>cam.rect</code> を絞るとカメラは自分の矩形しかクリアしません。左右カラムの背景を別途用意するか、背景専用カメラを1枚置く必要があります。</p>`},
 {id:'ds-mouse', h:'Equipment のマウス操作 ── 前提の訂正あり', s:'k', b:`
  <p class="note">⚠️ 調査の結果、<b>このゲームに Minecraft 的な「1マスにN個」のスタックは無い</b>ことが分かりました。1アイテム = 1インスタンス = 1スロット占有(guid で個体識別)、<code>StackBasedLevel</code> は「同種を何個マージしたか」であって個数ではありません。マージ条件は<b>同 Kind かつ同 Level の2個 → 1個</b>。<br>
  したがって Minecraft の「ダブルクリックで集約」は<b>そのままでは写像できず</b>、本作での対応物は「<b>同種同レベルのアイテムを可能な限り連続マージする</b>」になります。</p>
  <h4>提案する PC 操作</h4>
  <table><tr><th>操作</th><th>挙動</th><th>備考</th></tr>
  <tr><td><b>Shift + クリック</b></td><td>スロット ⇄ ストレージへ即時移動</td><td><b>最も効果が大きい</b>(現在は「選択→対象をタップ」の2手)</td></tr>
  <tr><td><b>ダブルクリック</b></td><td>可能な限り連続マージ</td><td>現在は詳細パネルに割り当て済み。<b>付け替えが必要</b></td></tr>
  <tr><td><b>右クリック</b></td><td>詳細パネルを開く</td><td>ダブルクリックから移設</td></tr>
  <tr><td><b>Ctrl + クリック</b></td><td>削除/リロールモードでの複数選択</td><td>既存の <code>DeletionModeManager</code> に載せる</td></tr>
  <tr><td><b>ホイール</b></td><td>ストレージのページ送り</td><td>30件/ページのページング式</td></tr></table>
  <p class="note">修飾キーの判定は<b>プロジェクト全体で未実装</b>(<code>shiftKey</code> / <code>ctrlKey</code> / <code>evt.button</code> は未使用)。<code>ItemDragHandler.OnPointerDown</code> に足すのが最小変更です。また <code>LongPressDuration = 0.1f</code> はマウスだと体感で引っかかるため<b>入力デバイスで値を分ける</b>べき。アイコンの表示制御が <code>display</code> でなく <code>opacity</code> 依存で、D&D のゴースト生成がこれを見ているので<b>触ると D&D が壊れます</b>。</p>
  <p><span class="okw">効果の見積もり:</span> 既に一括操作は充実しています(オートマージ / オート装備 / オート生成 / 一括削除 / 一括リロール / 一括変換 / 整列)。<b>PC 化で本当に効くのは Shift+クリックによる手数削減</b>で、それ以外は既存機能で足りている可能性が高いです。</p>`},
 {id:'ds-mergeapi', h:'一括マージ API をどこに置くか', s:'d', b:`
  <p>ドメインに一括 API はありません(<code>CanMerge</code> / <code>Merge</code> は全て 1:1)。既存の <code>CrusherAutoMergeManager</code> は ViewModel 層で 1:1 をループする方式です。<b>ドメインを変更した場合は DLL のビルドと Unity への反映が必須</b>(→ AGENTS.md)。</p>`,
  opt:{items:[
   {k:'A',t:'ViewModel 層で 1:1 をループ',d:'既存 CrusherAutoMergeManager と同じ方式。ドメイン変更なし = DLL ビルド不要。',rec:true},
   {k:'B',t:'ドメインに一括 API を足す',d:'テストが書け、モバイル版のオートマージとも共有できる。DLL ビルドと反映が必要。'},
  ]}},
 {id:'ds-key', h:'キーボードショートカット ── 数字キーとディスパッチャ', s:'k', b:`
  <p><b>実装点は1箇所。</b><code>Main/SceneSwitcherMono.cs:73-82</code> の <code>RegisterButtonFunc()</code> 呼び出しがタブ登録の唯一の場所で、<code>buttonReferences</code>(SceneKind → Button)を持っています。ここで<b>登録順に</b>キーを振るだけ。</p>
  <table><tr><th>キー</th><th>コンテンツ</th></tr>
  <tr><td>1〜6</td><td>Cave / Equipment / Battle_New / Shop / Prestige / Relic(登録順)</td></tr>
  <tr><td>—</td><td>ScreenSave(機能なので振らない) / Nether(タブに無い)</td></tr>
  <tr><td><code>Esc</code></td><td>ポップアップを閉じる / 何も開いていなければ設定を開く</td></tr>
  <tr><td><code>Space</code></td><td>主要アクション(コンテンツごとに定義)</td></tr></table>
  <p class="note">⚠️ Ads は Steam 版で廃止され番号が繰り上がるため、<b>固定値でハードコードせず登録順から動的に振ること</b>。そうすればモバイル版と Steam 版で別々の番号表を持たずに済みます。タブ UI に番号を表示すれば覚えなくても使えます。</p>
  <h4>設計 ── 各 View に Input.GetKeyDown を書かせない</h4>
  <p>コンテンツは「自分がアクティブなときの意味」を<b>宣言するだけ</b>にします(<code>IShortcutProvider</code>: Owner + Shortcuts)。ディスパッチャは1つだけで、アクティブな <code>SceneKind</code> の Provider にだけキーを流し、<b>起動時に全 Provider を集めて重複を検出</b>。割り当て済みのキーは<b>ボタンのラベルに自動表示</b>(<code>[Q] 採掘</code>)し、ヘルプ画面も同じデータから生成します。</p>`},
 {id:'ds-qwert', h:'QWERT に何を割り当てるか', s:'d', b:`
  <p>同じ物理キーが、開いているコンテンツによって別の意味を持ちます。Cave / Equipment / Battle それぞれで Q W E R T が何をするか、<b>コンテンツごとの個別設計</b>が要ります。現状は全て未定です。</p>`,
  opt:{items:[
   {k:'A',t:'1.0 では実装しない',d:'ディスパッチャの器だけ作り、割り当ては空。数字キーと Esc/Space のみ。'},
   {k:'B',t:'Cave のみ先に決める',d:'最も長く滞在する画面から。他は 1.1 以降。',rec:true},
   {k:'C',t:'全コンテンツ分いま決める',d:'このサイトでコンテンツごとにブレストする。'},
  ]}},
 {id:'ds-misc', h:'その他の PC 対応', s:'k', b:`
  <table><tr><th>#</th><th>項目</th><th>対応</th></tr>
  <tr><td>P1</td><td><code>FrameRateController.cs</code> が <b>Windows を 30fps 固定</b>にしている</td><td>プラットフォーム分岐をやめ、設定値(既定 60)にする</td></tr>
  <tr><td>P2</td><td><code>forceSingleInstance: 0</code></td><td><b>1 に変更</b>(→ 04)</td></tr>
  <tr><td>P3</td><td>Standalone bundle ID が <code>com.idlesystem.IdleSphere</code>(旧作)</td><td>変更する</td></tr>
  <tr><td>P4</td><td>既定解像度 1024×768(4:3)</td><td>1280×720 以上に変更</td></tr>
  <tr><td>P5</td><td>解像度 / ウィンドウモード / vsync の設定 UI が無い</td><td><code>Settings/SettingsView.cs</code> に追加</td></tr>
  <tr><td>P6</td><td><code>Cave/Block/InputHandler.cs</code> にピンチズーム相当が無い</td><td>ホイールでズーム、中ドラッグでパン</td></tr>
  <tr><td>P7</td><td><code>ScreenSaveController.cs</code> がマウス移動を入力とみなさない</td><td><code>Input.mousePosition</code> の変化検出を追加。優先度低</td></tr></table>`},
 {id:'ds-first', h:'最初にやること', s:'k', b:`
  <blockquote><b>空の Windows ビルドを起動してスクリーンショットを撮る。</b></blockquote>
  <p>この章の横長時の挙動は<b>設定値とマークアップからの推論であり、実測ではありません</b>。実際の崩れ方を見てから段階1を設計すること。02 の作業順序 2(SteamAPI.Init 検証)と同じビルドで済みます。</p>`},
]},

/* ============================ 06 Steam 機能 ============================ */
{id:'features', nav:'06 Steam 機能', group:'仕様', title:'Steam 機能', desc:'Steam が提供する機能のうち、本作で使う候補と採否。', src:'docs/steam-release/06_Steam_Features.md', secs:[
 {id:'ft-list', h:'一覧と採否', s:'k', b:`
  <table><tr><th>機能</th><th>何か</th><th>採否</th></tr>
  <tr><td><b>実績</b></td><td>条件を満たすとアイコンとテキストが解除。プロフィールに並ぶ</td><td><b>必須</b></td></tr>
  <tr><td><b>統計</b></td><td>プレイヤーごとの数値を Steam 側に保存。実績の進捗表示に使う</td><td><b>必須</b>(実績の土台)</td></tr>
  <tr><td><b>Steam Cloud</b></td><td>セーブを Steam アカウントに同期。別 PC で自動復元</td><td><b>必須</b></td></tr>
  <tr><td><b>オーバーレイ</b></td><td>Shift+Tab で出る重ね表示。フレンド、ブラウザ、スクショ</td><td><b>必須</b>(実質デフォルトで動く)</td></tr>
  <tr><td><b>スクリーンショット</b></td><td>F12 で撮って Steam にアップロード</td><td><b>必須</b>(オーバーレイに付属)</td></tr>
  <tr><td><b>リッチプレゼンス</b></td><td>フレンドリストに「Cave 深度 1200 を探索中」を出す</td><td>採用</td></tr>
  <tr><td><b>リーダーボード</b></td><td>Steam がホストするランキング</td><td>検討</td></tr>
  <tr><td><b>トレーディングカード</b></td><td>プレイでドロップするカード。売買可能</td><td><b>見送り</b>(申請が要る。リリース後でよい)</td></tr>
  <tr><td><b>ワークショップ</b></td><td>ユーザー製 MOD の配布</td><td><b>見送り</b></td></tr>
  <tr><td><b>Steam 入力</b></td><td>コントローラ設計の統一レイヤ</td><td><b>見送り</b>(ゲームパッド非対応)</td></tr></table>`},
 {id:'ft-ach', h:'実績 ── 後から削除できない', s:'k', b:`
  <ul><li><b><code>IAchievementService</code> 経由で呼ぶ。</b>モバイル版は No-Op 実装なので、ゲームロジックに<b>プラットフォーム分岐を書かずに</b>解除呼び出しを置けます</li>
  <li>Steam は解除後に <code>Store()</code> の明示呼び出しが要る。毎フレーム呼ばず、まとめてコミットする</li>
  <li><b>オフラインでも解除できる</b>。Steam クライアントがローカルにキューし、オンライン復帰時に送る</li></ul>
  <table><tr><th>種類</th><th>例</th></tr>
  <tr><td>進行</td><td>Cave 深度 100 / 1000 / 10000 到達</td></tr>
  <tr><td>プレステージ</td><td>初回、10回、100回</td></tr>
  <tr><td>収集</td><td>Equipment を n 種類入手、Relic を全種入手</td></tr>
  <tr><td>戦闘</td><td>ステージクリア、ボス撃破</td></tr>
  <tr><td>累計</td><td>累計採掘量、累計プレイ時間</td></tr>
  <tr><td>隠し</td><td>スクリーンセーバーを n 分見る 等</td></tr></table>
  <blockquote><b>実績は後から削除できません。</b>追加はできますが、削除・意味の変更は取得済みプレイヤーに影響します。<b>最初に全体像を決めてから登録すること。</b></blockquote>`},
 {id:'ft-achnum', h:'実績の数', s:'d', b:`
  <p>多すぎると1つの価値が下がり、少なすぎるとコンプリート欲が働きません。アイドルゲームは 30〜60 が相場。<b>アイコン制作コスト(解除前/解除後の2種 × 実績数)が直結します</b>(→ Q6)。</p>`,
  opt:{items:[
   {k:'A',t:'20〜30(絞る)',d:'アイコン制作が現実的。既存コンテンツの節目だけを拾う。'},
   {k:'B',t:'30〜60(相場)',d:'コンプリート欲が働く。アイコンは統一テンプレで量産する前提。',rec:true},
   {k:'C',t:'60以上',d:'実績目当てのプレイヤーに刺さるが、制作と判定実装の工数が大きい。'},
  ]}},
 {id:'ft-achwhere', h:'実績条件をどこで判定するか', s:'d', b:`
  <p>資料の推奨は「<b>ドメイン(GamesDomain)に判定を置き、Unity 側の <code>IAchievementService</code> は解除呼び出しだけを担う</b>」。既存のセーブデータから実績条件を判定できるかは <code>IdleSystem.Core.dll</code> 内のドメインに依存します。</p>`,
  opt:{items:[
   {k:'A',t:'ドメインに判定を置く',d:'テストが書ける。モバイル版でも同じ判定が使える(No-Op なので実害なし)。DLL ビルドと反映が必要。',rec:true},
   {k:'B',t:'Unity 側に判定を置く',d:'ドメインを触らない。ただし判定ロジックがテスト外に出る。'},
  ]}},
 {id:'ft-lb', h:'リーダーボードの採否', s:'d', b:`
  <p>実装コストは低い(スコア送信と取得の API のみ)。ただしアイドルゲームのランキングは<b>チートと放置時間の勝負になりやすい</b>: セーブがローカルにある以上改ざんは容易で(→ 04 の暗号化と関連)、上位が現実的に届かない数字だとかえってモチベーションを下げます。</p>`,
  opt:{items:[
   {k:'B',t:'フレンド内ランキングのみ',d:'全世界順位は出さない。改ざんの影響が身内に閉じ、比較対象としては機能する。',rec:true},
   {k:'A',t:'導入しない',d:'工数ゼロ。アイドルゲームに順位は要らないという判断。'},
   {k:'C',t:'放置時間に比例しない指標に限定',d:'プレステージ回数など。設計に手間はかかるが健全。'},
  ]}},
 {id:'ft-rp', h:'リッチプレゼンスに何を出すか', s:'d', b:`
  <p>フレンドリストに現在の状況を表示します(例: 「Idle Minertia をプレイ中 / Cave 深度 1,240 を探索中」)。表示文字列は<b>ローカライズ用のキー</b>で送るので、既存の13言語対応がそのまま活きます。更新頻度は低くてよい。</p>`,
  opt:{items:[
   {k:'A',t:'Cave 深度',d:'進行が一目で伝わり、フレンド間の比較になる。最も分かりやすい。',rec:true},
   {k:'B',t:'現在のコンテンツ名',d:'「Equipment を整理中」など。状況は分かるが自慢にならない。'},
   {k:'C',t:'深度 + プレステージ回数',d:'情報量は最大。文字列が長くなる。'},
  ]}},
 {id:'ft-ov', h:'オーバーレイの確認事項', s:'k', b:`
  <p><b>基本的に何もしなくても動きます。</b>ただし:</p>
  <table><tr><th>#</th><th>確認</th></tr>
  <tr><td>O1</td><td><code>Application.OpenURL</code>(Discord 3箇所、プライバシーポリシー1箇所)が Steam Overlay 経由で開く。<b>Overlay を無効にしているユーザーで外部ブラウザにフォールバックするか</b>要確認</td></tr>
  <tr><td>O2</td><td>フルスクリーン時にオーバーレイが正しく重なるか(排他フルスクリーンだと問題が出ることがある。<b>ボーダーレス推奨</b>)</td></tr>
  <tr><td>O3</td><td>オーバーレイを開いた際にゲームが一時停止すべきか(アイドルゲームなので<b>停止しない</b>のが正解)</td></tr></table>`},
]},

/* ============================ 覚書 ============================ */
{id:'steamworks', nav:'Steamworks 管理画面', group:'覚書', title:'Steamworks 管理画面の作業', desc:'仕様ではなく、リリース前にやることの覚書。', src:'docs/steam-release/Memo/Steamworks_Setup.md', secs:[
 {id:'sw-appid', h:'🔴 最初に確認: AppID 3217600', s:'q', b:`
  <p>→ <a href="#ask" onclick="go('ask')">Q1(あなたに聞きたいこと)</a> で決めます。<b>全スケジュールの起点</b>です。</p>`},
 {id:'sw-todo', h:'やることリスト', s:'k', b:`
  <h4>アプリ設定</h4>
  <ul><li>AppID の確認 / 新規取得</li><li>アプリ名、対応 OS、対応言語の登録(本作は13言語)</li><li>Depot 構成(Windows / macOS を分けるか共通にするか)</li><li>Branch 構成(<code>default</code> / <code>beta</code>)</li></ul>
  <h4>ストアページ</h4>
  <ul><li>説明文(13言語分? 最低でも英語 + 日本語)</li><li>カプセル画像各サイズ、スクリーンショット、トレーラー</li><li>タグ、ジャンル、カテゴリ</li><li>価格設定(F2P なら本体無料)</li></ul>
  <h4>審査・法務</h4>
  <ul><li>年齢レーティング</li><li>プライバシーポリシー(既存 URL を流用できるか)</li><li>ストアページ審査 → 公開 → リリースまでの必須待機期間</li><li>ビルド審査の所要日数</li></ul>
  <h4>機能</h4>
  <ul><li>実績の登録(<b>後から削除できないので一覧確定後に</b>)</li><li>統計の登録</li><li>Steam Cloud の設定(同期対象パス、容量割当)</li><li>リッチプレゼンスの文言登録(多言語)</li></ul>`},
 {id:'sw-unknown', h:'未調査(公式ドキュメントで確認すること)', s:'q', b:`
  <ul><li>ゲーム内通貨販売の申請要件と審査基準</li>
  <li>Steam Microtransaction にサーバー側実装が必要か</li>
  <li>Steam Cloud の Auto-Cloud で <code>%APPDATA%\\LocalLow\\...</code> を指定する書式</li>
  <li>カプセル画像の必要サイズ一覧</li>
  <li>ストアページ公開からリリースまでの必須待機期間</li></ul>
  <p class="note">これらは Claude では確定できません。<b>フェーズ2に持ち越せない項目</b>です。</p>`},
]},
{id:'build', nav:'ビルドと配信', group:'覚書', title:'ビルドと配信', desc:'既存資産の陳腐化と、自動化の障壁。', src:'docs/steam-release/Memo/Build_and_Release.md', secs:[
 {id:'bd-assets', h:'既存資産の状況', s:'k', b:`
  <table><tr><th>項目</th><th>状況</th></tr>
  <tr><td><code>Assets/Editor/DeploySteam.cs</code></td><td><b>旧作 "Idle Sphere" 用で陳腐化。</b>存在しないシーンを参照。実質作り直し</td></tr>
  <tr><td><code>Deploy/&lt;platform&gt;/deploy.sh</code> + <code>fastlane/</code></td><td>モバイル用。Steam 用の lane を足すか、別系統にするか</td></tr>
  <tr><td><code>Build/sdk/tools/ContentBuilder/</code></td><td><code>DeploySteam.cs</code> が前提にしているパス。実在するか要確認</td></tr></table>`},
 {id:'bd-settings', h:'Unity 側の設定変更', s:'k', b:`
  <ul><li>Standalone bundle ID: <code>com.idlesystem.IdleSphere</code> → 変更</li>
  <li><code>forceSingleInstance: 0</code> → <code>1</code></li>
  <li>既定解像度 1024×768 → 1280×720 以上</li>
  <li>Scripting Define から <code>STEAMWORKS_NET</code> をモバイル向けから削除</li>
  <li>Steamworks.NET の二重導入を解消</li></ul>
  <p class="note">⚠️ Unity Editor が開いていると <code>ProjectSettings.asset</code> の変更が巻き戻ります(CLAUDE.md 既知の落とし穴)。</p>`},
 {id:'bd-post', h:'ビルド後処理と自動化', s:'k', b:`
  <ul><li><b><code>steam_appid.txt</code> をリリースビルドに同梱しない。</b>同梱すると誰でも AppID を書き換えて他のゲームとして起動できます</li>
  <li>macOS: Apple の公証(Notarization)が必要かどうかを確認。必要なら署名パイプラインを別途構築</li>
  <li>macOS: Apple Silicon / Universal Binary の要否</li>
  <li><code>steamcmd</code> で非対話アップロード</li>
  <li><b>Steam Guard(2FA)を非対話環境でどう通すか</b>(CI の最大の障壁)</li></ul>
  <h4>モバイル版から引き継ぐ既知の落とし穴</h4>
  <ul><li>非対話シェルでは <code>LANG</code> / <code>LC_ALL</code> 未設定だと Ruby が US-ASCII 動作になり fastlane が落ちる</li>
  <li>非対話シェルで <code>git push</code> が失敗する(認証が読めない)</li>
  <li>Unity Editor が起動中だとビルドがプロジェクトロックで失敗する</li></ul>`},
 {id:'bd-ci', h:'配信の自動化をどこまでやるか', s:'d', b:`
  <p>Steam Guard の非対話対応が最大の障壁です。手動アップロードでも回数は多くないので、割に合うかは頻度次第。</p>`,
  opt:{items:[
   {k:'A',t:'手動アップロードでよい',d:'steamcmd を対話で叩く。リリース頻度が低いなら十分。',rec:true},
   {k:'B',t:'自動化する',d:'ssfn ファイル等で Steam Guard を通す調査が必要。'},
  ]}},
]},
{id:'qa', nav:'QA と法務', group:'覚書', title:'QA と法務', desc:'テスト観点、ローカライズ、法務チェック。', src:'docs/steam-release/Memo/QA_and_Compliance.md', secs:[
 {id:'qa-test', h:'テスト観点(セーブ以外)', s:'k', b:`
  <h4>画面</h4>
  <ul><li>主要解像度で崩れないか(1920×1080 / 2560×1440 / 3440×1440 / 1280×800)</li><li>ウィンドウのリサイズ中・最大化・フルスクリーン切り替え</li><li>マルチモニタ環境での起動位置</li><li>DPI スケーリング 125% / 150% の Windows</li></ul>
  <h4>入力</h4>
  <ul><li>マウスのみで全操作が完結するか</li><li>キーボードショートカットの衝突</li><li>Equipment のマウス操作</li></ul>
  <h4>Steam 統合</h4>
  <ul><li>Steam クライアント未起動で exe を直接叩いても落ちない</li><li>オフラインモードで起動・プレイできる</li><li>オーバーレイがフルスクリーンで正しく重なる</li><li>実績がオフラインで解除され、オンライン復帰時に反映される</li></ul>
  <h4>長時間</h4>
  <ul><li>数時間の放置でメモリリーク / fps 低下が無いか(アイドルゲーム特有)</li><li>スリープ復帰後に正常に動くか</li></ul>`},
 {id:'qa-loc', h:'ローカライズ', s:'k', b:`
  <ul><li>13言語対応済み(<code>en ja ko zh-Hans zh-Hant de fr es it pt ru id ar</code>)</li>
  <li><b><code>UI_Ads</code> テーブルは Steam 版で丸ごと不要</b></li>
  <li><b><code>UI_Shop</code> は課金文言の書き換えが必要</b></li>
  <li><code>CommandLineLocaleSelector</code>(<code>-language=</code> 引数)が設定済みなので、<b>Steam の起動オプションで言語切替ができます</b></li></ul>`},
 {id:'qa-store-lang', h:'ストアページを何言語で用意するか', s:'d', b:`
  <p>ゲーム本体は13言語対応済みですが、ストアページの説明文は別途翻訳が要ります。</p>`,
  opt:{items:[
   {k:'A',t:'英語 + 日本語',d:'最小構成。他言語は「ゲーム内は対応」と書けば伝わる。',rec:true},
   {k:'B',t:'主要言語(英日中韓 + 独仏西)',d:'露出が増える。翻訳コストは中程度。'},
   {k:'C',t:'13言語すべて',d:'ゲーム本体と揃う。コスト最大。'},
  ]}},
 {id:'qa-legal', h:'法務', s:'k', b:`
  <ul><li>プライバシーポリシー(既存 URL を流用できるか。<code>NetherCompanionBrowserView.cs</code> が参照)</li>
  <li>EULA の要否</li>
  <li>Firebase を Steam 版で使わないなら、収集する個人情報が減る。ポリシーの記述を見直す</li>
  <li>特定商取引法の表示(日本向けに課金を行う場合)</li>
  <li>サードパーティライセンス表記(Steamworks.NET, UniTask, R3, Zenject, I2, Odin 等)</li></ul>

]},

/* ---------- store ---------- */
const LS_KEY='minertia_steam_feedback_v1';
const API=(location.protocol==='http:'||location.protocol==='https:')?'':'http://localhost:8138';
let SERVER=false;           // サーバー接続中なら feedback.json へ自動永続化
let READONLY=false;         // 静的配信(GitHub Pages 等)。閲覧専用
let STORE={comments:{},reactions:{},choices:{}};
try{const s=localStorage.getItem(LS_KEY); if(s) STORE=Object.assign({comments:{},reactions:{},choices:{}},JSON.parse(s));}catch(e){}
let postTimer=null;
function save(){
  if(READONLY)return;
  try{localStorage.setItem(LS_KEY,JSON.stringify(STORE));}catch(e){}
  if(SERVER){
    clearTimeout(postTimer);
    postTimer=setTimeout(()=>{
      fetch(API+'/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(STORE)})
        .catch(()=>{SERVER=false;renderTop();});
    },250);
  }
}
function mergeStores(local,remote){
  const out={comments:{},reactions:{},choices:{}};
  const ids=new Set(Object.keys(local.comments||{}).concat(Object.keys(remote.comments||{})));
  for(const id of ids){
    const seen=new Set();const arr=[];
    const all=(remote.comments&&remote.comments[id]||[]).concat(local.comments&&local.comments[id]||[]);
    for(const c of all){const k=c.ts+'|'+c.text;if(!seen.has(k)){seen.add(k);arr.push(c);}}
    arr.sort((a,b)=>a.ts<b.ts?-1:1);
    if(arr.length)out.comments[id]=arr;
  }
  out.reactions=Object.assign({},remote.reactions||{},local.reactions||{});
  out.choices=Object.assign({},remote.choices||{},local.choices||{});
  return out;
}
async function connectServer(){
  try{
    const r=await fetch(API+'/api/feedback',{cache:'no-store'});
    if(!r.ok)throw 0;
    const remote=await r.json();
    STORE=mergeStores(STORE,remote);   // 過去分(ファイル)とこのブラウザ分を統合
    SERVER=true;
    save();                             // 統合結果をファイルへ書き戻し
    return;
  }catch(e){SERVER=false;}
  // サーバーが無い場合、同じ場所に置かれた feedback.json を静的に読む。
  // GitHub Pages などの閲覧専用配信はこの経路になる。
  try{
    const r=await fetch('feedback.json',{cache:'no-store'});
    if(!r.ok)throw 0;
    const remote=await r.json();
    if(!remote||typeof remote!=='object')throw 0;
    STORE={comments:remote.comments||{},reactions:remote.reactions||{},choices:remote.choices||{}};
    READONLY=true;                      // 書き込み導線をすべて閉じる
  }catch(e){}
}

/* ---------- state ---------- */
let curPage=location.hash?location.hash.slice(1):'home';
let filter='all';
function allSecs(){const out=[];for(const p of DB){for(const s of p.secs)out.push({p,s});}return out;}
function decisions(){return allSecs().filter(x=>x.s.opt);}
function decDone(){return decisions().filter(x=>STORE.choices[x.s.id]).length;}
function pageCommentCount(p){let n=0;for(const s of p.secs){n+=(STORE.comments[s.id]||[]).length;}return n;}
function pageOpenDec(p){let n=0;for(const s of p.secs){if(s.opt&&!STORE.choices[s.id])n++;}return n;}
function totalFeedback(){let n=0;for(const k in STORE.comments)n+=STORE.comments[k].length;for(const k in STORE.reactions)if(STORE.reactions[k])n++;for(const k in STORE.choices)if(STORE.choices[k])n++;return n;}
function optOf(sec,k){return sec.opt.items.find(i=>i.k===k);}

/* ---------- nav ---------- */
function renderNav(){
  const nav=document.getElementById('nav');
  const tot=decisions().length, done=decDone();
  const pct=tot?Math.round(done/tot*100):0;
  let html='<div class="brand"><h1>MINERTIA / STEAM</h1><small>リリース企画すり合わせサイト</small></div>';
  html+='<div class="prog">決定 <b>'+done+'</b> / '+tot+'（'+pct+'%）<div class="bar"><i style="width:'+pct+'%"></i></div></div>';
  let grp='';
  for(const p of DB){
    if(p.group!==grp){grp=p.group;html+='<div class="grp">'+grp+'</div>';}
    const c=pageCommentCount(p), d=pageOpenDec(p);
    html+='<button class="nv'+(p.id===curPage?' on':'')+'" onclick="go(\''+p.id+'\')"><span>'+p.nav+'</span><span>'
      +(d?'<span class="cnt dec">要'+d+'</span> ':'')
      +(c?'<span class="cnt">💬'+c+'</span>':'')+'</span></button>';
  }
  html+='<div class="grp">フィードバック</div>';
  html+='<button class="nv'+(curPage==='feedback'?' on':'')+'" onclick="go(\'feedback\')"><span>決定・コメント書き出し</span>'+(totalFeedback()?'<span class="cnt">'+totalFeedback()+'</span>':'')+'</button>';
  nav.innerHTML=html;
}
function go(id){curPage=id;location.hash=id;render();window.scrollTo(0,0);}

/* ---------- top ---------- */
function renderTop(){
  const t=document.getElementById('top');
  const f=[['all','すべて'],['d','要決定のみ'],['q','未調査のみ'],['t','提案のみ'],['k','確定のみ'],['c','コメント付き']];
  const mode=READONLY
    ?'<span class="mode ro" title="公開版です。書き込みはローカル版(start_site.bat)で行ってください">👁 閲覧専用</span>'
    :SERVER
    ?'<span class="mode on" title="決定・コメントは feedback.json へ自動保存されています">💾 自動保存ON</span>'
    :'<span class="mode off" title="start_site.bat を起動すると、決定・コメントがファイルへ自動保存されます(現在はこのブラウザ内のみ)">⚠ 自動保存OFF</span>';
  t.innerHTML=f.map(x=>'<button class="flt'+(filter===x[0]?' on':'')+'" onclick="setFilter(\''+x[0]+'\')">'+x[1]+'</button>').join('')
   +mode
   +'<button class="exp" onclick="exportMD()">📋 決定・コメント書き出し</button>';
}
function setFilter(f){filter=f;render();}

/* ---------- page ---------- */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function badgeOf(s){
  return s==='k'?'<span class="badge b-k">確定(仮)</span>'
    :s==='t'?'<span class="badge b-t">提案</span>'
    :s==='d'?'<span class="badge b-d">要決定</span>'
    :s==='q'?'<span class="badge b-q">未調査</span>':'';
}
function optsHtml(sec){
  if(!sec.opt)return '';
  const cur=STORE.choices[sec.id]||'';
  let h='<div class="opts"><div class="ttl">'
    +(READONLY?(cur?'▼ 選択肢（決定済み）':'▼ 選択肢（未決定）'):'▼ 選んでください（もう一度押すと解除 / どれでもない場合はコメントへ）')
    +'</div>';
  for(const it of sec.opt.items){
    const on=cur===it.k;
    const inner='<span class="k">'+(on?'✓':it.k)+'</span>'
      +'<span><b>'+it.t+'</b>'+(it.rec?'<span class="rec">推奨</span>':'')+'<span class="d">'+it.d+'</span></span>';
    h+=READONLY
      ?'<div class="opt ro'+(on?' on':'')+'">'+inner+'</div>'
      :'<button class="opt'+(on?' on':'')+'" onclick="pick(\''+sec.id+'\',\''+it.k+'\')">'+inner+'</button>';
  }
  if(cur)h+='<div class="picked">✓ 決定: '+cur+'（'+(optOf(sec,cur)?optOf(sec,cur).t:'')+'）</div>';
  h+='</div>';
  return h;
}
function secHtml(p,s){
  const cms=STORE.comments[s.id]||[];
  const rea=STORE.reactions[s.id]||'';
  let vis=true;
  if(filter==='t')vis=(s.s==='t');
  if(filter==='k')vis=(s.s==='k');
  if(filter==='d')vis=(s.s==='d'||!!s.opt);
  if(filter==='q')vis=(s.s==='q');
  if(filter==='c')vis=cms.length>0;
  const isDec=!!s.opt&&!STORE.choices[s.id];
  let fz='';
  if(READONLY){
    // 閲覧専用: 記録済みの反応とコメントだけを表示し、入力導線は出さない
    if(rea||cms.length){
      fz='<div class="fzone">'
        +(rea?'<div class="rrow"><span class="note">反応: '+(rea==='ok'?'👍 OK':'✋ 要変更')+'</span></div>':'')
        +'<div class="clist">'+cms.map(c=>'<div class="citem"><div class="meta"><span>'+c.ts+'</span></div>'+esc(c.text).replace(/\n/g,'<br>')+'</div>').join('')+'</div>'
        +'</div>';
    }
  }else{
    fz='<div class="fzone">'
      +'<div class="rrow">'
      +'<button class="rbtn'+(rea==='ok'?' on-ok':'')+'" onclick="react(\''+s.id+'\',\'ok\')">👍 OK</button>'
      +'<button class="rbtn'+(rea==='ng'?' on-ng':'')+'" onclick="react(\''+s.id+'\',\'ng\')">✋ 要変更</button>'
      +'<button class="cbtn" onclick="toggleC(\''+s.id+'\')">💬 コメント ('+cms.length+')</button>'
      +'</div>'
      +'<div class="clist">'+cms.map((c,i)=>'<div class="citem"><div class="meta"><span>'+c.ts+'</span><button class="del" onclick="delC(\''+s.id+'\','+i+')">削除</button></div>'+esc(c.text).replace(/\n/g,'<br>')+'</div>').join('')+'</div>'
      +'<div class="cform" id="cf-'+s.id+'"><textarea id="ta-'+s.id+'" placeholder="このブロックへのコメント・変更指示を入力…"></textarea><br><button class="save" onclick="addC(\''+s.id+'\')">保存</button></div>'
      +'</div>';
  }
  return '<div class="sec'+(vis?'':' hide')+(isDec?' dec':'')+'" id="sec-'+s.id+'">'
    +'<div class="shead"><h3>'+s.h+'</h3>'+badgeOf(s.s)+'</div>'
    +'<div class="sbody">'+s.b+optsHtml(s)+'</div>'
    +fz+'</div>';
}
function renderPage(){
  const el=document.getElementById('page');
  if(curPage==='feedback'){renderFeedback(el);return;}
  const p=DB.find(x=>x.id===curPage)||DB[0];
  let html='<div class="phead"><h2>'+p.title+'</h2><p>'+p.desc+'</p>'+(p.src?'<div class="src">原典: '+p.src+'</div>':'')+'</div>';
  if(p.id==='board'){el.innerHTML=html+boardHtml();return;}
  for(const s of p.secs)html+=secHtml(p,s);
  el.innerHTML=html;
}

/* ---------- board ---------- */
function boardHtml(){
  const ds=decisions();
  const open=ds.filter(x=>!STORE.choices[x.s.id]);
  const done=ds.filter(x=>STORE.choices[x.s.id]);
  const qs=allSecs().filter(x=>x.s.s==='q');
  let h='';
  h+='<div class="bd-grp">未決定（'+open.length+'）</div>';
  if(!open.length)h+='<div class="empty">すべて決定済みです。フェーズ2へ進めます。</div>';
  for(const x of open){
    h+='<div class="bd"><div class="to">'+x.p.title+'</div><h4>'+x.s.h+'</h4>'
      +'<div class="st note">候補: '+x.s.opt.items.map(i=>i.k+'. '+i.t).join(' ／ ')+'</div>'
      +'<div><a href="#'+x.p.id+'" onclick="go(\''+x.p.id+'\')">→ このブロックを開いて決める</a></div></div>';
  }
  h+='<div class="bd-grp">外部確認が必要（未調査 '+qs.length+'）</div>';
  for(const x of qs){
    h+='<div class="bd"><div class="to">'+x.p.title+'</div><h4>'+x.s.h+'</h4>'
      +'<div><a href="#'+x.p.id+'" onclick="go(\''+x.p.id+'\')">→ 開く</a></div></div>';
  }
  h+='<div class="bd-grp">決定済み（'+done.length+'）</div>';
  if(!done.length)h+='<div class="empty">まだありません。</div>';
  for(const x of done){
    const k=STORE.choices[x.s.id];const it=optOf(x.s,k);
    h+='<div class="bd done"><div class="to">'+x.p.title+'</div><h4>'+x.s.h+'</h4>'
      +'<div class="st"><span class="okw">✓ '+k+'</span> '+(it?it.t:'')+'</div>'
      +'<div><a href="#'+x.p.id+'" onclick="go(\''+x.p.id+'\')">→ 開く</a></div></div>';
  }
  return h;
}

/* ---------- feedback page ---------- */
function renderFeedback(el){
  let items=[];
  for(const p of DB){for(const s of p.secs){
    const cms=STORE.comments[s.id]||[];const rea=STORE.reactions[s.id];const ch=STORE.choices[s.id];
    if(cms.length||rea||ch)items.push({p,s,cms,rea,ch});
  }}
  let html='<div class="phead"><h2>決定・コメント書き出し</h2><p>'
    +(READONLY?'記録済みの決定・リアクション・コメントの一覧（閲覧専用）。':'あなたの決定・リアクション・コメントの一覧。「書き出し」で Markdown をコピーし、Claude に貼り付けてください。')
    +'</p></div>';
  html+='<div style="margin-bottom:16px"><button class="exp" onclick="exportMD()">📋 Markdownをクリップボードへ</button> <button class="flt" onclick="exportJSON()">JSONダウンロード</button>'
    +(READONLY?'':' <button class="flt" style="color:var(--warn)" onclick="clearAll()">全消去</button>')+'</div>';
  if(!items.length){html+='<div class="empty">'+(READONLY?'まだ記録がありません。':'まだ何もありません。各ページで選択肢を選ぶか、OK/要変更・コメントを付けてください。')+'</div>';}
  for(const it of items){
    html+='<div class="fb-sec"><div class="to">'+it.p.title+' › '+it.s.h+' <a href="#'+it.p.id+'" onclick="go(\''+it.p.id+'\')">→開く</a></div>';
    if(it.ch){const o=optOf(it.s,it.ch);html+='<div><span class="okw">✓ 決定: '+it.ch+'</span> '+(o?o.t:'')+'</div>';}
    if(it.rea)html+='<div>反応: '+(it.rea==='ok'?'👍 OK':'✋ 要変更')+'</div>';
    for(const c of it.cms)html+='<div class="citem"><div class="meta"><span>'+c.ts+'</span></div>'+esc(c.text).replace(/\n/g,'<br>')+'</div>';
    html+='</div>';
  }
  el.innerHTML=html;
}

/* ---------- actions ---------- */
function pick(id,k){
  if(READONLY)return;
  STORE.choices[id]=(STORE.choices[id]===k?'':k);
  if(!STORE.choices[id])delete STORE.choices[id];
  save();render();
  if(SERVER&&STORE.choices[id]){
    const d=new Date();
    fetch(API+'/api/log',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sec:id,choice:k,ts:stamp(d)})}).catch(()=>{});
  }
}
function react(id,v){if(READONLY)return;STORE.reactions[id]=(STORE.reactions[id]===v?'':v);save();render();}
function toggleC(id){if(READONLY)return;document.getElementById('cf-'+id).classList.toggle('open');}
function stamp(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function addC(id){
  if(READONLY)return;
  const ta=document.getElementById('ta-'+id);const txt=ta.value.trim();if(!txt)return;
  if(!STORE.comments[id])STORE.comments[id]=[];
  const ts=stamp(new Date());
  STORE.comments[id].push({text:txt,ts});save();render();
  if(SERVER){fetch(API+'/api/log',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sec:id,text:txt,ts})}).catch(()=>{});}
}
function delC(id,i){if(READONLY)return;STORE.comments[id].splice(i,1);save();render();}
function clearAll(){if(READONLY)return;if(confirm('すべての決定・コメント・リアクションを消去します。よろしいですか?')){STORE={comments:{},reactions:{},choices:{}};save();render();}}
function buildMD(){
  const d=new Date();
  const tot=decisions().length, done=decDone();
  let md='# MINERTIA Steam企画サイト フィードバック ('+stamp(d)+')\n\n';
  md+='決定進捗: '+done+' / '+tot+'\n\n';
  let any=false;
  for(const p of DB){for(const s of p.secs){
    const cms=STORE.comments[s.id]||[];const rea=STORE.reactions[s.id];const ch=STORE.choices[s.id];
    if(!cms.length&&!rea&&!ch)continue;any=true;
    md+='## ['+s.id+'] '+p.title+' › '+s.h+'\n';
    if(ch){const o=optOf(s,ch);md+='- **決定: '+ch+'** '+(o?o.t:'')+'\n';}
    if(rea)md+='- 反応: '+(rea==='ok'?'OK(承認)':'要変更')+'\n';
    for(const c of cms)md+='- コメント('+c.ts+'): '+c.text.replace(/\n/g,' / ')+'\n';
    md+='\n';
  }}
  const open=decisions().filter(x=>!STORE.choices[x.s.id]);
  if(open.length){
    any=true;
    md+='## 未決定のまま残っているもの ('+open.length+')\n';
    for(const x of open)md+='- ['+x.s.id+'] '+x.p.title+' › '+x.s.h+'\n';
    md+='\n';
  }
  return any?md:null;
}
function exportMD(){
  const md=buildMD();
  if(!md){alert('まだ何もありません。');return;}
  navigator.clipboard.writeText(md).then(()=>alert('Markdownをコピーしました。Claudeに貼り付けてください。'),
    ()=>{prompt('コピーできない場合は手動で選択してください:',md);});
}
function exportJSON(){
  const blob=new Blob([JSON.stringify(STORE,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='minertia_steam_feedback.json';a.click();
}

/* ---------- boot ---------- */
function render(){renderNav();renderTop();renderPage();}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==curPage){curPage=h;render();}});
(async function boot(){render();await connectServer();render();})();
</script>
