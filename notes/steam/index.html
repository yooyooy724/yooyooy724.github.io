<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MINERTIA Steam リリース企画サイト</title>
<style>
  :root{
    --bg:#1a1c20; --panel:#23262b; --ink:#e2e6ea; --sub:#949cA6;
    --line:#353a41; --accent:#66c0f4; --accent2:#8fb3d4;
    --k-bg:#1f2f22; --k-ink:#8fd49a; --k-line:#3a5c40;
    --t-bg:#33301a; --t-ink:#e2c97e; --t-line:#5a5228;
    --d-bg:#3a2226; --d-ink:#f2a0a0; --d-line:#6b3a40;
    --q-bg:#2a2436; --q-ink:#c0a8e8; --q-line:#4a3d63;
    --c-bg:#1e2936; --c-ink:#9cc0e8; --c-line:#34485f;
    --warn:#e07d74; --ok:#5aa469;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;line-height:1.85;font-size:15px}
  a{color:var(--accent)}
  /* layout */
  #app{display:flex;min-height:100vh}
  nav{width:262px;flex:none;background:#1f2226;color:#d3d8de;padding:18px 0 40px;position:sticky;top:0;height:100vh;overflow-y:auto}
  nav .brand{padding:0 18px 14px;border-bottom:1px solid #3a3f46;margin-bottom:10px}
  nav .brand h1{font-size:17px;color:#eaf1f7;letter-spacing:.12em}
  nav .brand small{color:#8b939c;font-size:11px}
  nav .prog{margin:8px 18px 4px;background:#2b2f35;border-radius:8px;padding:7px 10px;font-size:11.5px;color:#a9b2bb}
  nav .prog b{color:var(--accent);font-size:13px}
  nav .bar{height:5px;background:#171a1e;border-radius:3px;margin-top:5px;overflow:hidden}
  nav .bar i{display:block;height:100%;background:linear-gradient(90deg,#3d7fa8,#66c0f4)}
  nav .grp{padding:12px 18px 4px;font-size:11px;color:#7f878f;letter-spacing:.15em}
  nav button.nv{display:flex;justify-content:space-between;align-items:center;gap:6px;width:100%;text-align:left;padding:7px 18px;background:none;border:none;color:#d3d8de;font-size:13.5px;cursor:pointer;font-family:inherit}
  nav button.nv:hover{background:#2c3036}
  nav button.nv.on{background:#38414b;color:#bfe3fb}
  nav .cnt{font-size:10.5px;background:var(--c-ink);color:#12161a;border-radius:9px;padding:0 6px;font-weight:700}
  nav .cnt.dec{background:var(--d-ink)}
  main{flex:1;min-width:0;padding:30px 44px 90px;max-width:1000px}
  /* topbar */
  #top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
  #top .flt{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:3px 13px;font-size:12.5px;cursor:pointer;color:var(--sub);font-family:inherit}
  #top .flt.on{background:var(--ink);color:#1a1c20;border-color:var(--ink)}
  #top .exp{margin-left:8px;border:none;background:var(--accent);color:#0f1418;border-radius:16px;padding:5px 15px;font-size:12.5px;cursor:pointer;font-family:inherit;font-weight:700}
  #top .exp.dim{background:#3c444d;color:#98a2ac}
  .mode{font-size:11.5px;padding:3px 12px;border-radius:14px;white-space:nowrap;margin-left:auto}
  .unsent{font-size:10px;background:var(--d-bg);color:var(--d-ink);border:1px solid var(--d-line);border-radius:8px;padding:0 6px;margin-left:6px;white-space:nowrap}
  .mode.on{background:var(--k-bg);color:var(--k-ink);border:1px solid var(--k-line)}
  .mode.off{background:var(--t-bg);color:var(--t-ink);border:1px solid var(--t-line)}
  .mode.ro{background:var(--q-bg);color:var(--q-ink);border:1px solid var(--q-line)}
  /* page header */
  .phead{margin-bottom:20px;border-bottom:2px solid var(--line);padding-bottom:12px}
  .phead h2{font-size:24px;letter-spacing:.05em}
  .phead p{color:var(--sub);font-size:13px;margin-top:4px}
  .phead .src{font-size:11.5px;color:#6f777f;margin-top:6px}
  /* section card */
  .sec{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:18px;overflow:hidden}
  .sec.hide{display:none}
  .sec.dec{border-color:#5a3339}
  .shead{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);background:#282c32}
  .shead h3{font-size:15.5px;flex:1}
  .badge{font-size:11px;padding:2px 10px;border-radius:10px;white-space:nowrap;border:1px solid}
  .b-k{background:var(--k-bg);color:var(--k-ink);border-color:var(--k-line)}
  .b-t{background:var(--t-bg);color:var(--t-ink);border-color:var(--t-line)}
  .b-d{background:var(--d-bg);color:var(--d-ink);border-color:var(--d-line)}
  .b-q{background:var(--q-bg);color:var(--q-ink);border-color:var(--q-line)}
  .sbody{padding:16px 20px}
  .sbody p{margin:0 0 10px}
  .sbody p:last-child{margin-bottom:0}
  .sbody ul,.sbody ol{margin:0 0 10px 22px}
  .sbody li{margin-bottom:3px}
  .sbody h4{font-size:13.5px;color:var(--accent);margin:14px 0 6px;letter-spacing:.05em}
  .sbody table{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0}
  .sbody th,.sbody td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
  .sbody th{background:#2e333a;font-weight:600}
  .sbody blockquote{border-left:3px solid var(--accent);background:#262a30;padding:8px 14px;margin:8px 0;border-radius:0 6px 6px 0;color:#cfd6dd}
  .sbody code{background:#171a1e;border:1px solid #2f343a;border-radius:4px;padding:0 5px;font-size:12.5px;color:#c8d6e2}
  .note{font-size:12.5px;color:var(--sub)}
  .kw{color:var(--accent);font-weight:600}
  .ng{color:var(--warn);font-weight:600}
  .okw{color:var(--ok);font-weight:600}
  /* option picker */
  .opts{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
  .opts .ttl{font-size:12px;color:var(--d-ink);letter-spacing:.08em;margin-bottom:8px}
  .opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:#282c32;border-radius:8px;padding:8px 12px;margin-bottom:6px;cursor:pointer;font-family:inherit;color:var(--ink);text-align:left;width:100%;font-size:13px;line-height:1.7}
  .opt:hover{border-color:var(--accent)}
  .opt.ro{cursor:default}
  .opt.ro:hover{border-color:var(--line)}
  .opt.ro.on:hover{border-color:#4d7f58}
  .opt.on{background:#20372a;border-color:#4d7f58}
  .opt .k{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--sub);background:#1d2126;margin-top:2px}
  .opt.on .k{background:var(--ok);color:#0f1418;border-color:var(--ok)}
  .opt b{color:#eef3f8}
  .opt .rec{font-size:10.5px;background:#2b3f52;color:#8fc7ec;border-radius:8px;padding:0 7px;margin-left:6px;white-space:nowrap}
  .opt .d{color:var(--sub);font-size:12.5px;display:block}
  .picked{font-size:11.5px;color:var(--ok);margin-top:4px}
  /* feedback zone */
  .fzone{border-top:1px dashed var(--line);background:#1e232a;padding:10px 18px}
  .fzone .rrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .rbtn{border:1px solid var(--c-line);background:#232830;border-radius:14px;padding:2px 12px;font-size:12px;cursor:pointer;color:var(--c-ink);font-family:inherit}
  .rbtn.on-ok{background:#2f6b33;color:#fff;border-color:#2f6b33}
  .rbtn.on-ng{background:#a94442;color:#fff;border-color:#a94442}
  .cbtn{border:none;background:none;color:var(--c-ink);font-size:12px;cursor:pointer;margin-left:auto;font-family:inherit}
  .clist{margin-top:8px}
  .citem{background:var(--c-bg);border:1px solid var(--c-line);border-radius:8px;padding:8px 12px;margin-bottom:6px;font-size:13px}
  .citem .meta{font-size:10.5px;color:var(--c-ink);display:flex;justify-content:space-between;margin-bottom:2px}
  .citem .del{cursor:pointer;color:var(--warn);background:none;border:none;font-size:10.5px;font-family:inherit}
  .cform{display:none;margin-top:8px}
  .cform.open{display:block}
  .cform textarea{width:100%;min-height:64px;border:1px solid var(--c-line);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:13px;resize:vertical;background:#1c2027;color:var(--ink)}
  .cform .save{margin-top:6px;border:none;background:var(--c-ink);color:#12161a;border-radius:14px;padding:4px 16px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:700}
  /* legend */
  .legend{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
  .legend .lg{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sub)}
  .dot{width:12px;height:12px;border-radius:3px;display:inline-block}
  /* phase strip */
  .phase{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
  .ph{flex:1;min-width:190px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:#242830}
  .ph.now{border-color:var(--accent);background:#22313c}
  .ph .n{font-size:11px;color:var(--sub);letter-spacing:.1em}
  .ph .t{font-size:14px;font-weight:700;margin:2px 0 4px}
  .ph .d{font-size:12px;color:var(--sub)}
  .ph.now .n{color:var(--accent)}
  /* board */
  .bd-grp{font-size:12px;color:var(--sub);letter-spacing:.1em;margin:18px 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px}
  .bd{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--d-line);border-radius:8px;padding:10px 16px;margin-bottom:10px}
  .bd.done{border-left-color:var(--ok)}
  .bd .to{font-size:11px;color:var(--sub)}
  .bd h4{font-size:14px;margin:2px 0 4px}
  .bd .st{font-size:12px}
  .fb-sec{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-bottom:12px}
  .fb-sec .to{font-size:11px;color:var(--sub)}
  .empty{color:var(--sub);text-align:center;padding:40px 0}
</style>
</head>
<body>
<div id="app">
  <nav id="nav"></nav>
  <main>
    <div id="top"></div>
    <div id="page"></div>
  </main>
</div>

<script>
/* =========================================================
   MINERTIA Steam リリース企画サイト
   フェーズ1(すり合わせ)専用フロント。
   - 情報4タイプ: 確定(仮)=k / 提案=t / 要決定=d / 未調査=q
   - 「要決定」には選択肢が付き、選ぶと決定として記録される
   - 決定・コメント・リアクションは feedback.json(サーバー起動時)/localStorage に保存
   - 「書き出し」でMarkdown化 → Claudeに貼り付けて仕様書へ反映
   原典: GamesDomain/docs/steam-release/
   ========================================================= */

const DB = [
/* ============================ 案内 ============================ */
{id:'home', nav:'ホーム / 使い方', group:'案内', title:'Steam リリース企画', desc:'モバイル版 Idle Minertia を Steam(Windows / macOS)へ移植する計画。いまはフェーズ1。', src:'docs/steam-release/README.md', secs:[
 {id:'ho-phase', h:'いまどこにいるか ── 3フェーズ', s:'k', b:`
  <div class="phase">
    <div class="ph now"><div class="n">PHASE 1 — いまここ</div><div class="t">仕様のすり合わせ</div><div class="d">ブレストして決める。<b>このサイトが作業場</b>。決定と保留を可視化するのが目的。</div></div>
    <div class="ph"><div class="n">PHASE 2</div><div class="t">AI向けプロンプト化</div><div class="d">確定した仕様を、実装AIが読む形式へ整形する。曖昧語を消し、参照パスと受け入れ条件を付ける。</div></div>
    <div class="ph"><div class="n">PHASE 3</div><div class="t">実装</div><div class="d">ドメイン(GamesDomain)と Unity(IdleMinertia)の両側で作業。</div></div>
  </div>
  <p class="note">フェーズ1の完了条件は「<b>要決定が全部埋まる</b>」こと。未調査(紫)は外部確認が必要なので、フェーズ1を止めない代わりに<b>フェーズ2に持ち越せない</b>。</p>`},
 {id:'ho-howto', h:'このサイトの使い方', s:null, b:`
  <p>各ブロックは4タイプに分かれます。<b>赤(要決定)を潰していくのがフェーズ1の作業</b>です。</p>
  <div class="legend">
    <span class="lg"><span class="dot" style="background:var(--k-bg);border:1px solid var(--k-line)"></span>確定(仮) … 合意済み。この前提で書いてよい</span>
    <span class="lg"><span class="dot" style="background:var(--t-bg);border:1px solid var(--t-line)"></span>提案 … Claude の案。あなたの判断待ち</span>
    <span class="lg"><span class="dot" style="background:var(--d-bg);border:1px solid var(--d-line)"></span>要決定 … 選択肢から選ぶと決定が記録される</span>
    <span class="lg"><span class="dot" style="background:var(--q-bg);border:1px solid var(--q-line)"></span>未調査 … Steamworks 等の外部確認が要る</span>
  </div>
  <ul>
    <li><b>要決定ブロックの選択肢をクリック</b>すると決定として記録され、左のバーが進みます。もう一度押すと解除。</li>
    <li>どのブロックにも <b>OK / 要変更</b> と <b>コメント</b> を付けられます。「選択肢のどれでもない」ときはコメントに書いてください。</li>
    <li>右上の<b>「決定・コメント書き出し」</b>で Markdown をコピー → Claude に貼ると、仕様書とこのサイトへ反映されます。</li>
    <li><b>永続化(推奨)</b>: <code>start_site.bat</code> をダブルクリックで起動すると、<code>SteamSite/feedback.json</code> へ<b>自動保存</b>されます(履歴は <code>feedback_history.jsonl</code> に追記)。右上が「💾 自動保存ON」なら有効。ポートは <code>8138</code>(StorySite の 8137 と別なので同時起動できます)。</li>
    <li>直接 index.html を開いた場合はブラウザ内保存(localStorage)。サーバー起動中なら検出して自動同期します。</li>
  </ul>`},
 {id:'ho-fixed', h:'すでに固まっている前提', s:'k', b:`
  <h4>2026-07-28 に確定したもの</h4>
  <table><tr><th>論点</th><th>決定</th><th>効いてくる先</th></tr>
  <tr><td>AppID <code>3217600</code></td><td><b>旧作用。新規取得が必要</b></td><td>Steam Direct $100 と審査待ちが発生。<b>スケジュールの起点</b></td></tr>
  <tr><td>対応 OS</td><td><b>Windows + macOS 同時</b></td><td>Apple 公証・Universal Binary・別 Depot・別テスト機が必須作業に</td></tr>
  <tr><td>1.0 のスコープ</td><td><b>全部入り</b></td><td>横長は<b>段階4(リサイズ追従)まで</b>が既定線。ショートカット・リーダーボード・リッチプレゼンスも対象 → <a href="#display" onclick="go('display')">05</a></td></tr>
  <tr><td>時期</td><td><b>期限なし。品質優先</b></td><td>スケジュールを理由にスコープを削らない</td></tr>
  <tr><td>モバイル版</td><td><b>継続。並行運用</b></td><td>モバイルを壊さない制約を維持。暗号化を変える場合は移行処理が必須</td></tr>
  <tr><td>コスト</td><td><b>自作のみ</b></td><td>実績アイコン等は自作前提。金額そのものは制約にしない</td></tr>
  <tr><td>広告</td><td><b>導線ごとに個別判断</b></td><td>デフォルトを下げ、課金で解禁・増加。→ <a href="#money" onclick="go('money')">マネタイズ</a></td></tr>
  <tr><td>検証ビルド</td><td><b>フェーズ3の頭で実施</b></td><td>DLL が Standalone で動くかは<b>それまで未確認のまま</b> → <a href="#risk" onclick="go('risk')">リスク</a></td></tr></table>
  <h4>2026-07-28（夕）に追加で確定したもの</h4>
  <table><tr><th>論点</th><th>決定</th><th>効いてくる先</th></tr>
  <tr><td>抽象化の深さ</td><td><b>全面抽象化(6インターフェース)</b></td><td>既存ファイルは1行も変更しない制約付き。<code>#if</code> 3箇所原則が前提に復帰 → <a href="#platform" onclick="go('platform')">02</a></td></tr>
  <tr><td>改ざん対策</td><td><b>「一切できないように」＝ 平文維持は破棄</b></td><td>AES + ACTk を有効化。<span class="ng">60件ぶんの移行処理が最重量作業に</span> → <a href="#save" onclick="go('save')">04</a></td></tr>
  <tr><td>サーバー</td><td><b>使う。NetherCompanion があるため</b></td><td>既存バックエンドは<b>元から REST</b>だったと判明。セーブは Steam Cloud、共有機能は Firestore → <a href="#save" onclick="go('save')">04</a></td></tr>
  <tr><td>リーダーボード</td><td><b>フレンド内のみ</b></td><td>改ざん対策の強化と噛み合い、成立条件が整った → <a href="#feature" onclick="go('feature')">06</a></td></tr>
  <tr><td>リッチプレゼンス</td><td><b>最新の Cave 名 + 到達深度</b></td><td>Steamworks 側に翻訳登録が要る。運用手順を残すこと → <a href="#feature" onclick="go('feature')">06</a></td></tr>
  <tr><td>ビルド除外</td><td><b>「除外」から「無効化」へ緩和</b></td><td>ローカライズテーブル等は含めてよい。広告 SDK のネイティブ部分だけは例外 → <a href="#money" onclick="go('money')">03</a></td></tr></table>
  <h4>2026-07-30 に確定したもの</h4>
  <table><tr><th>論点</th><th>決定</th><th>効いてくる先</th></tr>
  <tr><td>マネタイズ本線</td><td><b>案2 デイリー付与型(DLC)</b></td><td><span class="okw">クロスプログレッションは不要のまま</span>。通貨販売の承認依存も下がる → <a href="#money" onclick="go('money')">03</a></td></tr>
  <tr><td>プランB</td><td><b>B1 買い切り化</b></td><td><span class="ng">発動すると DLC 設計とバランス調整が捨て仕事に</span>。値セット差し替えで手戻りを抑える → <a href="#money" onclick="go('money')">03</a></td></tr>
  <tr><td>RemoveAds</td><td><b>性質ごとに4分割</b></td><td>倍率 / ブースター / デイリー / 時間短縮 → <a href="#money" onclick="go('money')">03</a></td></tr>
  <tr><td>導線ごとの数値</td><td><b>個別対応(共通の器を作らない)</b></td><td>着手最速。一覧性と一括差し替えは失われる → <a href="#money" onclick="go('money')">03</a></td></tr>
  <tr><td>改ざん対策</td><td><b>AES 有効化のみ(ACTk は見送り)</b></td><td>移行処理が本体。<span class="ng">メモリ改変と時計改ざんは未対策のまま</span> → <a href="#save" onclick="go('save')">04</a></td></tr>
  <tr><td>横長の UXML 管理</td><td><b>器は V/H で分け、部品は共有</b></td><td>「複製しない」を撤回。<b>name 集合の自動チェック</b>で担保 → <a href="#display" onclick="go('display')">05</a></td></tr>
  <tr><td>横長の到達段階</td><td><b>段階4(リサイズ追従)まで</b></td><td>→ <a href="#display" onclick="go('display')">05</a></td></tr>
  <tr><td>実績</td><td><b>30以上。判定はドメイン</b></td><td>アイコン最低60枚。テンプレの量産設計が前提 → <a href="#feature" onclick="go('feature')">06</a></td></tr>
  <tr><td>リーダーボード</td><td><b>フレンド内のみ。初回リリースからは外す</b></td><td><span class="ng">Q3「全部入り」への初の例外</span> → <a href="#feature" onclick="go('feature')">06</a></td></tr>
  <tr><td>QWERT ショートカット</td><td><b>採用</b></td><td>→ <a href="#display" onclick="go('display')">05</a></td></tr></table>
  <p class="note"><b>未決のまま残っているもの:</b> 価格設定(調査待ち)、一括マージ API の置き場所、レールに何を載せるか、Shop / Relic / Nether の横長仕様。<br>
  <span class="ng">確認したいこと:</span> ①「0.1 には含めない」の 0.1 が指すもの(→ <a href="#feature" onclick="go('feature')">06</a>) ②「継続的にダイヤが付与される権利」を Valve が通貨販売とみなすか(→ <a href="#money" onclick="go('money')">03</a>)</p>
  <h4>当初からの前提</h4>
  <ul>
   <li><b>モバイルと同一コードベースで並行運用</b>。Steam 版のためにモバイル版を壊さない。</li>
   <li><b>F2P + Steam 内課金</b>を第一候補として設計する(ただし §マネタイズ の承認次第でプランBへ)。</li>
   <li>横長対応で <b>UXML を複製しない</b>。<span class="kw">定義は 2026-07-28 に差し替え</span>: 「横長 = <b>縦の圧縮(タブ・上下積み)を1段だけ解いたもの</b>」。<s>縦長の画面を並べたもの</s> → <a href="#display" onclick="go('display')">05</a></li>
   <li>モバイル版からのセーブ引き継ぎは<b>スコープ外</b>。<span class="ng">⚠️ ただし <a href="#money" onclick="go('money')">マネタイズ案3(Mobile 限定販売)</a>を採る場合、この前提は撤回が必要になります(購入したダイヤを Steam へ持ち越す必要があるため)。</span></li>
  </ul>
  <p class="note">「ゲームロジックに <code>#if</code> を書き足さない」は一度<b>選択肢に降格しましたが、2026-07-28 に全面抽象化(C)が選ばれたことで前提へ復帰しました</b>。→ <a href="#platform" onclick="go('platform')">抽象化の深さ</a></p>`},

/* ============================ 02 抽象化 ============================ */
{id:'platform', nav:'02 プラットフォーム抽象化', group:'仕様', title:'プラットフォーム抽象化', desc:'最初に着手すべき設計。ここが固まらないまま個別対応を始めると、全作業が #if の泥沼になる。', src:'docs/steam-release/02_Platform_Abstraction.md', secs:[
 {id:'pf-rule', h:'抽象化の深さ ── 全面抽象化(6インターフェース)で確定', s:'k', b:`
  <p class="note">2026-07-28 <b>C(資料どおりの全面抽象化)で確定。</b>懸念だった「既存 API 系スクリプトの改変リスク」は、下記のとおり<b>この案では発生しない</b>ことが確認されたため、最も整理される案が選ばれました。<br>
  経緯コメント:「Ad, IAP などは分けて管理したので、現状通り <code>#if</code> が分散するのは仕方ないと考えています。また、既存の API 系スクリプトをいじるのはリスクがないか心配です。」</p>
  <h4>確定した内容 ── 6インターフェースを一度に整える</h4>
  <table><tr><th>インターフェース</th><th>モバイル実装</th><th>Steam 実装</th></tr>
  <tr><td><code>IRewardService</code></td><td><code>AdRoot.ShowRewardedAd()</code> へ委譲</td><td>導線ごとの Config を引いて付与(→ <a href="#money" onclick="go('money')">03</a>)</td></tr>
  <tr><td><code>IStoreService</code></td><td>Unity IAP</td><td>Steam DLC / Inventory の所有権</td></tr>
  <tr><td><code>ICloudSaveBackend</code></td><td>Firestore REST</td><td>Steam Cloud(→ <a href="#save" onclick="go('save')">04</a>)</td></tr>
  <tr><td><code>IAuthService</code></td><td>Google / Apple</td><td>Steam ID</td></tr>
  <tr><td><code>IAchievementService</code></td><td>No-Op</td><td>Steamworks 実績</td></tr>
  <tr><td><code>IReviewPrompt</code></td><td><code>ReviewCall</code></td><td>No-Op(Steam にレビュー誘導 API は無い)</td></tr></table>
  <blockquote><b>あわせて制約を明文化します:</b> 既存の <code>AdRoot.cs</code> / <code>Shop/IAP/</code> / <code>Firebase/</code> は<b>1行も変更しない</b>。インターフェースは<b>新規ファイルとして被せ</b>、モバイル実装は既存へ委譲するだけにする。<br>
  <span class="ng">この制約を破りそうになったら、そこは設計を見直す合図です。</span>「全面抽象化」は<b>被せる範囲が広い</b>という意味であって、<b>既存を書き換える</b>という意味ではありません。</blockquote>
  <h4>懸念は前提の行き違いでした</h4>
  <p>資料の案は <span class="kw">既存スクリプトを書き換える案ではありません</span>。<code>AdRoot.cs</code> や <code>Shop/IAP/</code> は<b>触らず</b>、その上に薄いラッパーを新規に1枚置き、モバイル実装は既存へ丸投げするだけ、という形です(<code>MobileRewardService</code> が <code>AdRoot.ShowRewardedAd()</code> を呼ぶだけ)。<br>
  つまり<b>「既存 API 系スクリプトを改変するリスク」は、この案では発生しません。</b>変更されるのは呼び出し側だけです。</p>
  <h4>そのうえで、分散の実測</h4>
  <p><code>#if</code> を書かずに済ませたい理由は「散らかるから」という美観の話ではなく、<b>モバイルビルドが壊れる箇所が増えるから</b>です。実際に効いてくるのは以下:</p>
  <table><tr><th>箇所</th><th>抽象化しない場合</th></tr>
  <tr><td>広告 11 導線</td><td><code>SyncOnClickAsRewardButton()</code> 系 <b>3メソッド</b>に閉じるので、<code>#if</code> は3箇所で済む</td></tr>
  <tr><td><code>ShopView</code> の復元ボタン</td><td>既に <code>#if UNITY_IOS</code> がある。Steam 分岐が足されて3分岐になる</td></tr>
  <tr><td><code>SettingsLoginHandler</code></td><td>Google/Apple ボタンの出し分けに <code>#if</code> が要る</td></tr>
  <tr><td><b><code>AppleLogin.cs</code></b></td><td><b>Windows でクラスごと消える。</b>参照している側すべてに <code>#if</code> が伝染する ← ここだけは分散が止まらない</td></tr></table>
  <p><span class="okw">広告に関しては、あなたの見立て(3箇所で済む)が正しいです。</span>問題は <code>AppleLogin</code> 側で、こちらは<b>型が消える</b>ため呼び出し側が <code>#if</code> なしでは書けません。ただし 04 で <b>Steam Cloud 一本化</b>を選ぶとログイン UI 自体が不要になり、<span class="kw">この問題は丸ごと消滅します</span>。</p>
  <h4>広告の再設計が、判断を変えます</h4>
  <p>あなたの広告方針(→ <a href="#money" onclick="go('money')">導線ごとに個別判断</a>)を採ると、Steam 版の違いは「広告を出す / 出さない」の二値ではなく、<b>導線ごとに報酬量・頻度・解禁条件が違う</b>という形になります。<span class="ng">これは <code>#if</code> で書ける形ではありません</span>(3メソッドに閉じなくなる)。分岐ではなく<b>設定値・パラメータの差し替え</b>として持つのが自然で、受け皿となるインターフェースはどのみち必要でした。<span class="okw">C を選んだことで、この受け皿が最初から用意されます。</span></p>
  <h4>C を選んだことで確定する副次的な事実</h4>
  <ul>
   <li><code>IAuthService</code> を通すため、<b><code>AppleLogin.cs</code> の型消滅問題は呼び出し側に伝染しません</b>。参照するのはインターフェースだけになり、<code>#if</code> は Apple 実装クラスの内部に閉じます。04 で Steam Cloud を選ぶかどうかに関係なく解決します。</li>
   <li><code>#if</code> を書いてよい場所は当初の原則どおり <b>Installer / プラットフォーム固有実装クラスの内部 / Editor スクリプト</b> の3箇所に戻ります。View / ViewModel / Domain には書きません。</li>
   <li>着手時の変更範囲が最大になる点は変わりません。<b>フェーズ1で最初に着手すべき作業</b>として扱います。</li>
  </ul>`},
 {id:'pf-what', h:'抽象化するもの / しないもの', s:'k', b:`
  <table><tr><th>対象</th><th>抽象化</th><th>理由</th></tr>
  <tr><td>広告</td><td><code>IRewardService</code></td><td><s>Steam 版は「即時付与」に差し替え</s> → <b>導線ごとに報酬量・頻度・解禁条件を変える</b>(2026-07-28 変更。<a href="#money" onclick="go('money')">マネタイズ</a>参照)</td></tr>
  <tr><td>課金</td><td><code>IStoreService</code></td><td>Unity IAP ↔ Steam で API が全く違う</td></tr>
  <tr><td>クラウドセーブ</td><td><code>ICloudSaveBackend</code></td><td>Firebase ↔ Steam Cloud</td></tr>
  <tr><td>ログイン</td><td><code>IAuthService</code></td><td>Google/Apple ↔ Steam ID</td></tr>
  <tr><td>実績</td><td><code>IAchievementService</code></td><td>モバイルは No-Op 実装を置く</td></tr>
  <tr><td>レビュー誘導</td><td><code>IReviewPrompt</code></td><td>Steam では不要(No-Op)</td></tr>
  <tr><td>ローカルセーブ</td><td><b>しない</b></td><td><code>persistentDataPath</code> は全プラットフォームで動く</td></tr>
  <tr><td>入力</td><td><b>しない</b></td><td><code>InputHandler.cs</code> に既にランタイム分岐がある</td></tr>
  <tr><td>ローカライズ</td><td><b>しない</b></td><td>Unity Localization は共通</td></tr>
  <tr><td>画面レイアウト</td><td><b>しない</b></td><td><code>#if</code> ではなくアスペクト比で判定</td></tr></table>`},
 {id:'pf-if', h:'インターフェースの置き場と形', s:'t', b:`
  <p>配置先: <code>Assets/1.Games/IdleGem/Platform/</code> に <code>I*.cs</code> / <code>Mobile/</code> / <code>Steam/</code> / <code>Null/</code>。</p>
  <h4>IRewardService</h4>
  <p>既存の <code>AdRoot.ShowRewardedAd(AdId, Action)</code> と同じシグネチャに合わせるのが最小変更。<code>RequiresAdView</code> が false ならボタン文言を「受け取る」にします。<br>
  <span class="okw"><code>SyncOnClickAsRewardButton()</code> 系3メソッドを差し替えれば、呼び出し側 8ファイル11箇所は無改修。</span></p>
  <h4>IStoreService</h4>
  <p><code>Products</code> / <code>PurchaseAsync</code> / <code>IsOwned</code> / <code>SupportsRestore</code> / <code>RestoreAsync</code>。<code>SupportsRestore</code> が <code>ShopView</code> の <code>#if UNITY_IOS</code> を置き換えます。</p>
  <h4>IAuthService / IAchievementService</h4>
  <p><code>AvailableProviders</code> により <code>SettingsLoginHandler</code> の Google/Apple ボタン出し分けを <code>#if</code> なしで書けます。<code>IAchievementService</code> のモバイル実装を No-Op にすることで、<b>実績の解除呼び出しをゲームロジックに分岐なしで置けます。</b></p>`},
 {id:'pf-define', h:'🔴 Scripting Define ── 時限爆弾', s:'k', b:`
  <p><b><code>STEAMWORKS_NET</code> が Android / iPhone / WebGL にも付いています。</b>現状は Steamworks を呼ぶコードが無いので害が出ていませんが、<span class="ng">Steam 実装を書き始めた瞬間にモバイルビルドが壊れます。</span></p>
  <table><tr><th>Define</th><th>Android</th><th>iOS</th><th>Standalone</th></tr>
  <tr><td><code>USE_ADMOB</code></td><td>✅</td><td>✅</td><td>❌</td></tr>
  <tr><td><code>STEAMWORKS_NET</code></td><td><b>❌ 削除</b></td><td><b>❌ 削除</b></td><td>✅</td></tr>
  <tr><td><code>USE_UNITY_IAP</code></td><td>✅ 追加</td><td>✅ 追加</td><td>❌</td></tr></table>
  <p class="note">⚠️ Unity Editor が開いていると <code>ProjectSettings.asset</code> の変更が巻き戻ります。</p>
  <h4>先に Steamworks.NET の二重導入を解消する</h4>

/* ============================ 03 マネタイズ ============================ */
{id:'money', nav:'03 マネタイズ', group:'仕様', title:'マネタイズ(F2P + Steam 内課金)', desc:'最大の外部リスクがここ。ゲーム内通貨販売が Steam で通るかで、下流の設計が連鎖的に変わります。', src:'docs/steam-release/03_Monetization_Steam.md', secs:[
 {id:'mn-risk', h:'ダイヤ販売のモデル選択 ── 3案の比較', s:'d', b:`
  <p class="note">2026-07-28 コメント:「マーケティング的に二つの手法を比較したい。一つは単純に Diamond を売る今と同じマネタイズ。もう一つは『Tap Ninja - Idle game』のように毎日 Diamond を XX 獲得できるというような課金商品。もう一つ可能性としてあるのが、Diamond は Mobile のみで販売し、これによって Steam 側では P2W としての批判を回避し、Mobile での Diamond の販売は Steam にも持ち越せるため、Mobile でのインプレッションを上げていくという方法。(中略)ただし、この案の問題点は Steam だけで遊んだ場合、Diamond の獲得数が足りなくなりバランスが乱れる点である。解決案を提案してほしい。」</p>
  <p>前提として <span class="ng">🔴 Steam でのゲーム内通貨販売には Valve への申請と承認が別途必要</span>(モバイルストアのように自動では通らない)という<b>未調査のリスク</b>が残っています。以下の3案は、そのリスクの受け方が根本的に違います。</p>
  <h4>3案の比較</h4>
  <table><tr><th></th><th>案1 直接販売(現状同型)</th><th>案2 デイリー付与型</th><th>案3 Mobile 限定販売</th></tr>
  <tr><td><b>形</b></td><td>5ティア × 通常/初回/割引をそのまま移植</td><td>「毎日ダイヤ XX を受け取れる権利」を売る</td><td>Steam ではダイヤを売らない。Mobile での購入分が Steam に反映される</td></tr>
  <tr><td><b>Valve 承認</b></td><td><span class="ng">必須。落ちたら主軸が消える</span></td><td><span class="okw">不要にできる</span> ── 「毎日付与される権利」は<b>非消費型 = DLC</b> として売れる</td><td><span class="okw">不要</span>。Steam では何も売らない</td></tr>
  <tr><td><b>P2W 批判</b></td><td>受けやすい。Steam レビューは通貨販売に厳しい</td><td>受けるが緩和される(上限が明示されるため青天井に見えない)</td><td><span class="okw">構造的に発生しない</span></td></tr>
  <tr><td><b>実況との相性</b></td><td>悪い(購入導線が画面に出る)</td><td>中(1商品だけなので目立たない)</td><td><span class="okw">最良</span>。売り物が画面に無い</td></tr>
  <tr><td><b>収益の型</b></td><td>スパイク型。大型課金者に依存</td><td><b>継続型</b>。DAU に比例し予測しやすい</td><td>Steam 単体では<b>ゼロ</b>。Mobile の送客効果に賭ける</td></tr>
  <tr><td><b>モバイル送客</b></td><td>無し</td><td>無し</td><td><span class="okw">これが狙い</span></td></tr>
  <tr><td><b>最大の弱点</b></td><td>承認リスクをそのまま被る</td><td>「毎日ログインしないと損」を作る。<b>放置ゲームの思想と衝突しうる</b></td><td><b>下記のダイヤ不足</b>＋クロスプログレッション必須化</td></tr></table>
  <p><span class="ng">案2 の注意点を1つ。</span>「毎日 XX 獲得」は<b>毎日起動させる装置</b>です。Idle Minertia は OfflineBonus を持つ「放置してよい」ゲームなので、<b>デイリー受け取りを付けると設計思想が逆を向きます</b>。採るなら「n日分まとめて受け取れる」「受け取り忘れが失効しない」形にして、ログイン強制にしないこと。</p>
  <h4>🔴 案3 は、実は「スコープ外」の前提を壊します</h4>
  <blockquote>案3 が成立する条件は「<b>Mobile での購入が Steam に持ち越せる</b>」ことです。これは<span class="ng">クロスプログレッション（アカウント連携）そのもの</span>であり、本企画では現在<b>「モバイル版からのセーブ引き継ぎはスコープ外」と前提に置いています</b>(→ <a href="#hypothesis" onclick="go('hypothesis')">前提</a>)。<br>
  <b>案3 を選ぶなら、この前提を撤回し、04 のクラウドセーブ方針も「Steam Cloud のみ」では足りなくなります</b>(→ <a href="#save" onclick="go('save')">04</a>)。</blockquote>
  <p class="note">ただしこれは致命傷ではありません。<b>持ち越す必要があるのは「セーブ全体」ではなく「購入したダイヤの総額」だけ</b>です。進行データを双方向で同期する必要はなく、<b>所有権だけを共有する軽い連携</b>で足ります。サーバーを使う方針(→ <a href="#save" onclick="go('save')">サーバー活用</a>)とも噛み合います。</p>
  <h4>ダイヤ不足への解決案</h4>
  <p>「Steam だけで遊ぶとダイヤが足りない」は<b>正しい懸念ですが、前提が1つ間違っています</b>。ダイヤの入手は購入だけではありません。実際の蛇口を調べたところ:</p>
  <table><tr><th>現在のダイヤ入手経路</th><th>実装</th><th>Steam での扱い</th></tr>
  <tr><td><b>鉱石コレクション達成</b></td><td><code>GemCollectionMissionReward</code> ── 50 + 5×⌊(index-1)/4⌋ ダイヤ。<b>広告に一切依存しない</b>。深く潜るほど増える</td><td><span class="okw">そのまま使える。むしろ主軸にできる</span></td></tr>
  <tr><td>FlyingPresent</td><td><code>FlyingCurrencyRewardFactory</code> ── ランダム <b>20〜50 ダイヤ</b></td><td>頻度・量が調整可能なパラメータ</td></tr>
  <tr><td><code>AdId.DailyDiamond</code></td><td>広告視聴でダイヤ</td><td><span class="ng">広告が無いので蛇口ごと消える。ここが穴</span></td></tr></table>
  <p><span class="okw">つまり、ダイヤの主要な蛇口である「鉱石コレクション」は既にプレイ由来で、広告とも課金とも無関係に機能しています。</span>穴が空くのは <code>DailyDiamond</code> の1本だけです。</p>
  <p><b>解決案 ── Steam ではダイヤを「買う通貨」から「プレイで稼ぐ通貨」へ再定義する。</b></p>
  <ol>
   <li><b>消えた <code>DailyDiamond</code> の枠を、プレイ由来の実績報酬に置き換える。</b>Steam 実績(→ <a href="#feature" onclick="go('feature')">06</a>)は Q3「全部入り」で 30〜60 個作ることが確定しています。<span class="kw">この実績にダイヤを紐づければ、新規のバランス設計をほとんど足さずに蛇口を1本作れます。</span>実績は一度きりなので配りすぎにもなりません。</li>
   <li><b>鉱石コレクション報酬の係数を Steam 側で引き上げる。</b><code>GetDiamondReward</code> は index の関数なので、<b>係数を差し替えるだけ</b>で総供給量を調整できます。Config を差し替える器は <a href="#platform" onclick="go('platform')"><code>IRewardService</code></a> 側に既に用意する方針です。</li>
   <li><b>ダイヤの出口(シンク)側も併せて緩める。</b>現在の主なシンクは装備変換のリフィル(<code>EquipmentConvertLimit.DiamondCost</code> ── 使うほど単価が上がる)。<span class="kw">蛇口を増やすより、Steam 版でシンクの単価上昇を緩める方が、体感バランスを崩さずに調整できます。</span></li>
  </ol>
  <p class="note"><b>逆方向のリスクを1つ明記しておきます。</b>案3 は「Steam ではプレイで手に入るものを、Mobile では現金で売っている」構図になります。クロスプログレッションを公言する以上、<span class="ng">Mobile の課金者から「Steam なら無料で手に入る」と読まれる</span>可能性があります。<b>Mobile 側の購入は「時間の短縮」として位置づけ、Steam 側の入手速度を意図的に遅く保つ</b>ことでしか回避できません。ここは数値設計の問題として残ります。</p>
  <h4>2026-07-30 決定: 案2(デイリー付与型)</h4>
  <p>連鎖して確定したこと:</p>
  <ul>
   <li><span class="okw">クロスプログレッションは不要のままです。</span>案3 を採らなかったため、「モバイル版からのセーブ引き継ぎはスコープ外」という前提を撤回する必要はなくなりました(→ <a href="#save" onclick="go('save')">04</a>)。</li>
   <li><span class="okw">Valve の通貨販売承認への依存が下がります。</span>「毎日ダイヤを受け取れる権利」は非消費型なので DLC として売れます。</li>
   <li><b>ただし完全にリスクゼロではありません。</b><span class="ng">🔴 「継続的にゲーム内通貨が付与される権利」を Valve が実質的な通貨販売とみなすかは未確認です。</span>DLC として申請する前に、Steamworks のドキュメントで<b>この形態の前例</b>を確認してください(→ <a href="#money" onclick="go('money')">価格設定の調査</a>で <b>Tap Ninja</b> の商品構成を見るのが最短です)。</li>
   <li><b>設計上の宿題:</b> 前述のとおり「毎日 XX 獲得」は<b>毎日起動させる装置</b>です。放置ゲームの思想と衝突しないよう、<span class="kw">受け取り忘れが失効しない / n日分まとめて受け取れる</span>形にしてください。これは実装前に決めるべき仕様です。</li>
  </ul>
  <h4>⚠️ プランB(B1 買い切り化)との整合について</h4>
  <p>同日に <a href="#money" onclick="go('money')">プランB</a> で <b>B1(買い切り化・課金要素を全廃)</b> が選ばれています。<b>この2つは切り替え先として噛み合いますが、片方が発動すると、もう片方向けの作業が丸ごと不要になります。</b></p>
  <table><tr><th></th><th>本線(案2)</th><th>プランB(B1)</th></tr>
  <tr><td>本体</td><td>F2P</td><td><b>有料</b></td></tr>
  <tr><td>課金要素</td><td>デイリー付与型 DLC + 分割した DLC 群</td><td><span class="ng">全廃</span></td></tr>
  <tr><td><a href="#money" onclick="go('money')">RemoveAds の4分割</a>(A で確定)</td><td>必要</td><td><span class="ng">不要。「全アンロック済み」相当にするだけ</span></td></tr>
  <tr><td>バランス</td><td>デフォルトを下げ、課金で戻す</td><td>最初から緩い状態が正</td></tr></table>
  <p class="note"><span class="ng">つまり B1 に倒れた場合、DLC の商品設計と「デフォルト値を下げる」バランス調整は捨て仕事になります。</span>これは B1 が悪いという話ではなく、<b>「どの時点で本線を確定させるか」が重要になる</b>という話です。<br>
  <span class="okw">対策はシンプルです:</span> <a href="#money" onclick="go('money')">導線ごとの数値</a>を「デフォルト値のセット」として持てば、B1 に倒れたときは<b>全部を「解禁済み」の値セットに差し替えるだけ</b>で済みます。<b>手戻りを最小化するのはこの一点です。</b></p>`,
  opt:{items:[
   {k:'3',t:'案3 ── Steam では売らない(Mobile 限定販売)',d:'Steam レビューでの P2W 批判と実況文化との衝突を構造的に回避でき、広告方針(導線ごとに個別判断)とも一貫する。Valve の通貨販売承認リスクも消える。代償はクロスプログレッションの必須化と、ダイヤ蛇口の再設計。上記の解決案でカバー可能。'},
   {k:'2',t:'案2 ── デイリー付与型を DLC として売る',d:'非消費型なので Valve の通貨販売承認が要らず、収益が継続型になる。ただし「毎日起動させる装置」を放置ゲームに持ち込む副作用がある。受け取り失効なしの設計が必須。'},
   {k:'1',t:'案1 ── 現状どおり直接販売',d:'移植コストは最小だが、Valve の承認リスクをそのまま被り、Steam レビューでの P2W 批判も最も受けやすい。実況との相性という今回の判断基準に最も合わない。'},
   {k:'23',t:'案2 + 案3 の併用',d:'Steam では単発のダイヤ販売はせず、デイリー付与型 DLC のみ置く。Mobile の直接販売は持ち越せる。売り物が1つだけなので実況で目立たず、Steam 単体の収益もゼロにならない。'},
  ]}},
 {id:'mn-plan', h:'プランB ── 通貨販売が通らなかった場合', s:'d', b:`
  <p>結果を待たずに切り替え先を先に決めておきます。この決定は <b>04 の暗号化の要否</b>と直結します。</p>`,
  opt:{items:[
   {k:'B2',t:'F2P + 権利販売のみ(DLC)',d:'通貨は売らず、非消費型だけを Steam DLC として売る。既存の非消費型4種に加え、2026-07-28 に確定した広告方針(倍率の課金解禁・FlyingPresent 強化)がそのまま DLC の形をしているため、売る商品が自然に揃う。DLC は標準機能なので追加の審査リスクが無く、通貨販売の承認待ちにも縛られない。→ 暗号化も不要になる。',rec:true},
   {k:'B1',t:'買い切り化',d:'本体を有料にし、課金要素を全廃。バランスは「全アンロック済み」相当に。ストアページの見せ方も変わる。'},
   {k:'A',t:'通貨販売に賭ける(プランBを用意しない)',d:'申請が通る前提で進める。通らなかったときの手戻りが大きい。'},
  ]}},
 {id:'mn-map', h:'既存アイテムの写像 ── RemoveAds の実効果と再設計', s:'d', b:`
  <p class="note">2026-07-28 コメント:「広告解除と対応した商品を組めばいい。つまり、広告によって得られる報酬にアクセスできる課金商品である。ただし、安直に設計せずにしっかり、現状の RemoveAds の効果を調査したうえで、Steam にあった課金商品としてリデザインする。」</p>
  <h4>調査結果 ── RemoveAds は「広告を消す商品」ではありませんでした</h4>
  <p>実装を追ったところ、<code>RemoveAds</code> の効果は <code>AdRoot.ShowRewardedAd()</code> の<b>分岐1箇所</b>に集約されています:</p>
  <blockquote><code>IsRemoveAdsPurchased() ? OnAdRewarded(callback) : OnAdRewardedWithAd(id, callback)</code><br>
  <span style="font-size:12px">── <code>Assets/1.Games/IdleGem/Ads/AdRoot.cs</code></span></blockquote>
  <p><span class="kw">つまり購入者は「広告が消える」のではなく、<b>全11導線の報酬が、視聴なしで・無制限に・即時付与される</b>状態になります。</span>回数制限も、クールダウンも、1日あたりの上限もかかりません。</p>
  <p>効果が及ぶ <code>AdId</code> は以下の11本です(<code>AdRoot.cs</code> の <code>enum AdId</code> 全量):</p>
  <table><tr><th>#</th><th>AdId</th><th>報酬の性質</th></tr>
  <tr><td>1</td><td><code>RandomTimeBoost</code></td><td>時間短縮</td></tr>
  <tr><td>2</td><td><code>DailyDiamond</code></td><td><b>ダイヤ(課金通貨)</b></td></tr>
  <tr><td>3</td><td><code>DailyBox</code></td><td>アイテム</td></tr>
  <tr><td>4</td><td><code>DailyBlueBox</code></td><td>アイテム</td></tr>
  <tr><td>5</td><td><code>PrestigeDoubleReward_Soil</code></td><td><b>倍率</b></td></tr>
  <tr><td>6</td><td><code>PrestigeDoubleReward_Tear</code></td><td><b>倍率</b></td></tr>
  <tr><td>7</td><td><code>OfflineBonusDoubleReward</code></td><td><b>倍率</b></td></tr>
  <tr><td>8</td><td><code>BattleLootX2</code></td><td><b>倍率</b></td></tr>
  <tr><td>9</td><td><code>Booster_CaveATK</code></td><td>一時強化</td></tr>
  <tr><td>10</td><td><code>Booster_BattleATK</code></td><td>一時強化</td></tr>
  <tr><td>11</td><td><code>Booster_TimeATK</code></td><td>一時強化</td></tr></table>
  <h4>だから「そのまま移植」は成立しません</h4>
  <p><span class="ng">RemoveAds を Steam にそのまま持ち込むと、それは「1回買えば全ての報酬ゲートが無料・無制限で開きっぱなしになる商品」になります。</span>これは <a href="#money" onclick="go('money')">§広告の扱い</a> で破棄したはずの「単に広告を解除した状態」そのものです。<b>モバイルでは広告視聴という時間コストがゲートとして残っていたので成立していましたが、Steam にはそのゲートがありません。</b></p>
  <p class="note">補足: 効果の強さの割に、これは<b>単価の低い1商品</b>として売られています。モバイルでは「広告を見なくて済む」という UX 対価として妥当でしたが、Steam では対価の実質が「11導線の恒久アンロック」に変わるため、<b>同じ値付けでは明らかに安すぎます</b>。</p>
  <h4>再設計 ── 1商品を、報酬の性質ごとに分割する</h4>
  <p>上の表の「報酬の性質」で分けると、Steam で売るべき単位が自然に出てきます。</p>
  <table><tr><th>再設計後の商品</th><th>含む AdId</th><th>Steam での形</th></tr>
  <tr><td><b>倍率の恒久解禁</b></td><td>5, 6, 7, 8</td><td><b>DLC</b>。「Prestige / OfflineBonus / Battle の倍率が常時有効になる」。<span class="okw">最も DLC の形をしており、所有権を Steam が持つので改ざん不能</span></td></tr>
  <tr><td><b>ブースター強化</b></td><td>9, 10, 11</td><td><b>DLC</b>。既存の <code>idle_gem_booster_plus</code> と統合できる</td></tr>
  <tr><td><b>デイリー報酬の受け取り</b></td><td>2, 3, 4</td><td>→ <a href="#money" onclick="go('money')">マネタイズ案2</a>の「デイリー付与型」と同じもの。<span class="ng">ここだけは無制限にしてはいけない</span>(ダイヤが絡むため)</td></tr>
  <tr><td><b>時間短縮</b></td><td>1</td><td>FlyingPresent 側の頻度・報酬量パラメータとして扱う(デフォルトを下げ、課金で増やす)</td></tr></table>
  <blockquote><b>設計の芯:</b> モバイルの RemoveAds は「<b>ゲートを外す</b>」商品だった。Steam 版は「<b>デフォルト値を上げる</b>」商品にする。<br>
  前者は無制限を生むが、後者は<span class="okw">上限を設計者が握ったまま</span>でいられます。</blockquote>
  <h4>既存アイテムの写像(更新)</h4>
  <table><tr><th>既存 ID</th><th>内容</th><th>Steam での扱い</th></tr>
  <tr><td><code>idle_gem_remove_ad_v2</code> / <code>remove_ads</code></td><td>広告削除(実体は11導線の無制限解禁)</td><td><b>そのままは廃止。</b>上表のとおり<b>性質ごとに分割して再設計</b></td></tr>
  <tr><td><code>idle_gem_booster_plus</code></td><td>恒久ブースター強化</td><td>DLC。<code>Booster_*</code> 3本と統合</td></tr>
  <tr><td><code>idle_gem_nether_plus</code></td><td>Nether 挑戦 3 → 5</td><td>DLC</td></tr></table>
  <p>DLC は <code>IStoreService.IsOwned()</code> で所有判定でき、<b>Steam 側が所有権を持つため復元処理が不要</b>。現在 PlayerPrefs にキャッシュしている課金フラグ(<code>AdsClient</code>)を Steam の所有権判定に置き換えます。<br>
  <span class="okw">→ これで 04 の「課金アンロックが別 PC で復元されない」問題も同時に解決します。</span></p>`,
  opt:{items:[
   {k:'A',t:'性質ごとに4分割する(上表のとおり)',d:'倍率 / ブースター / デイリー / 時間短縮 に分ける。倍率とブースターは DLC、デイリーは付与型商品、時間短縮はパラメータ。売り物の粒度が Steam の DLC と一致し、無制限を作らずに済む。',rec:true},
   {k:'B',t:'倍率系だけを1つの DLC にまとめ、残りは無償化',d:'商品数を1つに絞り、実況で目立たせない。デイリー系(ダイヤ含む)を無償で配ることになるので、案3(Mobile限定販売)を採る場合のみ整合する。'},
   {k:'C',t:'RemoveAds 相当を1商品として維持し、上限だけ設ける',d:'移植コストが最小。ただし「1商品で全部開く」構造が残るため、値付けが難しく P2W にも見えやすい。'},
  ]}},
 {id:'mn-ad', h:'広告の扱い ── 方針確定', s:'k', b:`
  <p class="note">2026-07-28 コメント反映。<b>当初案(クールダウン / 回数上限への置換)は破棄</b>し、以下を方針として確定しました。</p>
  <blockquote>Steam で広告は適切でない。<b>実況文化との相性が悪い</b>から。<br>
  かといって<b>単に広告を解除した状態にするのも不適切</b>。<br>
  → <span class="kw">広告が使われていたポイントごとに、個別に判断していく。</span></blockquote>
  <h4>読み替えの構図</h4>
  <p>広告枠を「時間で買う枠」から<b>「お金で買う枠」へ読み替える</b>ということです。モバイルでは<b>視聴時間</b>が対価だったものを、Steam では<b>デフォルト値を下げたうえで、課金が対価になる</b>形に置き換えます。</p>
  <table><tr><th>導線の例</th><th>Steam での扱い</th></tr>
  <tr><td><b>FlyingPresent</b></td><td>報酬量・出現頻度を<b>デフォルトで少なく</b>し、課金で増やす</td></tr>
  <tr><td><b>OfflineBonus の倍率</b></td><td>課金で<b>解禁</b>する</td></tr>
  <tr><td><b>Prestige 報酬の倍率</b></td><td>同上。課金で解禁</td></tr>
  <tr><td>その他(バトル戦利品 ×2 / ブースター 等)</td><td>導線ごとに判断。全 11 箇所の一覧は <code>Memo/Current_State_Audit.md</code></td></tr></table>
  <h4>この方針が連鎖して効くところ</h4>
  <ul>
   <li><span class="okw">恒久的な解禁・強化が増えるため、プランB2(非消費型を DLC として販売)との相性が非常に良い。</span>「倍率の解禁」はまさに DLC の形をしています。ゲーム内通貨の販売承認(§2)を待たずに成立します。</li>
   <li>DLC の所有権は Steam 側が持つので、<a href="#save" onclick="go('save')">セーブ改ざんで解禁される余地がありません</a>。暗号化の必要性がさらに下がります。</li>
   <li><span class="ng">注意すべき副作用</span>: デフォルト値を下げる以上、<b>無課金の Steam プレイヤーはモバイルの広告視聴プレイヤーより体験が薄くなります</b>。「PC 版は劣化している」と読まれない水準をどこに置くかは、導線ごとの数値設計で決まります。</li>
   <li><code>#if</code> で書ける形ではなくなります(導線ごとに値が違うため)。→ <a href="#platform" onclick="go('platform')">抽象化の深さ</a>の判断材料。</li>
  </ul>`},
 {id:'mn-where', h:'導線ごとの数値を、どのファイルに書くか', s:'d', b:`
  <p class="note">2026-07-28 コメント:「説明不足。何のことかわからない。」<br><b>質問の立て方が悪かったので、具体例から書き直します。</b></p>
  <h4>何が問題になっているのか</h4>
  <p>「導線ごとに個別判断する」と決めた結果(→ <a href="#money" onclick="go('money')">広告の扱い</a>)、<b>同じ機能なのにモバイルと Steam で数値が違う</b>状態が 11 箇所ぶん発生します。具体的にはこういう表が必要になります:</p>
  <table><tr><th>導線</th><th>モバイルでの条件</th><th>Steam での条件</th></tr>
  <tr><td><code>OfflineBonusDoubleReward</code></td><td>広告を1回見る → 倍率 ×2</td><td>倍率 DLC を持っていれば常時 ×2 / 未所持なら ×1</td></tr>
  <tr><td><code>FlyingPresent</code>(ダイヤ)</td><td>20〜50 ダイヤ / 通常頻度</td><td>10〜25 ダイヤ / 頻度を下げる。DLC 所持で元に戻す</td></tr>
  <tr><td><code>BattleLootX2</code></td><td>広告を1回見る → 戦利品 ×2</td><td>倍率 DLC を持っていれば常時 ×2</td></tr></table>
  <p><b>この表そのものを、コードのどこに置くか</b> ── それがこの節の問いです。置き場所によって「後から数値を調整できるか」「テストが書けるか」「モバイルを壊すリスクがあるか」が変わります。</p>
  <h4>選択肢のイメージ</h4>
  <p><b>案A</b> なら、ドメイン側に <code>AdId</code> をキーにした定義が1枚でき、プラットフォームごとに値セットを差し替えます:</p>
  <blockquote><code>RewardConfig[AdId.OfflineBonusDoubleReward] = { Multiplier: 2.0, RequiresDlc: "multiplier_pack", Frequency: 1.0 }</code></blockquote>
  <p><b>案B</b> なら、同じ表を Unity 側の <code>SteamRewardService.cs</code> の中に書きます。<b>案C</b> なら、表を作らず <code>FlyingPresent</code> や <code>OfflineBonus</code> のそれぞれの実装箇所で個別に条件分岐を書きます。</p>
  <p class="note">⚠️ 前版で「<code>AdCountRoot</code> にキーが揃っているので流用できる」と書きましたが、<b>これは言い過ぎでした</b>。<code>AdCountRoot</code> が持っているのは <code>AdId</code> をキーにした<b>累積カウンタ(<code>AttemptCount</code> / <code>WatchedCount</code>)だけ</b>で、<span class="ng">日付も、日次リセットも、上限判定も持っていません</span>(<code>ResetAllCounts()</code> が全消しするのみ)。<b>「1日 n 回まで」のような制限を入れる場合は、日付管理を新規に作る必要があります。</b>流用できるのは「導線を <code>AdId</code> で識別する」という枠組みだけです。</p>
  <h4>2026-07-30 決定: C(導線ごとに個別対応する)</h4>
  <p><b>了解しました。着手は最速です。</b>そのうえで、この決定が後で効いてくる点だけ記録しておきます。</p>
  <table><tr><th>影響</th><th>内容</th></tr>
  <tr><td>数値調整</td><td>11導線の値が各実装箇所に散るため、<span class="ng">「今どうなっているか」を一覧できません</span>。「デフォルトを下げる」調整を何度も回す前提とは相性が良くありません</td></tr>
  <tr><td><a href="#money" onclick="go('money')">プランB(B1)</a>への切り替え</td><td><span class="ng">値セットの一括差し替えができません。</span>B1 に倒れた場合、11箇所を個別に「解禁済み」へ直すことになります</td></tr>
  <tr><td>テスト</td><td>数値がコードに埋まるため、ドメインのテストからは検証できません</td></tr></table>
  <p class="note"><b>中間案として、器を作らずにコストを下げる方法が1つあります。</b>共通の Config クラスや Master データを新設せず、<span class="kw">単に「11導線の現在値を1枚の表にまとめた定数クラス(または Markdown 1枚)」を置いて、各実装箇所はそこを参照する</span>だけでも、一覧性と一括差し替えはかなり回復します。<b>設計としての「器」を作らずに済むので、C の軽さは保ったままです。</b>実装時に検討する価値はあります。</p>
  <p class="note">なお、<a href="#display" onclick="go('display')">UXML の管理方針</a>では「将来的な管理が容易であること」を重視すると伺っています。<b>その基準をこの節に当てはめると A が選ばれるはずでした。</b>もし C を選んだ理由が「11導線ぶんの器を作るのが重すぎる」ということであれば、上の中間案が折り合い点になるかもしれません。<span class="okw">意図的に軽さを取ったのであれば、このままで問題ありません。</span></p>`,
  opt:{items:[
   {k:'A',t:'AdId ごとの Config をドメイン(GamesDomain)に持つ',d:'上記の表を AdId をキーにした Config/Master としてドメインに定義し、プラットフォームで値セットを差し替える。数値がコードから分離されて一覧でき、テストが書ける。11導線ぶんの数値を後から何度も調整することになるので、この利点は大きい。代償は DLL のビルドと Unity への反映が挟まること。',rec:true},
   {k:'B',t:'Unity 側の IRewardService 実装に持たせる',d:'ドメインを触らないので DLL ビルドが不要。ただし数値が C# のコードに埋まり、テスト対象外になる。調整のたびに Unity 側のビルドが要る点は A と大差ない。'},
   {k:'C',t:'導線ごとに個別対応する(共通の器を作らない)',d:'FlyingPresent, OfflineBonus... をそれぞれの場所で個別に実装。着手は最速だが、11箇所に散った数値を後から一覧・比較できなくなる。「デフォルトを下げる」というバランス調整を繰り返す前提とは相性が悪い。'},
  ]}},
 {id:'mn-drop', h:'廃止するもの(削除ではなく「Steam ビルドに含めない」)', s:'k', b:`
  <table><tr><th>対象</th><th>理由</th></tr>
  <tr><td><code>Ads/AdsScene.unity</code>, <code>Ads/AdsView.cs</code></td><td>広告タブ UI</td></tr>
  <tr><td>ローカライズテーブル <code>UI_Ads</code></td><td><s>丸ごと不要</s> → <b>ビルドから外さない。</b>参照されなければ無害(2026-07-28)</td></tr>
  <tr><td><code>Ads/AttPermissionRequest.cs</code></td><td>iOS ATT</td></tr>
  <tr><td><code>remove_ads</code> / <code>idle_gem_remove_ad_v2</code></td><td>広告が無いので意味が無い</td></tr>
  <tr><td><code>Shop/IAP/MobileIAPManager.cs</code></td><td>ほぼ全行コメントアウトの旧実装</td></tr>
  <tr><td><code>FirstPurchaseDiamondDef.cs</code> のハードコードされたセール期間</td><td>2026/6/28〜7/5 で失効済み</td></tr></table>
  <blockquote><b>モバイル版と同一コードベースなので、削除ではなく「Steam ビルドに含めない」形にすること。</b>シーンはビルド対象から外し、UI は <code>IStoreService</code> / <code>IRewardService</code> の能力フラグで出し分ける。</blockquote>
  <p class="note">2026-07-28 コメント:「広告を出さないことは重要だが、ローカライズテーブルなどをビルドから外す手間は必要ない。<b>無効化されてればよい。</b>」<br>
  → <b>方針を「除外」から「無効化」へ緩めます。</b>判断基準を分けます:</p>
  <table><tr><th>対象</th><th>扱い</th><th>理由</th></tr>
  <tr><td><b>広告 SDK の初期化・表示</b>(<code>MobileAds.Initialize</code>, <code>AdsScene</code>)</td><td><span class="kw">確実に無効化する</span></td><td>実際に広告が出てしまうと Steam での方針そのものが崩れる。<b>ここだけは厳密に</b></td></tr>
  <tr><td><b>ローカライズテーブル <code>UI_Ads</code> / 未使用アセット</b></td><td><span class="okw">そのまま含めてよい</span></td><td>参照されなければ動作に影響しない。除外作業のほうがモバイル版を壊すリスクが高い</td></tr>
  <tr><td><b>UI(広告ボタン・広告タブ)</b></td><td>能力フラグで非表示</td><td>ビルド対象から外さなくても、表示されなければ十分</td></tr></table>
  <p><span class="okw">この緩和で、除外作業に伴う「モバイル版が壊れるリスク」がほぼ消えます。</span>ビルドサイズの数 MB より、同一コードベースの安全性を優先します。<br>
  <span class="ng">ただし GoogleMobileAds プラグインのネイティブライブラリだけは例外です。</span>Standalone ビルドに含まれると<b>そもそもビルドが通らない / 起動時に落ちる</b>可能性があるため、これは「無効化」では済まず、プラットフォーム設定で除外する必要があります。<b>フェーズ3頭の検証ビルドで最初に確認すべき項目</b>です(→ <a href="#risk" onclick="go('risk')">リスク</a>)。</p>`},
 {id:'mn-price', h:'🔴 価格設定 ── 事例調査が先(未実施)', s:'q', b:`
  <p class="note">2026-07-28 コメント:「この点はしっかりと Steam での成功事例を調査し、戦略を組む。」<br>
  <b>了解しました。値付けの選択肢を並べる前に、調査を先に置きます。</b>以下は調査の設計だけで、<span class="ng">結論はまだ出ていません</span>。</p>
  <p>ここで数字を推測で書くと、それが既成事実として下流の設計に流れてしまいます。<b>この節は意図的に空のまま残し、調査結果で埋めます。</b></p>
  <h4>調査対象 ── Steam の F2P / 買い切り放置ゲーム</h4>
  <table><tr><th>タイトル</th><th>見るべき点</th></tr>
  <tr><td><b>Tap Ninja - Idle game</b></td><td>コメントで挙がった参照元。<b>デイリー付与型の商品構成・価格・上限</b>を実際に確認する</td></tr>
  <tr><td><b>Melvor Idle</b></td><td>買い切り + 拡張 DLC 型の代表例。本体価格と DLC 価格の比</td></tr>
  <tr><td><b>Leaf Blower Revolution</b></td><td>F2P 寄りの放置ゲームで DLC を多数展開している例。DLC の粒度</td></tr>
  <tr><td><b>NGU IDLE / Idling to Rule the Gods</b></td><td>基本無料 + 少数の課金要素。<b>売らない判断をどこで引いているか</b></td></tr>
  <tr><td><b>Idle Champions of the Forgotten Realms</b></td><td>通貨販売を実際に行っている F2P。<span class="kw">Valve の承認が通っている実例として、商品ページの見せ方を確認する</span></td></tr></table>
  <h4>各タイトルで取るデータ</h4>
  <ol>
   <li><b>商品構成</b> ── DLC か、ゲーム内通貨か、その併用か。DLC なら何個あり、どういう粒度で分けているか</li>
   <li><b>価格帯</b> ── 最低額と最高額。Steam のストアページから直接読める</li>
   <li><b>レビューでの言及</b> ── 「P2W」「pay to win」「microtransaction」でレビューを絞り込み、<span class="kw">どういう売り方が叩かれ、どういう売り方が許容されているか</span>を読む。<b>これが今回いちばん重要</b>。実況文化との相性を判断基準に置いた以上、数字より言説を見るべき</li>
   <li><b>モバイル版の有無と価格差</b> ── 両方出しているタイトルで、価格を揃えているか変えているか(案3 の検討材料)</li>
  </ol>
  <h4>調査で答えを出したい問い</h4>
  <ul>
   <li>Steam の放置ゲームで<b>ゲーム内通貨を売っているタイトルは実在するか</b>(実在すれば <a href="#money" onclick="go('money')">承認リスク</a>の見積もりが下がる)</li>
   <li>DLC の価格帯は、モバイルの同等商品より<b>高いのか安いのか</b></li>
   <li><b>「毎日 XX 付与」型はレビューでどう受け止められているか</b>(案2 の可否に直結)</li>

  </ul>
  <p class="note">この調査が終わるまで、価格に関する決定(モバイルと揃えるか / PC 向けに上げるか / 地域別価格をどう作るか)は<b>保留</b>とします。ストアページ作成より前に片付ければ十分間に合います。</p>`},

 {id:'sv-local', h:'ローカルセーブは無改修で動く', s:'k', b:`
  <p><code>Application.persistentDataPath</code> は Standalone でもそのまま動きます。書き込みもアトミック(tmp → <code>File.Replace</code>)で実装品質は十分。</p>

 {id:'sv-enc', h:'セーブデータの改ざん対策 ── 方針転換', s:'d', b:`
  <p class="note">2026-07-28 コメント:「<b>改竄は課金通貨限らず一切できないようにしたい。</b>」<br>
  <span class="ng">これは前版の結論(A: 平文のまま)を覆します。</span>前版は「改ざんされても<b>売上が減らない</b>から放置してよい」という<b>収益防衛</b>の観点で A を推していました。今回の指示は<b>作品の健全性</b>を基準に置くもので、判断軸そのものが変わります。<b>A は選択肢から外します。</b></p>
  <h4>現状: 全て平文</h4>
  <ul><li><code>BindRepository&lt;T&gt;(key, isEncrypted)</code> の呼び出しは <b>60件すべて <code>isEncrypted: false</code></b></li>
  <li>暗号化パス(<code>EncryptedUpdateJsonPlayerData.cs</code> + <code>AES.cs</code>)は<b>実装済みだが一度も使われていない</b></li>
  <li>Anti-Cheat Toolkit も<b>導入済みだが使用ゼロ</b></li></ul>
  <h4>脅威モデルが移植で変わる</h4>
  <table><tr><th></th><th>モバイル</th><th>PC (Steam)</th></tr>
  <tr><td>セーブの場所</td><td>アプリサンドボックス内</td><td><code>%APPDATA%\\LocalLow\\...\\*.json</code></td></tr>
  <tr><td>改ざんの難易度</td><td>root / 脱獄が必要</td><td><b>メモ帳で開いて数字を書き換えるだけ</b></td></tr></table>
  <p><b>OS が守ってくれていた前提が消えます。</b></p>
  <blockquote>収益の観点では、この判断は 03 に依存していました。<b>通貨を売るなら必須、DLC のみなら不要</b> ── DLC の所有権は Steam 側が持つので偽造できず、セーブを改ざんされても売上は減らないからです。<br>
  <span class="okw">その結論自体は今も正しいです。</span>ただし<b>今回の指示はそこを基準にしていません。</b></blockquote>
  <h4>「一切できないように」はどこまで到達できるか</h4>
  <p>先に限界を明示します。<span class="ng">クライアント上で完結するゲームである限り、改ざんを理論的にゼロにすることはできません。</span>セーブを暗号化しても鍵はバイナリの中にあり、メモリ上の値は実行中に書き換えられます。<b>できるのは「割に合わなくする」ことだけ</b>です。</p>
  <p>そのうえで、対策には明確な段階があります:</p>
  <table><tr><th>段階</th><th>防げるもの</th><th>本作での状況</th></tr>
  <tr><td><b>1. セーブの暗号化</b>(AES)</td><td>メモ帳で開いて数字を書き換える。<span class="kw">改ざん者の大多数はここで止まります</span></td><td><code>EncryptedUpdateJsonPlayerData.cs</code> + <code>AES.cs</code> が<b>実装済み。フラグを変えるだけ</b></td></tr>
  <tr><td><b>2. メモリ改ざんの検出</b>(ACTk)</td><td>CheatEngine 等での実行中の値書き換え</td><td>Anti-Cheat Toolkit が<b>導入済み・未使用。追加費用なし</b></td></tr>
  <tr><td><b>3. 進行の妥当性検証</b></td><td>「深度が1フレームで100万進んだ」等、<b>あり得ない変化の検出</b>。暗号を破られても効く</td><td>未実装。ドメイン側に判定を書けば<span class="okw">テストが書ける</span></td></tr>
  <tr><td><b>4. サーバー権威</b></td><td>ほぼ全て。ただしオフライン放置ゲームとは根本的に相性が悪い</td><td>→ 下記</td></tr></table>
  <p><span class="okw">1 と 2 は、本作では「実装済みのものを有効にする」だけで到達できます。</span>費用も新規実装もほぼ不要で、これは非常に恵まれた状況です。</p>
  <h4>2026-07-30 の質問: CheatEngine を利用する利点とは</h4>
  <p>「なぜ AES だけでは足りず、ACTk(段階2)が要るのか」という論点です。<b>攻撃者から見た CheatEngine の利点</b>を書きます。</p>
  <blockquote><b>CheatEngine はセーブファイルを一切触りません。実行中のメモリを書き換えます。</b></blockquote>
  <p>手順はこうです ── ダイヤを 1,234 持っている状態で「1234」を検索し、少し使ってから再検索して候補を絞り、アドレスを特定して値を書き換える。<span class="ng">ゲームは暗号化されたセーブを自分で復号してメモリに載せるので、攻撃者は復号をゲームにやらせるだけで済みます。</span></p>
  <p><b>そして最悪なのはこの後です。</b>メモリを書き換えた状態で通常どおりセーブすると、<span class="ng">改ざんされた値が正規の鍵で正しく暗号化されて保存されます</span>。<b>ファイルとしては完全に正当で、後から検出する手がかりも残りません。</b>つまり AES は<b>完全に迂回されます</b>。</p>
  <p>ACTk が対抗する仕組みは主に2つです:</p>
  <table><tr><th>機能</th><th>効果</th><th>本作での適用性</th></tr>
  <tr><td><code>Obscured*</code> 型</td><td>値をランダムなオフセット/XOR で保持し、素朴な値検索でヒットしなくする。改変を検出したらコールバック</td><td><span class="ng">⚠️ 主要通貨は <code>BigDouble</code>(<code>Currency.Number</code>)で、ACTk の <code>ObscuredInt</code> / <code>ObscuredFloat</code> では直接包めません。</span>ドメイン DLL 側の型なので、適用するには追加設計が要ります</td></tr>
  <tr><td>スピードハック検出</td><td>時間の進みの改ざんを検出</td><td><span class="okw">放置ゲームでは最も価値が高い</span>。下記参照</td></tr></table>
  <h4>🔴 本作で最も価値の高い対策は、実は暗号化ではありません</h4>
  <p>放置ゲームに対する最も効率のよい改ざんは、<b>セーブの数値いじりでもメモリ改変でもなく「時間を進めること」</b>です。オフライン報酬がそのまま時間の関数だからです。実装を確認しました:</p>
  <blockquote><code>var pending = (DateTime.UtcNow - repo.lastOnlineTime).TotalSeconds;</code><br>
  <span style="font-size:12px">── <code>Games/_OTHERS/OfflineBonus/OfflineBonusRoot.cs</code></span></blockquote>
  <p><span class="ng">端末のシステム時計をそのまま信用しています。</span>PC では時計の変更に管理者権限すら要らないため、<b>OS の日付を進めて再起動するだけで、任意量のオフライン報酬が得られます</b>。AES も ACTk の <code>Obscured*</code> 型も、この攻撃には何の効果もありません。</p>
  <p><span class="okw">そして、これを塞ぐ部品は既にこのプロジェクトにあります。</span></p>
  <table><tr><th>既にあるもの</th><th>状況</th></tr>
  <tr><td><code>OfflineBonusFunction.GetServerTime()</code></td><td><code>getServerTime</code> Cloud Function を叩く実装済み。<b>普通の HTTPS POST なので Standalone でも動きます</b></td></tr>
  <tr><td><code>ServerTimeService</code></td><td><code>RootInstaller</code> で DI 登録済み</td></tr>
  <tr><td>実際の利用箇所</td><td><span class="ng">現状 <code>ShopView</code>(セール期間の判定)のみ。オフライン報酬の経路からは呼ばれていません</span></td></tr></table>
  <blockquote><b>提案:</b> <code>OfflineBonusRoot</code> の時刻ソースを、端末時計からサーバー時刻へ差し替える(取得失敗時は端末時計にフォールバックし、その回のボーナスに上限を設ける)。<br>
  <span class="okw">新規のインフラは不要です。既にあるものを繋ぐだけで、本作で最も効く改ざん対策になります。</span>「サーバーを使いたい」という方針とも一致します。</blockquote>
  <p class="note">優先度の考え方: <b>AES(段階1)は「メモ帳で開ける」という一番恥ずかしい穴を塞ぐもの</b>で、費用対効果が高く最初にやる価値があります。<b>時刻のサーバー化は、本作固有の最大の穴を塞ぐもの</b>です。<span class="ng">ACTk の <code>Obscured*</code> 型は、BigDouble との相性の問題があるため、この2つより後に検討するのが妥当です。</span></p>
  <h4>4(サーバー権威)について ── 今回だけは検討に値します</h4>
  <p>前版は「本作の規模では過剰」として切り捨てていました。しかし <b>サーバーを使いたいという方針が別途出ている</b>(→ <a href="#save" onclick="go('save')">クラウドセーブ</a>)ため、前提が変わります。</p>
  <p><span class="ng">ただし全面的なサーバー権威は依然として現実的ではありません。</span>本作は<b>オフラインで進行し、OfflineBonus で放置時間を報酬に変える</b>ゲームです。進行をサーバーで検証するということは、オフラインプレイを否定するか、オフライン中の進行を後から丸ごと信用するかのどちらかになり、後者では検証の意味がありません。<br>
  <b>現実的なのは「全部を検証する」ではなく「他人に見える値だけを検証する」</b>です ── リーダーボード(→ <a href="#feature" onclick="go('feature')">06</a>)や NetherCompanion の共有ビルドのように、<span class="kw">改ざんが他プレイヤーに迷惑をかける経路だけ</span>をサーバー側で弾く。これなら既存の REST 基盤に乗り、オフライン進行も壊しません。</p>
  <p class="note">⚠️ <b>移行の罠 ── これが今回いちばん重い作業になります。</b>Q5「モバイル版を継続」が確定しているため、この罠は生きています。<code>isEncrypted</code> を false → true に変えると<b>保存先ファイル名が変わります</b>(<code>_saveData.json</code> → <code>_saveData.encrypted</code>)。<span class="ng">モバイル版の既存プレイヤー全員のセーブが読めなくなります。</span><br>
  「旧 <code>.json</code> があれば読んで <code>.encrypted</code> に書き直す」移行処理が必須で、対象は <b><code>BindRepository</code> の呼び出し 60 件すべて</b>です。<b>暗号化そのものは1行ですが、移行処理と、その全件テストが本体です。</b>ここを失敗するとリリース済みのモバイル版が壊れるため、<span class="kw">Steam 対応の中で最も慎重に進めるべき箇所</span>として扱ってください。</p>
  <p class="note">補足: <b>Steam 版だけ暗号化する</b>という逃げ道もあります(新規プレイヤーしかいないので移行処理が不要)。ただしコメントの「一切できないようにしたい」がモバイルも含む意図なら、この逃げ道は使えません。<b>下の選択肢はその点で分かれます。</b></p>
  <h4>2026-07-30 決定: B(AES 有効化のみ)</h4>
  <p>コメント:「AES 有効化にあたっては必ず、マイグレーションが必要であり、かなり慎重に組む必要がある。」<span class="okw">認識は完全に一致しています。</span>この節でいちばん重い作業は暗号化ではなく移行処理です。</p>
  <p><b>移行処理を安全に組むための最低条件</b>を、実装時のチェックリストとして置いておきます:</p>
  <table><tr><th>#</th><th>条件</th><th>理由</th></tr>
  <tr><td>M1</td><td><b>旧 <code>.json</code> を削除しない。</b>読み込んで <code>.encrypted</code> を書いた後も、旧ファイルはリネームして残す</td><td>移行に失敗しても手で戻せる。<span class="ng">消してしまうと復旧手段が消えます</span></td></tr>
  <tr><td>M2</td><td><b>書き込みが完全に成功してから、旧ファイルを「移行済み」に印付けする。</b>順序を逆にしない</td><td>途中でアプリが落ちた場合に、二重移行も未移行も起きないようにする</td></tr>
  <tr><td>M3</td><td><b>60件すべてを網羅したテストを書く。</b><code>BindRepository</code> の呼び出し一覧から機械的に生成する</td><td>「1つだけ移行漏れ」が最も起きやすく、最も気づきにくい</td></tr>
  <tr><td>M4</td><td><b>実機の既存セーブで検証する。</b>新規プレイでは移行経路を1行も通りません</td><td>移行バグは新規プレイでは絶対に再現しない</td></tr>
  <tr><td>M5</td><td><b>モバイルへ先に配信しない。</b>Steam 版で移行経路を十分に踏んでから、モバイルへ展開する</td><td>リリース済みモバイル版が最大の被害範囲。<span class="kw">Steam を実質の先行検証環境として使えます</span></td></tr></table>
  <p class="note">B を選んだことで <b>ACTk(段階2)は当面見送り</b>になります。上の CheatEngine の説明のとおり、<span class="ng">B だけではメモリ改変は防げません</span>。ただし ACTk は <code>BigDouble</code> との相性問題があるため、<b>先に「時刻のサーバー化」を入れるほうが本作では効果が大きい</b>と考えています。「一切できないようにしたい」という目標に対しては、B は出発点であって到達点ではありません。</p>`,
  opt:{items:[
   {k:'C',t:'AES 有効化 + ACTk(両プラットフォーム)',d:'実装済みのものを2つとも有効にする。クライアント側で到達できる実用上の上限で、追加費用ゼロ。「一切できないように」への最も素直な回答。代償は 60 件ぶんの移行処理とそのテストで、これがこの案の作業の大半を占める。',rec:true},
   {k:'CS',t:'Steam 版のみ AES + ACTk。モバイルは平文のまま',d:'移行処理が丸ごと不要になり、リリース済みモバイル版を壊すリスクがゼロ。Steam の脅威モデル(ファイルが %APPDATA% で丸見え)にだけ対処するという整理も筋が通る。ただしモバイルの改ざんは放置される。'},
   {k:'CD',t:'C + 共有値のサーバー検証',d:'C に加えて、リーダーボードや NetherCompanion の共有ビルドなど「他人に見える値」だけをサーバー側で妥当性検証する。改ざんが他プレイヤーに影響する経路を塞ぐ。サーバー方針とも一貫するが、新規実装が必要。'},
   {k:'B',t:'AES 有効化のみ',d:'メモ帳での書き換えは防げる。ACTk を入れない分だけ手数が減るが、既に導入済みのものを使わない理由は乏しい。'},
  ]}},
 {id:'sv-cloud', h:'クラウドセーブとサーバー ── 前提が誤っていました', s:'d', b:`
  <p class="note">2026-07-28 コメント:「<b>NetherCompanion があるので、サーバーは使いたい。どのような方法が考えられるか？</b>」</p>
  <h4>まず訂正 ── 「Firebase は Standalone 非対応」は本作には当てはまりません</h4>
  <p>前版は「Firebase Unity SDK は Standalone を正式サポートしていない」ことを理由に、Firebase を避ける方向で書いていました。<span class="ng">この記述は、本プロジェクトに関しては誤りでした。</span>実際にコードを確認した結果:</p>
  <table><tr><th>確認したこと</th><th>結果</th></tr>
  <tr><td><code>using Firebase.*</code> の出現箇所</td><td><b>Assets 配下に 1 件も無い</b></td></tr>
  <tr><td><code>FirebaseAuthHelper.cs</code></td><td><code>System.Net.Http.HttpClient</code> で <code>identitytoolkit.googleapis.com</code> を直接叩いている</td></tr>
  <tr><td><code>CloudSaveController.cs</code></td><td>同じく <code>System.Net.Http.HttpClient</code> 経由(<code>IdleSystem.Backend.Client</code>)</td></tr>
  <tr><td>Firebase SDK の実体</td><td><code>Plugins/Android/FirebaseApp.androidlib</code> のみ。<b>Android 専用で、Standalone ビルドには最初から入らない</b></td></tr></table>
  <p><span class="okw">つまり本作のバックエンドは、最初から Firebase Unity SDK ではなく <b>REST(HTTPS + JSON)</b> で書かれています。</span>REST に Standalone 非対応という概念はありません。<b>「Firebase を REST 化する」という作業は存在せず、既に REST です。</b>Windows / macOS でそのまま動く見込みが高く、必要なのは<b>実装ではなく確認</b>です。</p>
  <p class="note">前版の選択肢 B「Firebase を REST 化(実装コスト大)」は、この事実により<b>無効です</b>。コストの見積もりが根本的に間違っていました。</p>
  <h4>そのうえで ── サーバーで何をしたいのかを分けます</h4>
  <p>「クラウドセーブ」と「サーバー機能」は別の問題で、<b>別々に決められます</b>。混ぜていたのが前版の失敗でした。</p>
  <table><tr><th>用途</th><th>必要なもの</th><th>推奨</th></tr>
  <tr><td><b>セーブのバックアップ・端末間同期</b></td><td>ファイルの保管と競合解決</td><td><span class="kw">Steam Cloud</span>。無料、設定のみ、競合解決も Steam クライアント任せ</td></tr>
  <tr><td><b>NetherCompanion</b>(他プレイヤーのビルド共有)</td><td>プレイヤー間でデータを交換する場</td><td><span class="kw">Firestore REST を継続</span>。Steam Cloud では代替不可能(他人のデータを読む必要があるため)</td></tr>
  <tr><td><b>リーダーボード</b></td><td>スコアの集約</td><td>Steamworks の機能を使う(→ <a href="#feature" onclick="go('feature')">06</a>)</td></tr>
  <tr><td><b>クロスプログレッション</b>(案3 を採る場合)</td><td>購入ダイヤ総額の共有</td><td>Firestore REST。<b>セーブ全体ではなく所有権だけ</b>を持てば足りる(→ <a href="#money" onclick="go('money')">03</a>)</td></tr></table>
  <blockquote><b>結論の形:</b> セーブは Steam Cloud、プレイヤー間で共有が必要なものだけ Firestore REST。<br>
  <span class="okw">この分け方なら「サーバーを使いたい」も「実装を軽くしたい」も両立します。</span></blockquote>
  <h4>2026-07-30 の指摘: 「A2 ではセーブをモバイルと PC 間で同期できないのでは？」</h4>
  <p><span class="okw">そのとおりです。ご指摘は正しく、A2 の表はその点を書いていませんでした。</span></p>
  <p><b>Steam Cloud は Steam のインストール間でしか同期しません。</b>PC ⇄ PC(自宅とノート、Steam Deck)は同期されますが、<span class="ng">モバイル ⇄ PC は同期されません</span>。A2 を採ると、モバイルと Steam は<b>別々のセーブを持つ2つのゲーム</b>になります。</p>
  <h4>それが問題になるかは、マネタイズの決定で決まります</h4>
  <table><tr><th>マネタイズ</th><th>クロスセーブ</th><th>理由</th></tr>
  <tr><td><b>案2(デイリー付与型)</b> ← <span class="kw">2026-07-30 に選択</span></td><td><span class="okw">不要</span></td><td>Steam で売って Steam で完結する。持ち越すものが無い</td></tr>
  <tr><td>案3(Mobile 限定販売)</td><td><span class="ng">必須</span></td><td>Mobile で買ったダイヤを Steam に反映する必要がある</td></tr></table>
  <p><span class="okw">案2 が選ばれたので、マネタイズ上の理由でクロスセーブが必要になることはなくなりました。</span>「モバイル版からのセーブ引き継ぎはスコープ外」という当初の前提も、そのまま維持できます。</p>
  <p class="note">ただし<b>「要件ではないが、あると嬉しい機能」</b>としてクロスセーブを入れたいのであれば、話は別です。その場合の選択肢を下に整理しました。</p>
  <h4>クロスセーブを入れる場合 ── 二重同期だけは避けてください</h4>
  <blockquote><span class="ng">最も危険なのは「Steam Cloud と Firestore の両方を自動同期させる」構成(選択肢C)です。</span>同じセーブファイルに<b>2つの権威</b>ができ、3者間(PC ローカル / Steam Cloud / Firestore)の競合解決が必要になります。<b>セーブ喪失が致命傷であるこのゲームでは、複雑さそのものが最大のリスク</b>です。</blockquote>
  <p>入れるなら、どちらか一方を<b>セーブの唯一の権威</b>にしてください:</p>
  <table><tr><th>案</th><th>構成</th><th>評価</th></tr>
  <tr><td><b>B'</b></td><td><b>Firestore を正本にし、Steam Cloud はゲームのセーブに使わない</b>(Steamworks 側で同期対象を空にする)</td><td><span class="okw">クロスセーブが自然に成立</span>。<code>CloudSaveController</code> の競合解決(575-691行)は<b>モバイルで実運用されている実績品</b>で、そのまま流用できる。<span class="ng">代償は Steam Cloud の無料の恩恵を捨てること</span></td></tr>
  <tr><td><b>A2'</b></td><td>A2 のまま。<b>クロスセーブは「明示的な手動エクスポート/インポート」としてだけ提供</b>する</td><td>自動同期の競合が原理的に発生しない。<span class="kw">プレイヤーが意図したときだけ上書きが起きる</span>ので、事故の説明がつく。実装も軽い</td></tr></table>
  <p><span class="okw">クロスセーブが「必須要件ではない」なら、A2' を勧めます。</span>自動同期は便利ですが、2プラットフォーム間で常時走らせると<b>「どちらが新しいか」の判定を間違えた瞬間に進行が消えます</b>。手動なら、最悪でもプレイヤーが自分で押した操作の結果として説明できます。</p>
  <h4>NetherCompanion を Steam に載せるときの確認事項</h4>
  <p>設計上は <code>idle-gem-companion-builds/**</code> という専用コレクションに閉じており(<code>nether-companion-plan.md</code>)、通信は<b>1日あたり書込1回・読取3回</b>に固定されています。Standalone に持っていく際の論点は実装ではなく運用側です:</p>
  <ol>
   <li><b>匿名認証の UID がプラットフォーム間で別物になる。</b>Steam 版と Mobile 版で同一人物が別 UID を持つことになりますが、Companion 機能は「他人のビルドを借りる」だけなので<b>実害はありません</b>。ただしクロスプログレッションを採るなら UID の統合が必要になります</li>
   <li><b>プレイヤー名のモデレーション。</b>PC は入力が容易なぶん不適切名のリスクが上がります。<code>nether-companion-consent.md</code> で課題として残されている論点が、Steam ではより重くなります</li>
   <li><b>Firestore の課金。</b>Steam 版のユーザーが増えても 1 ユーザーあたり 1日 4 リクエストのままなので、<span class="okw">コスト構造は変わりません</span></li>
   <li><b>ネットワーク不通時の挙動。</b>PC ではオフライン起動が普通にあるため、失敗時に静かに諦める設計(実装済み)がそのまま効きます</li>
  </ol>`,
  opt:{items:[
   {k:'A2',t:'セーブは Steam Cloud、共有機能は Firestore REST を継続',d:'用途で分ける案。セーブの競合解決を Steam に任せつつ、NetherCompanion とクロスプログレッションの道を残す。既存コードが既に REST なので追加実装はほぼ不要で、必要なのは Standalone での動作確認のみ。',rec:true},
   {k:'A',t:'Steam Cloud のみ。サーバー機能は Steam 版で無効化',d:'最も軽い。ただし NetherCompanion が Steam 版で使えなくなり、「サーバーを使いたい」という方針に反する。'},
   {k:'B',t:'すべて Firestore REST に寄せる(Steam Cloud を使わない)',d:'モバイルと完全に同じバックエンドになり、クロスプログレッションが自然に実現する。ただし CloudSaveController の競合解決(575-691行)を PC でも自前で抱えることになり、Steam Cloud の無料の恩恵を捨てることになる。'},
   {k:'C',t:'両方(Steam Cloud を主、Firestore を副)',d:'セーブを二重に持つ。競合解決が3者間になり複雑さが跳ね上がる。セーブ喪失が致命傷である以上、複雑さ自体がリスク。'},
  ]}},

{id:'display', nav:'05 横長レイアウトと PC 操作', group:'仕様', title:'横長レイアウトと PC 操作', desc:'最大工数。縦画面 UI の横長対応、Equipment のマウス操作、キーボードショートカット。', src:'docs/steam-release/05_Input_and_Display.md', secs:[
 {id:'ds-principle', h:'原則の入れ替え ── 「並べる」から「展開する」へ', s:'k', b:`
  <p class="note">2026-07-28 <b>「Horizontal Layout for Idle Minertia」(手描き仕様・全7ページ)を受けて、この章はゼロから作り直しました。</b>方針として<span class="kw">変更容易性よりクオリティを優先</span>します。前版の「3カラムに別シーンを挿す」案は<b>破棄</b>します。</p>
  <h4>前版が間違っていた点</h4>
  <p>前版は横長を <b>「縦長の画面を並べたもの」</b>と定義していました(左に Equipment、中央に Cave、右に Relic)。これは<span class="ng">実装の都合から出た定義</span>であって、プレイヤー体験から出た定義ではありません。実際、前版自身が「Equipment は 972 幅の常設サイドには詰め込みすぎ」と自分で懸念を書いていました。<b>定義が悪いから無理が出ていたのです。</b></p>
  <h4>新しい原則</h4>
  <blockquote><b>縦長画面は、狭さを埋め合わせるために情報を「縦に圧縮」している。<br>
  横長画面では、その圧縮を解く。</b></blockquote>
  <p>圧縮の手段は2つしかありません。<b>タブで畳む</b>か、<b>上下に積む</b>かです。横長ではどちらも<b>左右に並べる</b>へ置き換わります。頂いた仕様の全ページが、例外なくこの1つの規則で説明できます:</p>
  <table><tr><th>画面</th><th>縦長での圧縮</th><th>横長での展開</th></tr>
  <tr><td><b>Cave</b></td><td>Soil / Tear Upgrade を<b>2タブで畳む</b></td><td>2つを<b>左右に並べて同時表示</b></td></tr>
  <tr><td><b>Mission, Trade</b></td><td>2タブで畳む</td><td>タブを廃し<b>二列</b>で表示</td></tr>
  <tr><td><b>Prestige</b></td><td>2タブで畳む</td><td>2つをいっぺんに表示し横並びに</td></tr>
  <tr><td><b>Equipment</b></td><td>インベントリと操作系を<b>上下に積む</b></td><td>インベントリを左、操作系を右に。<span class="kw">操作系の内側の3タブはタブのまま</span></td></tr>
  <tr><td><b>Battle</b></td><td>3ブロックが<b>2段に折り返す</b></td><td>折り返しを解いて<b>1行に並べる</b></td></tr></table>
  <p><span class="okw">この原則の価値は、新しい情報設計を一切作らないことです。</span>同じ内容・同じグループのまま、畳み方だけを変えます。だから<b>新規のUX設計も、新規のアートも発生しません</b>。前版の3カラム案は「Cave を見ながら Equipment を触る」という<b>新しい遊び方</b>を発明しようとしていて、それが難しさの正体でした。</p>
  <p class="note">Equipment の内側3タブが<b>タブのまま残る</b>点に注意してください。原則は「<b>いちばん外側の畳みを1段だけ解く</b>」です。全部の階層を開くと横長でも入りません。</p>`},
 {id:'ds-nav', h:'ナビゲーション ── 下タブバーから右レールへ', s:'k', b:`
  <p>横長では、画面下部のタブバー(<code>MainUI2.uxml</code> の <code>BottomArea</code> / <code>ButtomButtonUXML</code>)を<b>画面右端の縦レール</b>に置き換えます。</p>
  <h4>仕様</h4>
  <table><tr><th>#</th><th>仕様</th><th>理由・補足</th></tr>
  <tr><td>N1</td><td><b>右端に縦一列</b>で並べる</td><td>横長では横幅が余り、縦が足りない。下部を占有しないぶんコンテンツの高さが稼げる</td></tr>
  <tr><td>N2</td><td><b>上から順に並べ、下寄せ</b>にする</td><td>項目数が増減しても<b>最下段の位置が動かない</b>。マウスが最後に置かれる位置が安定する</td></tr>
  <tr><td>N3</td><td><b>いちばん下がハンバーガーボタン</b>(Options)</td><td>縦長では右上にあったもの。<b>下寄せと組み合わせると常に同じ位置</b>に来る</td></tr>
  <tr><td>N4</td><td><b>区切り線を入れない</b></td><td>レールに枠や背景を持たせない。コンテンツの上に浮かせる</td></tr>
  <tr><td>N5</td><td>各ボタンに<b>番号を振る</b></td><td>下記のとおりキーボードショートカットと直結する</td></tr></table>
  <h4>番号がそのままキーボードショートカットになります</h4>
  <p><span class="okw">この仕様の最良の副産物です。</span>本企画では既に「数字キー 1〜6 でコンテンツ切替」を実装する方針が決まっています(→ 下記 §キーボードショートカット)。<b>レールの番号は、そのショートカットを画面に可視化したものになります。</b>PC ゲームで「番号付きの縦メニュー」は、押すべきキーの説明そのものとして機能します。<span class="kw">別々に決めた2つの仕様が、追加コストなしで噛み合いました。</span></p>
  <h4>🔴 未決 ── レールに何を載せるか</h4>
  <p>頂いた Cave の図では、<b>Map / Booster / INDEX を開くボタンがレールに移動</b>していました(「Map, Booster, Index を開くボタンはコンテンツボタンとする」)。一方で<b>鉱石一覧ボタンと Mission ボタンはコンテンツ側に残って</b>います。</p>
  <p>この線引きは「<b>全画面を開くボタンはレールへ / いま居る Cave に紐づくものはコンテンツに残す</b>」と読めますが、確定ではありません。<span class="ng">ここには構造的な問題が1つあります:</span></p>
  <blockquote><b>画面ごとにレールの項目数が変わると、番号がずれます。</b><br>
  Cave では Map/Booster/INDEX が加わって 6 項目、Equipment では 4 項目、というように変動すると、<span class="ng">「3 を押すと何が出るか」が画面によって変わってしまいます</span>。N5 とキーボードショートカットの利点が失われます。</blockquote>
  <p>回避案は2つあります:</p>
  <ol>
   <li><b>レールを2段に分ける。</b>上段=画面固有ボタン(番号なし)、下段=グローバルなコンテンツ切替(番号あり・下寄せ・最下段ハンバーガー)。<span class="okw">N2/N3 の「下寄せ」がそのまま活き、番号の安定も保てます。</span>区切り線を入れないという N4 とも両立します(間隔だけで分ける)</li>
   <li><b>番号はグローバル項目にだけ振る。</b>画面固有ボタンはレールに混ぜるがアイコンのみ。実装は軽いが、並びの中で番号が飛ぶ</li>
  </ol>`,
  opt:null},
 {id:'ds-screens', h:'画面ごとの展開仕様', s:'k', b:`
  <p>頂いた図をそのまま仕様として書き起こしたものです。</p>
  <h4>Cave</h4>
  <table><tr><th>領域</th><th>横長での配置</th></tr>
  <tr><td>上部</td><td>左に <b>Depth X-X</b>、中央にメイン通貨、右に通貨3行。<b>横一列に伸ばす</b>(縦長では2段だったものが1段に収まる)</td></tr>
  <tr><td>中段左</td><td>鉱石一覧ボタン + Mission ボタン(緑バー)。<b>コンテンツ側に残す</b></td></tr>
  <tr><td>中央</td><td>Cave の描画領域</td></tr>

  <tr><td>右端</td><td>レール(Map / Booster / INDEX + グローバル切替 + ハンバーガー)</td></tr></table>
  <h4>Mission, Trade</h4>
  <p>2タブを廃止し、<b>二列</b>で並べる。それ以外の変更なし。</p>
  <h4>Equipment</h4>

  <span class="okw">前版で懸念していた「972 幅に Equipment を詰め込む」問題は、この構成では発生しません。</span>Equipment は横長でも全画面を使うためです。</p>
  <h4>Battle</h4>
  <p>上部に Battle の描画領域を<b>全幅で</b>。下部に3つのパネルを<b>1行に並べる</b>(縦長では2段に折り返していたもの)。3番目のパネルは横幅に余裕があるぶん<b>広く取る</b>。操作ボタン3つは<b>右下</b>に維持。</p>

 {id:'ds-howto', h:'UXML の管理方針 ── 「器」と「部品」で分ける', s:'k', b:`
  <p class="note">2026-07-30 コメント:「やはり、UXML を複製しないというのは現実ではないかもしれない。もっと良い管理方法はないだろうか？例えば、Vertical と Horizontal で UXML は分けつつ、表示が変わらない要素は UXML 化し、それを共有したり、要素によってはクラスで区別するなどの方法。とにかく意見が欲しい。<b>将来的な管理が容易であることを望む。</b>」</p>
  <h4>結論から: その方向で正しいです。しかも新しい仕組みは要りません</h4>
  <p><span class="okw">ご提案の「器は分ける / 中身は共有する」は、この状況での標準解です。</span>そして重要なのは、<b>このプロジェクトが既にそう作られている</b>ことです。</p>
  <p>UXML は現在 <b>133 ファイル</b>あり、<code>CaveUXML.uxml</code> の中では次のように部品が差し込まれています:</p>
  <blockquote><code>&lt;engine:Instance template="UpgradeUXML"/&gt;</code></blockquote>
  <p><code>UpgradeUXML</code> / <code>GaugeButton</code> / <code>CrusherItemSlotsView</code> などは<b>既に独立した部品として切り出され、複数箇所から共有されています</b>。<span class="kw">つまり「部品を共有する」仕組みは導入済みで、実績もあります。</span>足りていないのは<b>その境界を意識的に引き直すこと</b>だけです。</p>
  <h4>境界の引き方</h4>
  <table><tr><th></th><th>器(レイアウト)</th><th>部品(中身)</th></tr>
  <tr><td>役割</td><td>何をどこに置くか。並び・比率・入れ子</td><td>1つの UI 要素の見た目と構造</td></tr>
  <tr><td>例</td><td><code>CaveUXML.Vertical</code> / <code>CaveUXML.Horizontal</code></td><td><code>UpgradeUXML</code>, <code>GaugeButton</code>, 通貨表示, Depth 表示</td></tr>
  <tr><td>V/H で</td><td><b>分ける</b></td><td><b>共有する(1ファイル)</b></td></tr>
  <tr><td>中身</td><td>コンテナと <code>&lt;Instance&gt;</code> タグだけ。<b>数十行に収まるはず</b></td><td>実際のマークアップとスタイル。<b>ここに9割が入る</b></td></tr>
  <tr><td>C# から</td><td>触らない</td><td><code>Q&lt;T&gt;("Name")</code> で参照する</td></tr></table>
  <p><span class="okw">この分け方なら、器が2倍になっても増える行数はごくわずかです。</span>「管理コストが2倍」になるのは<b>中身ごと複製した場合</b>であって、器だけなら2倍にはなりません。</p>
  <h4>唯一の本当のリスクは「ズレ」です ── そしてこれは自動検出できます</h4>
  <p>器を分けたときに怖いのは、<span class="ng">Vertical にボタンを足して Horizontal に足し忘れる</span>ことです。C# は <code>Q&lt;VisualElement&gt;("NewButton")</code> で探しに行くので、<b>Horizontal でだけ null になり、その画面を開くまで気づきません</b>。これが「複製するな」と言っていた本当の理由でした。</p>
  <blockquote><b>対策: V/H ペアの <code>name</code> 属性の集合が一致しているかを機械的に検証する。</b><br>
  一致しなければ<b>エラーにする</b>(Editor スクリプト、またはテスト)。</blockquote>
  <p>UXML はただの XML なので、<b>name 属性を集めて集合比較するだけの数十行</b>で書けます。これを CI かエディタ起動時に走らせれば、<span class="kw">「片方に足し忘れた」はコミット前に必ず見つかります</span>。</p>
  <p><span class="okw">これが「将来的な管理が容易であること」への直接の回答です。</span>規律を人間の注意力に頼るのをやめ、<b>ズレを検出可能にする</b>。複製そのものは危険ではなく、<b>検出されない複製</b>が危険なのです。</p>
  <h4>どちらを使うかの判断基準</h4>
  <table><tr><th>差分の種類</th><th>手段</th><th>例</th></tr>
  <tr><td><b>木構造が変わる</b>(親子関係・並び順・要素の有無)</td><td><span class="kw">器を分ける</span></td><td>下タブバー → 右レール。インベントリの上下積み → 左右</td></tr>
  <tr><td><b>見た目だけ変わる</b>(余白・文字サイズ・flex 方向)</td><td><span class="kw">USS クラス</span>(<code>.wide</code>)</td><td>通貨表示が2段 → 1段。パネルの余白調整</td></tr>
  <tr><td><b>部品の中身が変わる</b></td><td><span class="ng">原則やらない</span></td><td>やるなら部品自体を2つに分け、器がどちらを差すか選ぶ</td></tr></table>
  <p class="note">迷ったら<b>器を分ける</b>側に倒してください。USS で無理に吸収した木構造の差は、後から読んだときに<span class="ng">「なぜこう書いてあるのか分からない」</span>状態になります。今回は<b>クオリティと可読性を優先</b>する方針なので、素直に2つ書いたほうが良い場面が多いはずです。</p>
  <h4>前版から変わること</h4>
  <table><tr><th></th><th>前版</th><th>今回</th></tr>
  <tr><td>R1</td><td>UXML を複製しない</td><td><b>器は分ける / 部品は共有する。ズレは自動検出</b></td></tr>
  <tr><td>インラインスタイル整理(段階0)</td><td><b>必須</b>。USS で上書きできないため</td><td><span class="okw">大幅に縮小。</span>器を分ければ、器のインラインスタイルはそのままでよい。<b>共有部品のうち V/H で見た目が変わるものだけ</b>整理すれば足りる</td></tr>
  <tr><td>タブ ⇄ 二列の部品</td><td>USS で <code>display</code> を上書きする必要があった</td><td><b>Horizontal の器が最初から2枚を横に並べて書くだけ</b>。上書き合戦が消える</td></tr></table>
  <p><span class="okw">ご提案の方式に変えることで、前版で最大の障害だった「UXML の <code>style</code> 属性は USS クラスで上書きできない」問題が、ほぼ回避できます。</span>前版は単一 UXML に固執していたせいで、その制約と正面衝突していました。</p>
  <h4>作業量の見積もり</h4>
  <p>器を分ける対象は画面数ぶんです: <b>Cave / Equipment / Battle / Prestige / Mission-Trade / Shop / Relic / Nether + MainUI2</b> の<b>9セット程度</b>。ただし全部を最初に作る必要はなく、<a href="#display" onclick="go('display')">段階</a>に沿って1画面ずつ増やせます。<span class="kw">器が無い画面は Vertical の器をそのまま使えばよく、中途半端な状態でも壊れません。</span></p>
  <p class="note">🔴 着手前に確認すること: <b>UI Builder で「器だけの UXML」が扱いやすいか</b>を実際に1画面で試してください。<code>&lt;Instance&gt;</code> だらけのファイルは、UI Builder のプレビュー上で中身が見えない/編集しづらい可能性があります。ここが致命的に使いづらいなら、部品の粒度を粗くする(＝共有単位を大きくする)調整が要ります。<b>Cave 1画面で試してから全体に広げるのが安全です。</b></p>`},
 {id:'ds-rules', h:'運用ルール(改訂)', s:'k', b:`
  <table><tr><th>#</th><th>ルール</th><th>前版から</th></tr>
  <tr><td>R1</td><td><b>UXML は「器」と「部品」に分ける。</b>器(配置)は V/H で分けてよい。<b>部品(中身)は1ファイルを共有する</b></td><td><span class="ng">差し替え(2026-07-30)</span>。前版は「UXML を複製しない」でした</td></tr>
  <tr><td>R1b</td><td><b>V/H の器で <code>name</code> 属性の集合が一致していることを機械的に検証する。</b>不一致はエラーにする</td><td><span class="kw">新規(2026-07-30)</span>。R1 を緩めた代わりに、ズレを注意力ではなく仕組みで防ぐ</td></tr>
  <tr><td>R2</td><td><b>横長 = 縦の圧縮(タブ・上下積み)を1段だけ解いたもの。</b>横長専用の画面や新しい情報設計を作らない</td><td><span class="kw">差し替え</span>。前版は「縦長の画面を並べたもの」でした</td></tr>
  <tr><td>R3</td><td><b>器を追加したら、必ず V/H の両方を用意する。</b>片方だけの状態でコミットしない(R1b が検出する)</td><td><span class="kw">差し替え(2026-07-30)</span>。前版は「タブと上下積みは専用の部品を通して作る」でした</td></tr>
  <tr><td>R4</td><td><b>アスペクト比判定は1箇所。</b><code>LayoutMode</code>(Narrow/Wide)を <code>ReactiveProperty</code> で公開し、各 View は購読するだけ</td><td>維持</td></tr>
  <tr><td>R5</td><td><b>C# にレイアウトを書かない。</b>配置は器の UXML に、見た目の差分は USS クラスに書く</td><td>維持。<span class="okw">器を分けたことで USS での上書きが減り、守りやすくなりました</span></td></tr>
  <tr><td>R6</td><td><b>判定はプラットフォームではなくアスペクト比。</b>折りたたみ端末やタブレット横持ちが自動で恩恵を受ける</td><td>維持</td></tr>
  <tr><td>R7</td><td><b>ナビゲーションの番号は画面によって変えない。</b>キーボードショートカットと1対1で対応させる</td><td><span class="kw">新規</span></td></tr></table>
  <p class="note">2026-07-30 の方針変更で <b>R1 / R3 が入れ替わり、R1b が増えました</b>。「複製しない」という禁止は撤回しましたが、<span class="okw">代わりに「ズレたら必ず気づく」という保証を入れています。</span>禁止で守るのをやめ、検出で守る形にしたということです。<b>R2 / R4 / R5 / R6 / R7 は変わりません。</b></p>`},
 {id:'ds-stage', h:'どの段階まで 1.0 に入れるか', s:'d', b:`
  <p class="note">2026-07-30 <b>D(段階4まで)で確定。</b>あわせて、<a href="#display" onclick="go('display')">UXML の管理方針</a>を「器と部品に分ける」へ変更したことで、<span class="okw">段階0 の内容が大幅に軽くなりました。</span></p>
  <table><tr><th>段階</th><th>内容</th><th>到達点</th></tr>
  <tr><td>0</td><td><b>Cave 1画面で「器 + 部品」の分割を試す。</b>あわせて <b>name 集合の一致チェック(R1b)</b> を用意する</td><td>方式の検証。<span class="kw">UI Builder での扱いやすさをここで確かめる</span></td></tr>
  <tr><td>1</td><td><code>LayoutMode</code> と<b>右レール</b>を実装。コンテンツは縦長のまま中央に置き、左右を余白にする</td><td><b>崩れない状態</b>。ここまでで遊べる</td></tr>
  <tr><td>2</td><td>Cave / Mission-Trade / Prestige の<b>横長の器</b>を作る(タブを二列へ)</td><td>横長らしい画面。<b>体験上の価値はここで出ます</b></td></tr>
  <tr><td>3</td><td>Equipment / Battle の上下積みを左右へ展開。Shop / Relic / Nether も対応</td><td>全画面が横長対応</td></tr>
  <tr><td>4</td><td>ウィンドウ幅が足りないときに自動で縦長レイアウト(=Vertical の器)へ戻す</td><td>リサイズ追従</td></tr></table>
  <p class="note"><b>段階0 を最初に置く理由が変わりました。</b>前版は「インラインスタイルを整理しないと USS で上書きできないから」でしたが、器を分ける方式ではその上書き自体が要りません。<span class="kw">今の段階0 は「方式が実際に運用できるかを1画面で確かめる」ための試作</span>です。ここで UI Builder が使いづらいと分かれば、部品の粒度を粗くする調整が効きます ── <b>9画面ぶん作ってから気づくより圧倒的に安い</b>ので、省略しないでください。</p>
  <p class="note"><span class="okw">段階4 は、器を分けた方式では素直に実現できます。</span>Narrow/Wide で差し替えるのは器そのものなので、幅が足りなくなったら Vertical の器に戻すだけです。前版の USS 上書き方式では「どこまで戻すか」が曖昧になりがちでした。</p>`,
  opt:{items:[
