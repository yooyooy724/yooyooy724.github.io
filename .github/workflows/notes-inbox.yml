name: notes-inbox

# 公開版 /notes/ から送られた変更(Issue)を、リポジトリのデータへ反映する。
# ブラウザ側に認証情報を置かずに書き込むための仕組み。
#
# ⚠️ 公開リポジトリでは誰でも Issue を立てられる。
#    下の if で「作成者 == リポジトリ所有者」を必ず検証すること。ここを外すと第三者が書き込める。

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# 同時に複数の Issue が来ても push が衝突しないよう直列化する
concurrency:
  group: notes-inbox
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      startsWith(github.event.issue.title, '[notes-inbox]') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 反映
        id: apply
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: node scripts/apply-inbox.mjs

      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- notes/; then
            echo "変更なし"
            exit 0
          fi
          git add notes/
          git commit -m "notes: #${{ github.event.issue.number }} を反映"
          # 反映が走っている間に別のコミットが入っていても落ちないようにする
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Issue を閉じる
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --body "${{ steps.apply.outputs.summary }} 公開版への反映は Pages のデプロイ後に見えます。"
          gh issue close "${{ github.event.issue.number }}"

      - name: 失敗した場合は理由を残す
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --body "反映に失敗しました。ワークフローのログを確認してください: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
